      type: "button", class: "pick-chip" + (activePickCat === val ? " active" : ""),
      onclick: () => { activePickCat = val; drawCatChips(); renderResults(); }
    }, label);
    catChipRow.appendChild(mkChip("All", ""));
    cats.forEach(c => catChipRow.appendChild(mkChip(c, c)));
  };
  drawCatChips();
  existingPane.appendChild(catChipRow);

  const qtyHintRow = el("div", { style: { display: "flex", alignItems: "center", gap: "8px", marginBottom: "8px", fontSize: "12px", color: "var(--muted)" } });
  qtyHintRow.appendChild(el("span", {}, "Default qty:"));
  qtyHintRow.appendChild(existQty);
  existingPane.appendChild(qtyHintRow);

  prodSearch.addEventListener("input", renderResults);
  existingPane.appendChild(results);
  renderResults();

  // Called after the "new product" pane adds to the catalogue — the picker's
  // results and its category chips both need to know about it.
  const fillProdSel = () => { drawCatChips(); renderResults(); };

  addWrap.appendChild(existingPane);

  // --- Pane: new / ad-hoc product ---
  const newPane = el("div", { class: "seg-pane", style: { display: "none" } });
  const np = { description: "", unit: "pcs", qty: 1, rate: 0, weight: 0, taxable: true, saveToCatalog: true,
    category: "", subCategory1: "", subCategory2: "", subCategory3: "" };
  const npDescField = el("div", { class: "field" });
  npDescField.appendChild(el("label", {}, "Description *"));
  const npDesc = el("input", { placeholder: "e.g. 4 inch PVC pipe", value: np.description, oninput: (e) => np.description = e.target.value });
  npDescField.appendChild(npDesc);
  newPane.appendChild(npDescField);

  // Category / sub-categories. Without these a product invented mid-document
  // lands outside the tree, misses its level's units, and is quoted at list
  // price even when the customer's rate card covers that category.
  const npUnit = el("select");
  const npDiscNote = el("div", { class: "li-note", style: { padding: "0 0 8px", marginTop: "0" } });
  const refreshNpUnits = () => {
    const path = productPath(np);
    const opts = unitsForCategoryPath(path);
    const def = defaultUnitForCategoryPath(path);
    if (def && opts.includes(def)) np.unit = def;
    if (!opts.includes(np.unit)) np.unit = opts[0] || "pcs";
    npUnit.innerHTML = "";
    opts.forEach(u => {
      const o = el("option", { value: u }, u);
      if (np.unit === u) o.selected = true;
      npUnit.appendChild(o);
    });
  };
  const drawNpDisc = () => {
    npDiscNote.innerHTML = "";
    if (!docBuilder.customerId) {
      npDiscNote.appendChild(el("span", { class: "li-note-none" }, "Pick the customer first to see their category discount."));
      return;
    }
    const { pct } = resolveDiscount(np, customerRules(docBuilder.customerId));
    if (!pct) { npDiscNote.appendChild(el("span", { class: "li-note-none" }, "No category discount for this customer.")); return; }
    const net = +((Number(np.rate) || 0) * (1 - pct / 100)).toFixed(2);
    npDiscNote.appendChild(el("span", { class: "li-note-disc" },
      `${pct}% off this category → ${activeBiz().currency} ${fmt(net)}/${np.unit}`));
  };
  const onNpCat = () => { refreshNpUnits(); drawNpDisc(); };
  const npSuggest = (k) => bizProducts().map(p => p[k]).filter(Boolean);
  newPane.appendChild(el("div", { class: "row" }, [
    comboField("Category", "category", np, npSuggest("category"), { placeholder: "e.g. PVC", onChange: onNpCat }),
    comboField("Sub Category 1", "subCategory1", np, npSuggest("subCategory1"), { onChange: onNpCat }),
  ]));
  newPane.appendChild(el("div", { class: "row" }, [
    comboField("Sub Category 2", "subCategory2", np, npSuggest("subCategory2"), { onChange: onNpCat }),
    comboField("Sub Category 3", "subCategory3", np, npSuggest("subCategory3"), { onChange: onNpCat }),
  ]));

  const npRow = el("div", { class: "row" });
  const npUnitField = el("div", { class: "field" });
  npUnitField.appendChild(el("label", {}, "Unit"));
  refreshNpUnits();
  npUnit.addEventListener("change", (e) => { np.unit = e.target.value; drawNpDisc(); });
  npUnitField.appendChild(npUnit);
  npRow.appendChild(npUnitField);
  const npQtyField = el("div", { class: "field" });
  npQtyField.appendChild(el("label", {}, "Qty"));
  const npQty = el("input", { type: "number", inputmode: "decimal", value: np.qty, oninput: (e) => np.qty = parseFloat(e.target.value) || 0 });
  npQtyField.appendChild(npQty);
  npRow.appendChild(npQtyField);
  const npRateField = el("div", { class: "field" });
  npRateField.appendChild(el("label", {}, "Rate (list) *"));
  const npRate = el("input", { type: "number", inputmode: "decimal", value: np.rate, oninput: (e) => { np.rate = parseFloat(e.target.value) || 0; drawNpDisc(); } });
  npRateField.appendChild(npRate);
  npRow.appendChild(npRateField);
  newPane.appendChild(npRow);
  drawNpDisc();
  newPane.appendChild(npDiscNote);
  const npSaveChip = el("label", { class: "chip-check" });
  const npSaveCb = el("input", { type: "checkbox", checked: "" });
  npSaveCb.checked = true;
  npSaveCb.addEventListener("change", (e) => np.saveToCatalog = e.target.checked);
  npSaveChip.appendChild(npSaveCb);
  npSaveChip.appendChild(el("span", {}, "Also save this as a product in my catalog"));
  newPane.appendChild(npSaveChip);
  const npAddBtn = el("button", { class: "btn btn-green btn-full", style: { marginTop: 8 }, onclick: () => {
    if (!np.description.trim()) { toast("Description required", "err"); return; }
    const listRate = Number(np.rate) || 0;
    const { pct } = resolveDiscount(np, customerRules(docBuilder.customerId));
    docBuilder.lineItems.push({
      partNumber: String(docBuilder.lineItems.length + 1),
      description: np.description.trim(), unit: np.unit, qty: np.qty || 1,
      rate: pct ? +(listRate * (1 - pct / 100)).toFixed(2) : listRate,
      listRate, discountPct: pct, catPath: productPath(np),
      taxable: np.taxable, weight: np.weight || 0
    });
    if (np.saveToCatalog) {
      db.products.push({
        id: uid("prod"), businessId: db.activeBusinessId, partNumber: "", description: np.description.trim(),
        unit: np.unit, rate: listRate, weight: np.weight || 0, taxable: np.taxable, hsn: "", notes: "",
        category: (np.category || "").trim(), subCategory1: (np.subCategory1 || "").trim(),
        subCategory2: (np.subCategory2 || "").trim(), subCategory3: (np.subCategory3 || "").trim(),
        packQty: 0, packUnit: "box"
      });
      saveDB();
      fillProdSel();
    }
    recomputeTotals(); rerenderLI(); updateTotals(); updateGross();
    npDesc.value = ""; np.description = ""; npQty.value = 1; np.qty = 1; npRate.value = 0; np.rate = 0;
    drawNpDisc();
    toast(pct ? `Added — ${pct}% off applied` : (np.saveToCatalog ? "Added & saved to catalog" : "Line item added"));
  }}, "+ Add to document");
  newPane.appendChild(npAddBtn);
  addWrap.appendChild(newPane);

  // --- Pane: bulk paste ---
  const bulkPane = el("div", { class: "seg-pane", style: { display: "none" } });
  bulkPane.appendChild(el("div", { style: { fontSize: "12px", color: "var(--muted)", marginBottom: "6px" } },
    "One item per line: Description, Qty, Rate, Unit (unit optional). If the description matches a saved product, its rate/unit/tax and the customer's category discount are applied automatically. Type a rate to override it."));
  const bulkTa = el("textarea", { rows: 6, placeholder: "4 inch PVC pipe, 50, 350, m\n1/2 inch CPVC elbow, 100, 45" });
  bulkPane.appendChild(bulkTa);
  const bulkAddBtn = el("button", { class: "btn btn-green btn-full", style: { marginTop: 8 }, onclick: async (e) => {
    const lines = bulkTa.value.split("\n").map(l => l.trim()).filter(Boolean);
    if (!lines.length) { toast("Paste some lines first", "err"); return; }
    const catalogue = bizProducts();
    const rules = customerRules(docBuilder.customerId);
    let added = 0, skipped = 0;
    await runBulk(e.currentTarget, "Adding", lines, (line) => {
      const parts = line.split(",").map(p => p.trim());
      const [description, qtyStr = "1", rateStr, unit] = parts;
      if (!description) { skipped++; return; }
      const match = catalogue.find(p => p.description.toLowerCase() === description.toLowerCase());
      // A pasted rate is the user's own number — keep it as typed. Otherwise
      // price from the catalogue and apply the customer's category discount.
      const typedRate = rateStr !== undefined && rateStr !== "";
      const listRate = match ? Number(match.rate) || 0 : 0;
      const pct = match && !typedRate ? resolveDiscount(match, rules).pct : 0;
      docBuilder.lineItems.push({
        partNumber: (match && match.partNumber) || String(docBuilder.lineItems.length + 1),
        description: match ? match.description : description,
        unit: unit || (match ? match.unit : "pcs"),
        qty: parseFloat(qtyStr) || 1,
        rate: typedRate ? (parseFloat(rateStr) || 0) : (pct ? +(listRate * (1 - pct / 100)).toFixed(2) : listRate),
        manualRate: typedRate || undefined,
        ...(match ? { listRate, discountPct: pct, catPath: productPath(match) } : {}),
        taxable: match ? match.taxable : true,
        weight: match ? (match.weight || 0) : 0
      });
      added++;
    });
    recomputeTotals(); rerenderLI(); updateTotals(); updateGross();
    bulkTa.value = "";
    toast(skipped ? `Added ${added}, skipped ${skipped}` : `Added ${added} line item${added === 1 ? "" : "s"}`);
  }}, "+ Add all to document");
  bulkPane.appendChild(bulkAddBtn);
  addWrap.appendChild(bulkPane);

  const setMode = (mode) => {
    tabExisting.classList.toggle("active", mode === "existing");
    tabNew.classList.toggle("active", mode === "new");
    tabBulk.classList.toggle("active", mode === "bulk");
    existingPane.style.display = mode === "existing" ? "" : "none";
    newPane.style.display = mode === "new" ? "" : "none";
    bulkPane.style.display = mode === "bulk" ? "" : "none";
  };
  tabExisting.addEventListener("click", () => setMode("existing"));
  tabNew.addEventListener("click", () => setMode("new"));
  tabBulk.addEventListener("click", () => setMode("bulk"));

  liCard.appendChild(addWrap);
  wrap.appendChild(liCard);

  wrap = steps.charges;
  wrap.appendChild(checkboxField("Separate VAT from prices", "separateVat", docBuilder, () => { recomputeTotals(); updateTotals(); }));
  // Totals
  const totCard = el("div", { class: "card totals" });
  const totCt = el("div", { id: "tot-ct" });
  const totDisplays = {};
  const updateTotals = () => {
    totCt.innerHTML = "";
    const t = docBuilder.totals;
    if (docBuilder._onTotals) docBuilder._onTotals();
    const rowT = (l, v, key) => {
      const r = el("div", { class: "totals-row" });
      r.appendChild(el("div", {}, l));
      const ve = el("div", {}, `${docBuilder.currency} ${fmt(v)}`);
      if (key) totDisplays[key] = ve;
      r.appendChild(ve);
      return r;
    };
    const rowInp = (l, k) => {
      const r = el("div", { class: "totals-row" });
      r.appendChild(el("div", {}, l));
      const i = el("input", { type: "number", inputmode: "decimal", value: t[k] || 0, style: { width: "100px", textAlign: "right" }, oninput: (e) => { t[k] = parseFloat(e.target.value) || 0; recomputeTotals(); refreshTotals(); }});
      r.appendChild(i);
      return r;
    };
    totCt.appendChild(rowT("Subtotal", t.subtotal, "subtotal"));
    totCt.appendChild(rowT("Taxable", t.taxable, "taxable"));
    const taxRow = el("div", { class: "totals-row" });
    taxRow.appendChild(el("div", {}, "Tax rate %"));
    taxRow.appendChild(el("input", { type: "number", inputmode: "decimal", value: t.taxRate, style: { width: "100px", textAlign: "right" }, oninput: (e) => { t.taxRate = parseFloat(e.target.value) || 0; recomputeTotals(); refreshTotals(); }}));
    totCt.appendChild(taxRow);
    totCt.appendChild(rowT("Tax", t.tax, "tax"));
    totCt.appendChild(rowInp("Delivery", "delivery"));
    if (docBuilder.type !== "QT") {
      totCt.appendChild(rowInp("Freight", "freight"));
      totCt.appendChild(rowInp("Insurance", "insurance"));
      totCt.appendChild(rowInp("Legal/Consular", "legal"));
      totCt.appendChild(rowInp("Inspection/Cert.", "inspection"));
    }
    totCt.appendChild(rowT("TOTAL", t.total, "total"));
    const gr = el("div", { class: "totals-row grand" });
    gr.appendChild(el("div", {}, "GRAND TOTAL"));
    const grv = el("div", {}, `${docBuilder.currency} ${fmt(t.total)}`);
    totDisplays.grand = grv;
    gr.appendChild(grv);
    totCt.appendChild(gr);
  };
  const refreshTotals = () => {
    const t = docBuilder.totals;
    if (docBuilder._onTotals) docBuilder._onTotals();
    if (totDisplays.subtotal) totDisplays.subtotal.textContent = `${docBuilder.currency} ${fmt(t.subtotal)}`;
    if (totDisplays.taxable) totDisplays.taxable.textContent = `${docBuilder.currency} ${fmt(t.taxable)}`;
    if (totDisplays.tax) totDisplays.tax.textContent = `${docBuilder.currency} ${fmt(t.tax)}`;
    if (totDisplays.total) totDisplays.total.textContent = `${docBuilder.currency} ${fmt(t.total)}`;
    if (totDisplays.grand) totDisplays.grand.textContent = `${docBuilder.currency} ${fmt(t.total)}`;
  };
  updateTotals();
  totCard.appendChild(totCt);
  wrap.appendChild(totCard);

  // ---- Delivery step (delivery notes only) ----
  if (isDelivery) {
    if (!docBuilder.delivery) docBuilder.delivery = { mode: "own", driverName: "", driverPhone: "", transportCompany: "", vehicleNo: "" };
    wrap = steps.delivery;
    const dl = docBuilder.delivery;
    const dCard = el("div", { class: "card" });
    dCard.appendChild(el("div", { class: "card-title" }, "Delivery details"));

    const modeRow = el("div", { class: "seg-tabs", style: { marginBottom: "12px" } });
    const drawDeliveryFields = () => {
      fieldsBox.innerHTML = "";
      if (dl.mode === "transport") {
        fieldsBox.appendChild(inputField("Transport company", "transportCompany", dl));
        fieldsBox.appendChild(el("div", { class: "row" }, [
          inputField("Driver name (optional)", "driverName", dl),
          inputField("Driver phone (optional)", "driverPhone", dl),
        ]));
      } else {
        fieldsBox.appendChild(el("div", { class: "row" }, [
          inputField("Driver name", "driverName", dl),
          inputField("Driver phone", "driverPhone", dl),
        ]));
      }
      fieldsBox.appendChild(inputField("Vehicle / plate no. (optional)", "vehicleNo", dl));
    };
    const mkMode = (key, label) => {
      const b = el("button", { class: "seg-tab" + (dl.mode === key ? " active" : ""), type: "button", onclick: () => {
        dl.mode = key;
        modeRow.querySelectorAll(".seg-tab").forEach(x => x.classList.remove("active"));
        b.classList.add("active");
        drawDeliveryFields();
      }}, label);
      return b;
    };
    modeRow.appendChild(mkMode("own", "Own delivery"));
    modeRow.appendChild(mkMode("transport", "Transport company"));
    dCard.appendChild(modeRow);
    const fieldsBox = el("div");
    dCard.appendChild(fieldsBox);
    drawDeliveryFields();
    wrap.appendChild(dCard);
  }

  wrap = steps.details;

  // Export block toggle
  const expWrap = el("div", { class: "card", style: { padding: "12px", background: "#f9fafb" } });
  expWrap.appendChild(checkboxField("Show Export Details (Country of Origin, Ports, EXIM)", "showExport", docBuilder, () => {
    expWrap.querySelectorAll(".export-fields").forEach(x => x.style.display = docBuilder.showExport ? "" : "none");
  }));
  const expFields = el("div", { class: "export-fields", style: { display: docBuilder.showExport ? "" : "none" } });
  expFields.appendChild(el("div", { class: "row" }, [
    inputField("Country of Origin", "origin", docBuilder.additional),
    inputField("Port of Embarkation", "embarkation", docBuilder.additional),
    inputField("Port of Discharge", "discharge", docBuilder.additional),
  ]));
  expFields.appendChild(inputField("Reason for Export", "reason", docBuilder.additional));
  expWrap.appendChild(expFields);
  wrap.appendChild(expWrap);

  // Terms of Sale — toggle + editable text (defaults to on).
  if (docBuilder.showTerms === undefined) docBuilder.showTerms = true;
  if (!docBuilder.terms) docBuilder.terms = defaultTermsFor(activeBiz());
  const termsWrap = el("div", { class: "card", style: { padding: "12px", background: "#f9fafb" } });
  termsWrap.appendChild(checkboxField("Show Terms of Sale & other comments", "showTerms", docBuilder, () => {
    termsBody.style.display = docBuilder.showTerms ? "" : "none";
  }));
  const termsBody = el("div", { style: { display: docBuilder.showTerms ? "" : "none" } });
  const bizPresets = (activeBiz().termsPresets || []);
  if (bizPresets.length) {
    const pickRow = el("div", { style: { display: "flex", gap: "6px", marginBottom: "8px" } });
    const sel = el("select", { style: { flex: "1" } });
    sel.appendChild(el("option", { value: "" }, "Apply a saved preset…"));
    bizPresets.forEach((p, i) => sel.appendChild(el("option", { value: String(i) }, p.name)));
    pickRow.appendChild(sel);
    pickRow.appendChild(el("button", { class: "btn btn-secondary", type: "button", style: { flex: "none" }, onclick: () => {
      if (sel.value === "") return;
      docBuilder.terms = bizPresets[Number(sel.value)].text;
      const ta = termsBody.querySelector("textarea");
      if (ta) ta.value = docBuilder.terms;
      sel.value = "";
    }}, "Apply"));
    termsBody.appendChild(pickRow);
  }
  termsBody.appendChild(inputField("Terms text", "terms", docBuilder, { textarea: true, rows: 4 }));
  termsWrap.appendChild(termsBody);
  wrap.appendChild(termsWrap);

  // Banking details — on by default whenever the business has an account saved,
  // pre-selected to the Settings default. Both are overridable per document.
  const banks = Array.isArray(activeBiz().banks) ? activeBiz().banks.filter(b => b.bankName || b.accountNumber) : [];
  if (docBuilder.showBanks === undefined) docBuilder.showBanks = hasUsableBank(activeBiz());
  if (docBuilder.bankId === undefined || docBuilder.bankId === null) docBuilder.bankId = activeBiz().defaultBankId || "";
  const bankWrap = el("div", { class: "card", style: { padding: "12px", background: "#f9fafb" } });
  bankWrap.appendChild(checkboxField("Show banking details", "showBanks", docBuilder, () => {
    bankBody.style.display = docBuilder.showBanks ? "" : "none";
  }));
  const bankBody = el("div", { style: { display: docBuilder.showBanks ? "" : "none" } });
  if (!banks.length) {
    bankBody.appendChild(el("div", { style: { fontSize: "12px", color: "var(--muted)" } }, "No bank accounts saved. Add one in Settings → Bank accounts."));
  } else {
    const bf = el("div", { class: "field" });
    bf.appendChild(el("label", {}, "Account to show"));
    const bs = el("select", { onchange: (e) => docBuilder.bankId = e.target.value || "" });
    bs.appendChild(el("option", { value: "" }, "All accounts"));
    banks.forEach(b => {
      const o = el("option", { value: b.id }, [b.bankName, b.accountNumber].filter(Boolean).join(" — "));
      if (docBuilder.bankId === b.id) o.selected = true;
      bs.appendChild(o);
    });
    bf.appendChild(bs);
    bankBody.appendChild(bf);
  }
  bankWrap.appendChild(bankBody);
  wrap.appendChild(bankWrap);

  // Status
  const stField = el("div", { class: "field" });
  stField.appendChild(el("label", {}, "Status"));
  const stSel = el("select", { onchange: (e) => docBuilder.status = e.target.value });
  ["Draft", "Sent", "Confirmed", "Cancelled"].forEach(s => {
    const o = el("option", { value: s }, s);
    if (docBuilder.status === s) o.selected = true;
    stSel.appendChild(o);
  });
  stField.appendChild(stSel);
  wrap.appendChild(stField);

  // ---- Assemble the stepped shell ----
  const saveDoc = () => {
    if (!docBuilder.customerId) { goStep("party"); toast("Select a customer first", "err"); return; }
    if (docBuilder.lineItems.length === 0) { goStep("items"); toast("Add at least one line item", "err"); return; }
    recomputeTotals();
    // Drop transient builder-only keys before persisting.
    delete docBuilder._onTotals;
    const idx = docBuilder._editing ? db.documents.findIndex(d => d.id === docBuilder.id) : -1;
    let saved;
    if (idx >= 0) {
      saved = db.documents[idx] = { ...docBuilder };
    } else {
      // Either a brand-new document, or one that was deleted elsewhere while it
      // was open here — save it rather than throwing the work away.
      docBuilder.id = docBuilder.id || uid("doc");
      saved = { ...docBuilder };
      db.documents.push(saved);
      if (!docBuilder._editing) {
        const biz = activeBiz();
        biz[DOC_TYPES[docBuilder.type].seqKey] = docBuilder._seq + 1;
      }
    }
    saveDB();
    closeModal();
    openDocPreview(saved);
    toast(`${DOC_TYPES[saved.type].shortLabel} #${saved.number} saved`);
  };

  const shell = el("div", { class: "builder-shell" });
  const tabsBar = el("div", { class: "step-tabs" });
  const body = el("div", { class: "step-body" });
  STEP_ORDER.forEach(k => body.appendChild(steps[k]));

  const footer = el("div", { class: "step-footer" });
  const totalLine = el("div", { class: "step-total" });
  const footBtns = el("div", { class: "step-foot-btns" });

  let current = "party";
  const stepTabEls = {};

  const refreshFooter = () => {
    const t = docBuilder.totals || {};
    totalLine.innerHTML = "";
    const n = docBuilder.lineItems.length;
    totalLine.appendChild(el("div", { class: "step-total-amt" },
      `${docBuilder.currency} ${fmt(t.total || 0)}`));
    const bits = [`${n} item${n === 1 ? "" : "s"}`];
    if (t.discountGiven > 0) bits.push(`${fmt(t.discountGiven)} off`);
    totalLine.appendChild(el("div", { class: "step-total-sub" }, bits.join(" • ")));
  };

  const goStep = (k) => {
    current = k;
    STEP_ORDER.forEach(s => {
      steps[s].style.display = s === k ? "" : "none";
      if (stepTabEls[s]) stepTabEls[s].classList.toggle("active", s === k);
    });
    // footer buttons adapt to position
    footBtns.innerHTML = "";
    const pos = STEP_ORDER.indexOf(k);
    if (pos > 0) footBtns.appendChild(el("button", { class: "btn btn-secondary", onclick: () => goStep(STEP_ORDER[pos - 1]) }, "Back"));
    if (pos < STEP_ORDER.length - 1) {
      footBtns.appendChild(el("button", { class: "btn btn-primary", onclick: () => goStep(STEP_ORDER[pos + 1]) }, "Next"));
      footBtns.appendChild(el("button", { class: "btn btn-secondary step-save-alt", onclick: saveDoc, title: "Save now" }, "Save"));
    } else {
      footBtns.appendChild(el("button", { class: "btn btn-primary", onclick: saveDoc }, "Save & Preview"));
    }
    refreshFooter();
    body.scrollTop = 0;
  };

  STEP_ORDER.forEach(k => {
    const tab = el("button", { class: "step-tab", onclick: () => goStep(k) });
    tab.appendChild(el("span", { class: "step-tab-label" }, STEP_LABELS[k]));
    stepTabEls[k] = tab;
    tabsBar.appendChild(tab);
  });

  footer.appendChild(totalLine);
  footer.appendChild(footBtns);
  shell.appendChild(tabsBar);
  shell.appendChild(body);
  shell.appendChild(footer);

  // keep the footer total live as items/charges change
  docBuilder._onTotals = refreshFooter;
  goStep("party");

  openModal(`${docBuilder._editing ? "Edit" : "New"} ${DOC_TYPES[docBuilder.type].label}`, shell, { wide: true });
};

// ==================== PREVIEW ====================
// Print via an isolated window holding ONLY the document pages — instead of
// relying on @media print to hide the whole app shell around a fixed-position
// modal, which some mobile browsers/webviews don't reflow reliably (that path
// was producing blank pages). This window has nothing else in it to hide.
const printDoc = (pv) => {
  const w = window.open("", "_blank");
  if (!w) { toast("Popup blocked — allow popups for this page, then tap Print again", "err"); return; }
  const mainStyle = document.querySelector("style");
  w.document.open();
  w.document.write("<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Print</title></head><body></body></html>");
  w.document.close();
  const style = w.document.createElement("style");
  style.textContent = (mainStyle ? mainStyle.textContent : "") + `
    html, body { margin: 0; padding: 0; background: #fff; }
    .pv-scaler { transform: none !important; height: auto !important; }
    .pv-book { display: flex; flex-direction: column; gap: 0; align-items: center; }
    .pv-page { box-shadow: none !important; page-break-after: always; break-after: page; overflow: visible !important; }
    .pv-page:last-child { page-break-after: auto; break-after: auto; }
    @page { size: A4; margin: 0; }
  `;
  w.document.head.appendChild(style);
  w.document.body.appendChild(pv.cloneNode(true));
  const doPrint = () => { w.focus(); w.print(); };
  // Give fonts/layout a moment to settle before printing.
  if (w.document.readyState === "complete") setTimeout(doPrint, 200);
  else w.addEventListener("load", () => setTimeout(doPrint, 200));
};

const openDocPreview = (d) => {
  const biz = activeBiz();
  const cust = db.customers.find(c => c.id === d.customerId);
  const cfg = DOC_TYPES[d.type];
  const wrap = el("div");

  let pv;
  try {
    pv = renderPreview(d, biz, cust);
  } catch (e) {
    console.error("Preview failed for", d.type, d.number, e);
    const errBox = el("div", { style: { padding: "24px" } });
    errBox.appendChild(el("div", { style: { fontWeight: 700, color: "#b91c1c", marginBottom: "8px" } }, "Couldn't build the preview."));
    errBox.appendChild(el("div", { style: { fontSize: "13px", color: "#555" } },
      `Something in this document is missing or damaged (${e.message}). Open it with Edit, check the customer and line items, and save again.`));
    const fix = el("div", { class: "action-bar" });
    fix.appendChild(el("button", { class: "btn btn-secondary", onclick: closeModal }, "Close"));
    fix.appendChild(el("button", { class: "btn btn-primary", onclick: () => { closeModal(); editDoc(d); } }, "Edit this document"));
    errBox.appendChild(fix);
    openModal(`${d.type} #${d.number}`, errBox, { wide: true });
    return;
  }

  // Chain link — if this doc was converted from another, show the source and
  // let the user jump to it.
  if (d.fromDoc) {
    const link = el("div", { class: "doc-chain-link", onclick: () => {
      const srcDoc = db.documents.find(x => x.id === d.fromDoc.id);
      if (srcDoc) { closeModal(); openDocPreview(srcDoc); }
      else toast("Source document no longer exists", "err");
    }});
    link.appendChild(el("span", {}, `\u21B3 Converted from ${DOC_TYPES[d.fromDoc.type].shortLabel} #${d.fromDoc.number}`));
    link.appendChild(el("span", { class: "doc-chain-go" }, "View \u2192"));
    wrap.appendChild(link);
  }
  // Documents converted FROM this one.
  const children = db.documents.filter(x => x.fromDoc && x.fromDoc.id === d.id);
  if (children.length) {
    const kids = el("div", { class: "doc-chain-link kids" });
    kids.appendChild(el("span", {}, "Converted into: " + children.map(k => `${DOC_TYPES[k.type].shortLabel} #${k.number}`).join(", ")));
    wrap.appendChild(kids);
  }

  // Preview — the page element keeps its true A4 width; a scaler shrinks it
  // to fit the viewport so phones show the whole document, not a slice.
  const pw = el("div", { class: "preview-wrap" });
  const scaler = el("div", { class: "pv-scaler" });
  scaler.appendChild(pv);
  pw.appendChild(scaler);
  wrap.appendChild(pw);
  attachPreviewScaler(pw, scaler, pv);

  // Actions — SVG icons, labels hide on narrow screens; WhatsApp keeps label
  const actions = el("div", { class: "action-bar no-print" });
  actions.appendChild(iconLabelBtn({ class: "btn btn-secondary", icon: "edit", label: "Edit", onclick: () => { closeModal(); editDoc(d); } }));
  const pdfBtn = iconLabelBtn({ class: "btn btn-primary", icon: "download", label: "PDF" });
  pdfBtn.addEventListener("click", () => downloadPDF(pv, d, pdfBtn));
  actions.appendChild(pdfBtn);
  actions.appendChild(iconLabelBtn({ class: "btn btn-secondary icon-only", icon: "print", label: "Print", title: "Print this document", onclick: () => printDoc(pv) }));
  const pngBtn = iconLabelBtn({ class: "btn btn-secondary", icon: "image", label: "PNG" });
  pngBtn.addEventListener("click", () => downloadPNG(pv, d, pngBtn));
  actions.appendChild(pngBtn);
  const waBtn = iconLabelBtn({ class: "btn btn-green keep-label", icon: "whatsapp", label: "WhatsApp", title: "Send the document image with details" });
  waBtn.addEventListener("click", () => shareWhatsAppImage(pv, d, cust, biz, waBtn));
  actions.appendChild(waBtn);
  // Convert buttons live inside the same bar (full-width row) so they're never
  // hidden behind the sticky action bar.
  const convertTargets = (cfg.convertsTo || []);
  if (d.id && convertTargets.length) {
    convertTargets.forEach(tt => {
      actions.appendChild(el("button", { class: "btn btn-secondary keep-label convert-btn", onclick: () => { closeModal(); convertDoc(d, tt); } },
        `Convert to ${DOC_TYPES[tt].shortLabel}`));
    });
  }
  wrap.appendChild(actions);

  openModal(`${d.type} #${d.number}`, wrap, { wide: true });
};

// ==================== PREVIEW (paginated A4 book) ====================
// Builds a stack of A4 pages (.pv-book) so long documents don't get cut mid-row
// during PDF export. Short documents produce a single-page book that looks
// exactly like the old preview. Every page has a footer with "Page X of N".
const renderPreview = (d, biz, cust) => {
  const PAGE_W = 794, PAGE_H = 1123;
  const PAD_TOP = 28, PAD_BOTTOM = 46, PAD_X = 30;
  const CONTENT_H = PAGE_H - PAD_TOP - PAD_BOTTOM;
  const isQuote = d.type === "QT";
  const cfg = DOC_TYPES[d.type];

  // -------- Section builders --------
  const buildLetterhead = () => {
    const wrap = el("div");
    // Head
    const head = el("div", { class: "pv-head" });
    const left = el("div", { class: "pv-logo-area", style: { position: "relative" } });
    if (biz.logo) left.appendChild(el("img", { src: biz.logo, class: "pv-logo", alt: (biz.name || "Business") + " logo", style: { maxHeight: (60 * (biz.logoScale || 1)) + "px" } }));
    left.appendChild(el("div", { class: "pv-bizname" }, biz.name));
    head.appendChild(left);
    head.appendChild(el("div", { class: "pv-title" }, cfg.title));
    wrap.appendChild(head);
    // Meta
    const meta = el("div", { class: "pv-meta" });
    const metaL = el("div");
    if (biz.address1) metaL.appendChild(el("div", {}, biz.address1));
    if (biz.address2) metaL.appendChild(el("div", {}, biz.address2));
    if (biz.phone) metaL.appendChild(el("div", {}, "Phone: " + biz.phone));
    if (biz.pan) metaL.appendChild(el("div", {}, "PAN: " + biz.pan));
    if (biz.website) metaL.appendChild(el("div", {}, "Website: " + biz.website));
    meta.appendChild(metaL);
    const metaR = el("div", { class: "pv-meta-r" });
    const metaTbl = el("table");
    const metaRow = (l, v) => { const r = el("tr"); r.appendChild(el("td", {}, l)); r.appendChild(el("td", {}, v || "-")); metaTbl.appendChild(r); };
    metaRow("Date", d.date);
    if (d.expiryDate) metaRow(cfg.expiryLabel || "Expiration Date", d.expiryDate);
    metaRow(cfg.numLabel, d.number);
    if (cust) metaRow(`${cfg.partyLabel} ID`, String(cust.id));
    metaR.appendChild(metaTbl);
    meta.appendChild(metaR);
    wrap.appendChild(meta);
    // 3-col boxes
    const shipping = d.shipping || {};
    const hasShip = !isQuote || !!(shipping.deliveryLocation || shipping.shipDate || shipping.grossWeight || shipping.totalPackages || shipping.freightType);
    const c3wrap = el("div");
    const hdrRow = el("div", { style: { display: "grid", gridTemplateColumns: hasShip ? "1fr 1fr 1fr" : "1fr" } });
    hdrRow.appendChild(el("div", { class: "pv-section-hdr" }, cfg.partyLabel.toUpperCase()));
    if (hasShip) {
      hdrRow.appendChild(el("div", { class: "pv-section-hdr" }, "SHIP TO"));
      hdrRow.appendChild(el("div", { class: "pv-section-hdr" }, "SHIPPING DETAILS"));
    }
    c3wrap.appendChild(hdrRow);
    const c3 = el("div", { class: "pv-3col", style: hasShip ? {} : { gridTemplateColumns: "1fr" } });
    const custBox = el("div");
    if (cust) {
      custBox.appendChild(el("div", {}, cust.contactName));
      custBox.appendChild(el("div", {}, cust.companyName));
      if (cust.addr1) custBox.appendChild(el("div", {}, cust.addr1));
      if (cust.addr2) custBox.appendChild(el("div", {}, cust.addr2));
      custBox.appendChild(el("div", {}, cust.phone));
      if (cust.vatNo) custBox.appendChild(el("div", {}, "VAT/PAN: " + cust.vatNo));
    }
    c3.appendChild(custBox);
    if (hasShip) {
      const shipBox = el("div");
      // Per-document delivery location takes priority in SHIP TO.
      if (shipping.deliveryLocation) shipBox.appendChild(el("div", { style: { fontWeight: 600 } }, shipping.deliveryLocation));
      if (cust) {
        if (cust.regNo) shipBox.appendChild(el("div", {}, "REGISTRATION NO. " + cust.regNo));
        const sa1 = cust.sameAsBill ? cust.addr1 : cust.shipAddr1;
        const sa2 = cust.sameAsBill ? cust.addr2 : cust.shipAddr2;
        if (sa1) shipBox.appendChild(el("div", {}, sa1));
        if (cust.email) shipBox.appendChild(el("div", {}, cust.email));
        if (sa2) shipBox.appendChild(el("div", {}, sa2));
        if (cust.eximCode) shipBox.appendChild(el("div", {}, "EXIM CODE - " + cust.eximCode));
      }
      c3.appendChild(shipBox);
      const detailBox = el("div");
      const dRow = (l, v) => { const r = el("div", { style: { display: "table", width: "100%" } }); r.appendChild(el("span", { style: { display: "table-cell", fontWeight: 600 } }, l)); r.appendChild(el("span", { style: { display: "table-cell", textAlign: "right" } }, v || "-")); return r; };
      detailBox.appendChild(dRow("Freight Type", shipping.freightType));
      detailBox.appendChild(dRow("Est Ship Date", shipping.shipDate));
      detailBox.appendChild(dRow("Est Gross Weight", shipping.grossWeight));
      detailBox.appendChild(dRow("Est Cubic Weight", shipping.cubicWeight));
      detailBox.appendChild(dRow("Total Packages", shipping.totalPackages));
      c3.appendChild(detailBox);
    }
    c3wrap.appendChild(c3);
    wrap.appendChild(c3wrap);
    return wrap;
  };

  const buildContHeader = (pageNum, totalPages) => {
    const h = el("div", { class: "pv-cont-hdr" });
    h.appendChild(el("div", { class: "biz" }, biz.name));
    const right = el("div", { style: { display: "flex", alignItems: "center", gap: "8px" } });
    right.appendChild(el("span", { class: "cont-badge" }, "CONTINUED"));
    right.appendChild(el("span", { class: "doc" }, `${cfg.title} · #${d.number}`));
    h.appendChild(right);
    return h;
  };

  // Sort line items by their existing per-row category tag (catPath[0]) so
  // same-category rows sit together, alphabetically, "Uncategorized" last.
  // Ties keep their original relative order. No separate header row —
  // the existing pv-cat-chip on each row is what shows the category.
  const buildDisplayRows = () => {
    const withIdx = (d.lineItems || []).map((li, i) => ({ li, origIdx: i }));
    const catOf = (li) => (Array.isArray(li.catPath) && li.catPath[0]) ? li.catPath[0] : "";
    withIdx.sort((a, b) => {
      const ca = catOf(a.li), cb = catOf(b.li);
      if (ca === cb) return a.origIdx - b.origIdx;
      if (!ca) return 1;
      if (!cb) return -1;
      return ca.localeCompare(cb);
    });
    return withIdx;
  };
  const displayRows = buildDisplayRows();

  const hidePrices = !!cfg.hidePrices;
  const buildItemsTable = () => {
    const items = el("div", { class: "pv-items" });
    const table = el("table");
    const thead = el("thead");
    const trH = el("tr");
    const cols = hidePrices
      ? ["S.N.", "DESCRIPTION", "QTY", "UNIT"]
      : ["S.N.", "DESCRIPTION", "QTY", "UNIT", "UNIT PRICE", "TAX", "TOTAL AMOUNT"];
    cols.forEach(h => trH.appendChild(el("th", {}, h)));
    thead.appendChild(trH);
    table.appendChild(thead);
    table.appendChild(el("tbody"));
    items.appendChild(table);
    return items;
  };

  const buildItemRow = (li, serial) => {
    if (!li) return el("tr");
    const r = el("tr");
    r.appendChild(el("td", {}, String(serial)));
    // Description cell: category tag (if any) on top, then description text
    const descCell = el("td");
    const cat = Array.isArray(li.catPath) && li.catPath.length ? li.catPath[0] : "";
    if (cat) descCell.appendChild(el("span", { class: "pv-cat-chip" }, cat));
    descCell.appendChild(el("span", { class: "pv-desc-text" }, li.description));
    r.appendChild(descCell);
    r.appendChild(el("td", { class: "num" }, String(li.qty)));
    r.appendChild(el("td", {}, li.unit));
    if (!hidePrices) {
      r.appendChild(el("td", { class: "num" }, fmt(li.rate)));
      const sep = !!d.separateVat;
      const tr = (d.totals && d.totals.taxRate || 0) / 100;
      let taxCell = li.taxable ? "X" : "";
      if (sep && li.taxable && tr > 0) {
        const perUnit = li.rateIncludesVat ? (li.rate - li.rate / (1 + tr)) : (li.rate * tr);
        taxCell = fmt(perUnit);
      }
      r.appendChild(el("td", { class: sep ? "num" : "", style: sep ? {} : { textAlign: "center" } }, taxCell));
      r.appendChild(el("td", { class: "num" }, fmt(li.qty * li.rate)));
    }
    return r;
  };

  const buildDisplayRow = (entry, serial) => buildItemRow(entry.li, serial);

  const buildTotalsBlock = () => {
    const t = d.totals;
    const wrap = el("div", { class: "pv-totals-wide" });
    const note = el("div", { class: "side-note" });
    note.appendChild(el("div", { style: { fontWeight: 700, color: "#1F4E79", marginBottom: "3px" } }, "Amount payable"));
    note.appendChild(el("div", {}, `Total items: ${d.lineItems.length}`));
    if (t.taxable > 0) note.appendChild(el("div", {}, `Taxable amount: ${d.currency} ${fmt(t.taxable)}`));
    wrap.appendChild(note);
    const tbl = el("table");
    const trAdd = (l, v) => { const r = el("tr"); r.appendChild(el("td", {}, l)); r.appendChild(el("td", {}, v)); tbl.appendChild(r); };
    trAdd("Subtotal", fmt(t.subtotal));
    trAdd("Taxable", fmt(t.taxable));
    trAdd("Tax rate", (Number(t.taxRate) || 0).toFixed(3) + "%");
    trAdd("Tax", t.tax > 0 ? fmt(t.tax) : "-");
    if (Number(t.delivery) > 0) trAdd("Delivery", fmt(t.delivery));
    if (!isQuote) {
      trAdd("Freight", t.freight > 0 ? fmt(t.freight) : "-");
      trAdd("Insurance", t.insurance > 0 ? fmt(t.insurance) : "-");
      trAdd("Legal/Consular", t.legal > 0 ? fmt(t.legal) : "-");
      trAdd("Inspection/Cert.", t.inspection > 0 ? fmt(t.inspection) : "-");
    }
    const grand = el("tr", { class: "grand" });
    grand.appendChild(el("td", {}, "TOTAL"));
    grand.appendChild(el("td", {}, `${d.currency} ${fmt(t.total)}`));
    tbl.appendChild(grand);
    wrap.appendChild(tbl);
    return wrap;
  };

  const buildWordsBlock = () => {
    const words = el("div", { class: "pv-words" });
    words.appendChild(el("span", { class: "pv-words-label" }, "In words: "));
    words.appendChild(el("span", {}, amountToWords(d.totals.total, d.currency)));
    return words;
  };

  const buildTermsBlock = () => {
    if (d.showTerms === false) return null;
    if (!d.terms || !d.terms.trim()) return null;
    const terms = el("div", { class: "pv-terms" });
    terms.appendChild(el("div", { class: "pv-terms-hdr" }, "TERMS OF SALE AND OTHER COMMENTS"));
    const tb = el("div", { class: "pv-terms-body" });
    d.terms.split("\n").forEach(line => { if (line.trim()) tb.appendChild(el("div", {}, line)); });
    terms.appendChild(tb);
    return terms;
  };

  const buildBanksBlock = () => {
    if (!d.showBanks) return null;
    let banksToShow = Array.isArray(biz.banks) ? biz.banks.filter(b => b.bankName || b.accountName || b.accountNumber || b.notes) : [];
    if (d.bankId) {
      const only = banksToShow.filter(b => b.id === d.bankId);
      if (only.length) banksToShow = only;
    }
    if (banksToShow.length) {
      const bank = el("div", { class: "pv-terms", style: { marginTop: "4px" } });
      bank.appendChild(el("div", { class: "pv-terms-hdr" }, "BANKING DETAILS"));
      const bb = el("div", { class: "pv-terms-body" });
      banksToShow.forEach((b, idx) => {
        const showQR = b.showQR !== false;
        const bankRow = el("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: "10px", marginTop: idx ? "8px" : "0", paddingTop: idx ? "6px" : "0", borderTop: idx ? "1px dashed #cbd5e1" : "none" } });
        const details = el("div", { style: { flex: "1" } });
        const line1 = [b.bankName, b.branch].filter(Boolean).join(" — ");
        if (line1) details.appendChild(el("div", { style: { fontWeight: 700 } }, line1));
        if (b.accountName) details.appendChild(el("div", {}, `A/C Name: ${b.accountName}`));
        if (b.accountNumber) details.appendChild(el("div", {}, `A/C No: ${b.accountNumber}`));
        if (b.swift || b.bankCode) details.appendChild(el("div", {}, `SWIFT/BIC: ${b.bankCode || b.swift}`));
        if (b.notes) b.notes.split("\n").forEach(line => { if (line.trim()) details.appendChild(el("div", {}, line)); });
        bankRow.appendChild(details);
        if (showQR) {
          const qrText = bankQRText(b);
          const qrLabel = "Scan-to-pay QR code for "
            + [b.bankName, b.accountName, b.accountNumber ? "account " + b.accountNumber : ""]
              .filter(Boolean).join(", ");
          const qrImg = qrText ? makeQRImg(qrText, 96, "L", qrLabel) : null;
          if (qrImg) {
            const qrBox = el("div", { style: { textAlign: "center", flexShrink: "0" } });
            qrBox.appendChild(qrImg);
            qrBox.appendChild(el("div", { style: { fontSize: "8px", color: "#555", marginTop: "2px" } }, "Scan to pay"));
            bankRow.appendChild(qrBox);
          }
        }
        bb.appendChild(bankRow);
      });
      bank.appendChild(bb);
      return bank;
    } else if (biz.bank && biz.bank.trim()) {
      const bank = el("div", { class: "pv-terms", style: { marginTop: "4px" } });
      bank.appendChild(el("div", { class: "pv-terms-hdr" }, "BANKING DETAILS"));
      const bb = el("div", { class: "pv-terms-body" });
      biz.bank.split("\n").forEach(line => { if (line.trim()) bb.appendChild(el("div", {}, line)); });
      bank.appendChild(bb);
      return bank;
    }
    return null;
  };

  const buildAdditionalBlock = () => {
    if (!d.showExport) return null;
    const additional = d.additional || {};
    const addl = el("div", { class: "pv-addl" });
    addl.appendChild(el("div", { class: "pv-addl-hdr" }, "ADDITIONAL DETAILS"));
    const ab = el("div", { class: "pv-addl-body" });
    const at = el("table");
    const ar = (l, v) => { const r = el("tr"); r.appendChild(el("td", {}, l)); r.appendChild(el("td", {}, v || "-")); at.appendChild(r); };
    ar("Country of Origin", additional.origin);
    ar("Port of Embarkation", additional.embarkation);
    ar("Port of Discharge", additional.discharge);
    ab.appendChild(at);
    ab.appendChild(el("div", { style: { marginTop: 8 } }, "Reason for Export: " + (additional.reason || "-")));
    addl.appendChild(ab);
    return addl;
  };

  const buildSignatureFooter = () => {
    const foot = el("div", { class: "pv-footer", style: { position: "relative" } });
    foot.appendChild(el("div", { style: { marginTop: 8 } }, "I certify the above to be true and correct to the best of my knowledge."));
    const sig = el("div", { class: "pv-sig" });
    if (biz.signature) sig.appendChild(el("img", { src: biz.signature, class: "pv-sig-img", alt: "Signature of " + (biz.signatory || "the authorised signatory"), style: { maxHeight: (40 * (biz.signScale || 1)) + "px" } }));
    sig.appendChild(el("div", { class: "pv-sigline" }));
    foot.appendChild(sig);
    if (biz.stamp) foot.appendChild(el("img", { src: biz.stamp, class: "pv-stamp-img", alt: "Official stamp of " + (biz.name || "the business"), style: { maxHeight: (90 * (biz.stampScale || 1)) + "px", maxWidth: (130 * (biz.stampScale || 1)) + "px" } }));
    const fr = el("div", { style: { marginTop: 4, display: "flex", justifyContent: "space-between" } });
    const fl = el("div");
    fl.appendChild(el("div", {}, biz.signatory || ""));
    fl.appendChild(el("div", {}, biz.name));
    fr.appendChild(fl);
    fr.appendChild(el("div", {}, "Date: " + d.date));
    foot.appendChild(fr);
    return foot;
  };

  const buildPageFooter = (pageNum, totalPages) => {
    const f = el("div", { class: "pv-page-footer" });
    f.appendChild(el("span", {}, `${cfg.title} · ${d.number}${cust ? " · " + cust.companyName : ""}`));
    f.appendChild(el("span", { class: "page-num" }, `Page ${pageNum} of ${totalPages}`));
    return f;
  };

  // Delivery-details block — only on delivery notes.
  const buildDeliveryBlock = () => {
    const dl = d.delivery || {};
    const box = el("div", { class: "pv-terms", style: { marginTop: "8px" } });
    box.appendChild(el("div", { class: "pv-terms-hdr" }, "DELIVERY DETAILS"));
    const body = el("div", { class: "pv-terms-body" });
    const row = (k, v) => { if (!v) return; body.appendChild(el("div", {}, `${k}: ${v}`)); };
    if (dl.mode === "transport") {
      row("Transport company", dl.transportCompany);
      row("Driver", dl.driverName);
      row("Driver phone", dl.driverPhone);
    } else {
      row("Driver", dl.driverName);
      row("Driver phone", dl.driverPhone);
    }
    row("Vehicle no.", dl.vehicleNo);
    if (!body.childNodes.length) body.appendChild(el("div", {}, "—"));
    box.appendChild(body);
    return box;
  };

  // -------- Assemble finish sections (they go on the last page in order) --------
  const finishSectionsBuilder = () => {
    const out = [];
    if (hidePrices) {
      // Delivery note: no prices, no totals/words/banks.
      out.push(buildDeliveryBlock());
      const t = buildTermsBlock(); if (t) out.push(t);
      out.push(buildSignatureFooter());
      return out;
    }
    out.push(buildTotalsBlock());
    out.push(buildWordsBlock());
    const t = buildTermsBlock(); if (t) out.push(t);
    const b = buildBanksBlock(); if (b) out.push(b);
    const a = buildAdditionalBlock(); if (a) out.push(a);
    out.push(buildSignatureFooter());
    return out;
  };

  // -------- Measure heights offscreen --------
  const measureHeight = (nodes) => {
    const holder = el("div", {
      class: "pv-page",
      style: { position: "absolute", left: "-99999px", top: "0", visibility: "hidden", height: "auto" }
    });
    nodes.forEach(n => holder.appendChild(n));
    document.body.appendChild(holder);
    // Subtract the page's own vertical padding since we want the *content* height
    const h = holder.scrollHeight - PAD_TOP - PAD_BOTTOM;
    holder.remove();
    return Math.max(0, h);
  };

  const letterheadH = measureHeight([buildLetterhead()]);
  const contHdrH = measureHeight([buildContHeader(2, 3)]);
  const emptyItemsH = measureHeight([buildItemsTable()]);
  const finishH = measureHeight(finishSectionsBuilder());

  // Row height: measure a real row using the first line item (or synthesize)
  let rowH = 22;
  {
    const sampleTable = buildItemsTable();
    const tbody = sampleTable.querySelector("tbody");
    const sampleData = d.lineItems[0] || { partNumber: "1", unit: "pcs", description: "Sample line item description text goes here", qty: 1, rate: 100, taxable: true };
    tbody.appendChild(buildItemRow(sampleData, 0));
    const withOneH = measureHeight([sampleTable]);
    rowH = Math.max(20, withOneH - emptyItemsH);
  }

  const SAFETY = 40; // buffer against sub-pixel & border/margin drift + page footer breathing room
  const p1MaxRows = Math.max(1, Math.floor((CONTENT_H - letterheadH - emptyItemsH - SAFETY) / rowH));
  const contMaxRows = Math.max(1, Math.floor((CONTENT_H - contHdrH - emptyItemsH - SAFETY) / rowH));
  const p1WithFinishMaxRows = Math.max(0, Math.floor((CONTENT_H - letterheadH - emptyItemsH - finishH - SAFETY) / rowH));
  const contWithFinishMaxRows = Math.max(0, Math.floor((CONTENT_H - contHdrH - emptyItemsH - finishH - SAFETY) / rowH));

  // -------- Distribute items across pages --------
  const nItems = displayRows.length;
  const distribution = []; // items per page
  const layouts = [];      // "p1_full" | "p1_with_finish" | "cont" | "cont_with_finish" | "finish_only"

  if (nItems <= p1WithFinishMaxRows) {
    // Whole doc fits on one page
    distribution.push(nItems);
    layouts.push("p1_with_finish");
  } else {
    distribution.push(p1MaxRows);
    layouts.push("p1_full");
    let remaining = nItems - p1MaxRows;
    while (remaining > contWithFinishMaxRows) {
      distribution.push(contMaxRows);
      layouts.push("cont");
      remaining -= contMaxRows;
    }
    if (remaining > 0) {
      distribution.push(remaining);
      layouts.push("cont_with_finish");
    } else {
      distribution.push(0);
      layouts.push("finish_only");
    }
  }

  // -------- Build the book --------
  const book = el("div", { class: "pv-book", id: "preview-doc" });
  const totalPages = distribution.length;
  let itemStart = 0;

  distribution.forEach((rowCount, pageIdx) => {
    const layout = layouts[pageIdx];
    const isFirst = pageIdx === 0;
    const hasFinish = layout.endsWith("with_finish") || layout === "finish_only";

    const page = el("div", { class: "pv-page" });

    if (isFirst) {
      page.appendChild(buildLetterhead());
    } else {
      page.appendChild(buildContHeader(pageIdx + 1, totalPages));
    }

    if (layout !== "finish_only") {
      const itemsTable = buildItemsTable();
      const tbody = itemsTable.querySelector("tbody");
      const cap = Math.min(rowCount, displayRows.length - itemStart);
      for (let i = 0; i < cap; i++) {
        tbody.appendChild(buildDisplayRow(displayRows[itemStart + i], itemStart + i + 1));
      }
      // For visual weight, pad short last pages so the table doesn't look sparse.
      // Only pad if we're on a page WITH finish sections (i.e. the last one) AND
      // the item count is small enough that padding won't push finish sections
      // off the page.
      page.appendChild(itemsTable);
      itemStart += rowCount;

      // "…continued" marker on non-final pages
      if (!hasFinish) {
        page.appendChild(el("div", { class: "pv-items-cont-note" }, `…continued on page ${pageIdx + 2}`));
      }
    }

    if (hasFinish) {
      finishSectionsBuilder().forEach(sec => page.appendChild(sec));
    }

    page.appendChild(buildPageFooter(pageIdx + 1, totalPages));
    book.appendChild(page);
  });

  return book;
};

// ==================== SHARE ====================
// Auto short-code from a business name when none is set: initials of the
// significant words, e.g. "Deep Jyoti Plastic Industries" -> "DJPI".
const autoShortCode = (name) => {
  const skip = new Set(["pvt", "ltd", "private", "limited", "and", "&", "co", "company", "the", "industries"]);
  const words = (name || "").split(/[\s.,-]+/).filter(w => w && !skip.has(w.toLowerCase().replace(/\./g, "")));
  const code = words.map(w => w[0]).join("").toUpperCase().slice(0, 5);
  return code || "DOC";
};
// Strip characters that are illegal in filenames, collapse to underscores.
const safeFilePart = (s, max) => {
  let out = String(s || "").replace(/[\\/:*?"<>|]+/g, "").replace(/\s+/g, "_").replace(/_+/g, "_").replace(/^_|_$/g, "");
  if (max && out.length > max) out = out.slice(0, max).replace(/_$/, "");
  return out;
};
// {number}_{SHORTCODE}_{Full_Party_Name}.ext
const docBaseName = (d, ext) => {
  const biz = db.businesses.find(b => b.id === d.businessId) || activeBiz() || {};
  const code = safeFilePart((biz.shortCode || "").trim() || autoShortCode(biz.name), 12);
  const cust = db.customers.find(c => c.id === d.customerId);
  const party = safeFilePart(cust ? cust.companyName : "", 40);
  return [safeFilePart(d.number, 30), code, party].filter(Boolean).join("_") + "." + ext;
};
// Fallback subfolder-in-Downloads trick for browsers without the File System Access API
const docFileName = (d, ext) => {
  const base = docBaseName(d, ext);
  const folder = (activeBiz()?.saveFolder || "").trim().replace(/[\\/]+/g, "-").replace(/[:*?"<>|]/g, "");
  return folder ? `${folder}/${base}` : base;
};

// html2canvas mis-lays-out text if a captured element sits inside an
// ancestor with a CSS transform:scale() (used to fit the A4 preview to
// small screens) — it sizes for the shrunk box but keeps full font sizes,
// causing every line of text to overlap. Flipping the live scaler's
// transform off and back on isn't reliable across multiple sequential
// captures, so instead each page is deep-cloned into a fresh, untransformed
// container purely for the screenshot; the on-screen preview is never touched.
const captureBookPages = async (previewEl) => {
  const pages = previewEl.classList.contains("pv-book")
    ? Array.from(previewEl.querySelectorAll(".pv-page"))
    : [previewEl];
  const stage = el("div", { style: { position: "fixed", left: "-99999px", top: "0", transform: "none" } });
  document.body.appendChild(stage);
  try {
    const canvases = [];
    for (const p of pages) {
      const clone = p.cloneNode(true);
      stage.innerHTML = "";
      stage.appendChild(clone);
      canvases.push(await html2canvas(clone, { scale: 2, backgroundColor: "#fff", useCORS: true }));
    }
    return canvases;
  } finally {
    stage.remove();
  }
};

const withScalerReset = async (el, fn) => {
  const scaler = el.closest ? el.closest(".pv-scaler") : null;
  const prevTransform = scaler ? scaler.style.transform : null;
  const prevHeight = scaler ? scaler.style.height : null;
  if (scaler) { scaler.style.transform = "none"; scaler.style.height = ""; }
  try {
    return await fn();
  } finally {
    if (scaler) { scaler.style.transform = prevTransform || ""; scaler.style.height = prevHeight || ""; }
  }
};

// Captures each .pv-page and stitches into one tall PNG for sharing on
// WhatsApp/messaging. For single-page docs, output is identical to before.
const capturePreviewAsCanvas = async (previewEl) => {
  const pageCanvases = await captureBookPages(previewEl);
  if (pageCanvases.length === 1) return pageCanvases[0];
  // Stitch vertically with thin separators.
  const GAP = 20; // px between pages in stitched image
  const width = Math.max(...pageCanvases.map(c => c.width));
  const height = pageCanvases.reduce((s, c) => s + c.height, 0) + GAP * (pageCanvases.length - 1);
  const out = document.createElement("canvas");
  out.width = width; out.height = height;
  const ctx = out.getContext("2d");
  ctx.fillStyle = "#e5e7eb";
  ctx.fillRect(0, 0, width, height);
  let y = 0;
  pageCanvases.forEach((c, i) => {
    ctx.drawImage(c, (width - c.width) / 2, y);
    y += c.height + GAP;
  });
  return out;
};

const downloadPNG = async (previewEl, d, btn) => {
  const busy = btnBusy(btn, "Saving…");
  try {
    if (!(await ensurePdfLibs())) return;
    const canvas = await capturePreviewAsCanvas(previewEl);
    const filename = docBaseName(d, "png");
    const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
    if (!blob) throw new Error("the image could not be created");
    const savedPng = await writeToFolder(blob, filename);
    if (savedPng) {
      toast(`Saved to folder "${savedPng.name}" — ${filename}`, "ok", 6000);
      return;
    }
    const blobUrl = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.download = docFileName(d, "png");
    link.href = blobUrl;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(blobUrl), 30000);
    toast(`Image saved to your Downloads folder as ${docFileName(d, "png")}`, "ok", 6000);
  } catch (e) {
    console.error("PNG export failed:", e);
    toast("Couldn't save the image — " + (e.message || "please try again"), "err", 5000);
  } finally {
    busy.done();
  }
};

// Real PDF download (A4) — no browser print dialog. Falls back to print() if the
// PDF libraries can't be reached (e.g. fully offline with no cache yet).
// Multi-page PDF: screenshots each .pv-page independently so rows aren't cut
// mid-line at the page boundary. Falls back to the old single-image approach
// if the preview is a legacy single .preview element.
const downloadPDF = async (previewEl, d, btn) => {
  const original = btn ? btn.innerHTML : null;
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Generating…'; }
  try {
    if (!(await ensurePdfLibs())) return;
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: "mm", format: "a4", orientation: "portrait" });
    const pageW = pdf.internal.pageSize.getWidth();  // 210
    const pageH = pdf.internal.pageSize.getHeight(); // 297

    const pages = previewEl.classList.contains("pv-book")
      ? Array.from(previewEl.querySelectorAll(".pv-page"))
      : [previewEl];

    await withScalerReset(previewEl, async () => {
      for (let i = 0; i < pages.length; i++) {
        const pageEl = pages[i];
        const canvas = await html2canvas(pageEl, { scale: 2, backgroundColor: "#fff", useCORS: true });
        const imgData = canvas.toDataURL("image/jpeg", 0.95);
        // Each captured page is already A4 proportioned (794x1123). Fit edge-to-edge.
        if (i > 0) pdf.addPage();
        pdf.addImage(imgData, "JPEG", 0, 0, pageW, pageH);
      }
    });

    const filename = docBaseName(d, "pdf");
    const pdfBlob = pdf.output("blob");
    const savedPdf = await writeToFolder(pdfBlob, filename);
    if (savedPdf) {
      toast(`Saved to folder "${savedPdf.name}" — ${filename}`, "ok", 6000);
    } else {
      pdf.save(docFileName(d, "pdf"));
      toast(`PDF downloaded (${pages.length} ${pages.length === 1 ? "page" : "pages"})`);
    }
  } catch (e) {
    console.error(e);
    toast("Couldn't generate PDF — opening print dialog instead", "err");
    printDoc(previewEl);
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = original; }
  }
};

// Message body shared alongside the document image.
const shareMessage = (d, cust, biz) => {
  const cfg = DOC_TYPES[d.type];
  const lines = [
    `Dear ${cust.contactName || cust.companyName},`,
    "",
    `Please find ${cfg.label} #${d.number} dated ${d.date}.`,
    ""
  ];
  lines.push(`Party: ${cust.companyName}`);
  if (cust.vatNo) lines.push(`VAT/PAN: ${cust.vatNo}`);
  const n = (d.lineItems || []).length;
  if (n) lines.push(`Items: ${n}`);
  lines.push(`Total: ${d.currency} ${fmt(d.totals.total)}`);
  if (d.totals && Number(d.totals.delivery) > 0) lines.push(`(incl. delivery ${fmt(d.totals.delivery)})`);
  if (cfg.hasExpiry && d.expiryDate) lines.push(`${cfg.expiryLabel}: ${d.expiryDate}`);
  lines.push("", `Thank you,`, biz.name);
  if (biz.phone) lines.push(biz.phone);
  return lines.join("\n");
};

// Share the document as a PNG image. Uses the Web Share API where available
// (Android/iOS) so the picture and text go together into WhatsApp; otherwise
// downloads the image and opens WhatsApp with the text for manual attach.
const shareWhatsAppImage = async (previewEl, d, cust, biz, btn) => {
  if (!cust || !cust.phone) { toast("Customer phone number is missing", "err"); return; }
  const original = btn ? btn.innerHTML : null;
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Preparing…'; }
  try {
    if (!(await ensurePdfLibs())) return;
    const canvas = await capturePreviewAsCanvas(previewEl);
    const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
    const filename = docBaseName(d, "png");
    const msg = shareMessage(d, cust, biz);
    const file = blob ? new File([blob], docFileName(d, "png"), { type: "image/png" }) : null;

    // The file itself, with the message as its caption, in one step — the
    // only way a browser can attach a file to WhatsApp at all. Picking the
    // WhatsApp icon here on Android/iOS drops straight into the customer's
    // chat if it's already open, or the OS's contact/share list otherwise.
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], text: msg, title: `${d.type} #${d.number}` });
      if (d.status === "Draft") { d.status = "Sent"; saveDB(); }
      toast("Shared");
      return;
    }

    // No file-sharing support (typically desktop): save the image, then open
    // this exact customer's WhatsApp chat with the message ready — the image
    // needs a manual attach here, since wa.me links can't carry a file.
    const saved = blob && await writeToFolder(blob, filename);
    if (!saved && blob) {
      // A Blob URL (not canvas.toDataURL — that's unreliable for downloads on
      // mobile browsers, especially with large images) triggers a real save
      // to the device's Downloads folder.
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.download = docFileName(d, "png");
      a.href = blobUrl;
      document.body.appendChild(a);
      a.click();
      a.remove();
      // Free the object URL after the browser's had time to actually start
      // the download — revoking too early can cancel it on some browsers.
      setTimeout(() => URL.revokeObjectURL(blobUrl), 30000);
    }
    // Give the download a moment to register before navigating away — opening
    // WhatsApp immediately could interrupt a download that hadn't started yet.
    await new Promise(res => setTimeout(res, 500));
    const phone = cust.phone.replace(/[^0-9]/g, "");
    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, "_blank");
    if (d.status === "Draft") { d.status = "Sent"; saveDB(); }
    toast(saved
      ? `Image saved to "${saved.name}" as ${docFileName(d, "png")} — attach it in the chat that just opened`
      : `Image saved to your Downloads folder as ${docFileName(d, "png")} — attach it in the chat that just opened`,
      "ok", 8000);
  } catch (e) {
    if (e && e.name === "AbortError") return; // user dismissed the share sheet
    console.error(e);
    toast("Couldn't prepare the image", "err");
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = original; }
  }
};

// ==================== GOOGLE DRIVE BACKUP ====================
const GDRIVE_CLIENT_ID = "875334449474-2uqcceb5134tbpbk0e2spv67c5ah4muh.apps.googleusercontent.com";
const GDRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
const GDRIVE_FILENAME = "pipomaker_backup.json";
let _gdriveToken = null;

// Google's sign-in script used to sit in the page <head>, which meant every
// visit hit accounts.google.com whether or not Drive was ever used — a wasted
// third-party request online, and a console error every time the app opened
// offline. It is fetched here instead, the first time someone asks for Drive.
let _gsiPromise = null;
const loadGoogleSignIn = () => {
  if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
  if (!_gsiPromise) {
    _gsiPromise = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://accounts.google.com/gsi/client";
      s.async = true;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error("Google sign-in couldn't be reached — check your connection"));
      document.head.appendChild(s);
    });
    _gsiPromise.catch(() => { _gsiPromise = null; }); // let a later attempt retry
  }
  return _gsiPromise;
};

// Get an access token (opens Google's consent popup the first time).
const gdriveAuth = () => loadGoogleSignIn().then(() => new Promise((resolve, reject) => {
  if (!window.google || !google.accounts || !google.accounts.oauth2) {
    reject(new Error("Google sign-in not loaded — check your connection")); return;
  }
  const client = google.accounts.oauth2.initTokenClient({
    client_id: GDRIVE_CLIENT_ID, scope: GDRIVE_SCOPE,
    callback: (resp) => { if (resp && resp.access_token) { _gdriveToken = resp.access_token; resolve(resp.access_token); } else reject(new Error("Authorization failed")); },
    error_callback: () => reject(new Error("Authorization cancelled")),
  });
  client.requestAccessToken({ prompt: _gdriveToken ? "" : "consent" });
}));

// Find our existing backup file id (drive.file only sees files we created).
const gdriveFindFile = async (token) => {
  const q = encodeURIComponent(`name='${GDRIVE_FILENAME}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`, { headers: { Authorization: "Bearer " + token } });
  const data = await res.json();
  return (data.files && data.files[0] && data.files[0].id) || null;
};

const gdriveBackup = async (btn) => {
  const orig = btn ? btn.textContent : null;
  if (btn) { btn.disabled = true; btn.textContent = "Connecting…"; }
  try {
    const token = await gdriveAuth();
    if (btn) btn.textContent = "Uploading…";
    const content = JSON.stringify(db);
    const existingId = await gdriveFindFile(token);
    const metadata = { name: GDRIVE_FILENAME, mimeType: "application/json" };
    const boundary = "-------pipo" + Date.now();
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${boundary}--`;
    const url = existingId
      ? `https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=multipart`
      : "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart";
    const res = await fetch(url, {
      method: existingId ? "PATCH" : "POST",
      headers: { Authorization: "Bearer " + token, "Content-Type": `multipart/related; boundary=${boundary}` },
      body,
    });
    if (!res.ok) throw new Error("Upload failed (" + res.status + ")");
    toast("Backed up to Google Drive", "ok", 5000);
  } catch (e) {
    toast(e.message || "Drive backup failed", "err", 5000);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = orig; }
  }
};

const gdriveRestore = async (btn) => {
  const orig = btn ? btn.textContent : null;
  if (btn) { btn.disabled = true; btn.textContent = "Connecting…"; }
  try {
    const token = await gdriveAuth();
    if (btn) btn.textContent = "Fetching…";
    const id = await gdriveFindFile(token);
    if (!id) { toast("No backup found in Drive", "err"); return; }
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`, { headers: { Authorization: "Bearer " + token } });
    if (!res.ok) throw new Error("Download failed");
    const imported = JSON.parse(await res.text());
    if (!imported.businesses) throw new Error("Backup file is invalid");
    confirmModal(
      "This replaces all current data with the backup from Google Drive. Your current data will be lost.",
      () => { replaceDB(imported); render(); toast("Restored from Google Drive"); },
      { title: "Replace all data?", confirmLabel: "Replace data" }
    );
  } catch (e) {
    toast(e.message || "Drive restore failed", "err", 5000);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = orig; }
  }
};

// ==================== BACKUP ====================
const exportBackup = async () => {
  const filename = `pipomaker_backup_${today()}.json`;
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
  const savedBk = await writeToFolder(blob, filename, "backups");
  if (savedBk) {
    toast(`Backup saved to "${savedBk.name}/backups"`, "ok", 6000);
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  a.click(); URL.revokeObjectURL(url);
  toast("Backup downloaded");
};

// ---- Restore from what's already on this device ----
// Everything lives in this browser's localStorage under DB_KEY. A copy can end
// up stranded under a different key — an older build, a renamed key, a
// half-finished import — and then the app boots straight into onboarding as if
// nothing was ever saved. This sweeps storage for anything that looks like our
// database so it can be picked back up instead of retyped.
const scanDeviceData = () => {
  const found = [];
  let keys = [];
  try { keys = Object.keys(localStorage); } catch (e) { return found; }
  keys.forEach(k => {
    let raw;
    try { raw = localStorage.getItem(k); } catch (e) { return; }
    if (!raw || raw.length < 20 || raw[0] !== "{") return;
    let v;
    try { v = JSON.parse(raw); } catch (e) { return; }
    if (!v || !Array.isArray(v.businesses) || !v.businesses.length) return;
    found.push({
      key: k, data: v, isCurrent: k === DB_KEY,
      sizeKB: Math.max(1, Math.round(raw.length / 1024)),
      names: v.businesses.map(b => b && b.name).filter(Boolean),
      businesses: v.businesses.length,
      customers: (v.customers || []).length,
      products: (v.products || []).length,
      documents: (v.documents || []).length,
    });
  });
  // Richest copy first — most likely the real history.
  found.sort((a, b) => (b.documents + b.products + b.customers) - (a.documents + a.products + a.customers));
  return found;
};

const deviceEntrySummary = (e) =>
  `${e.products} product${e.products === 1 ? "" : "s"} • ${e.customers} customer${e.customers === 1 ? "" : "s"} • ${e.documents} document${e.documents === 1 ? "" : "s"} • ${e.sizeKB} KB`;

const deviceEntryNames = (e) =>
  e.names.length ? e.names.slice(0, 2).join(", ") + (e.names.length > 2 ? ` +${e.names.length - 2} more` : "") : "Unnamed business";

// Swap the app over to a copy found on this device. Confirms first if there is
// already data loaded that would be replaced.
const restoreDeviceEntry = (entry) => {
  const apply = () => {
    replaceDB(JSON.parse(JSON.stringify(entry.data)));
    if (modalStack.length) closeModal();
    render();
    toast(`Loaded ${entry.businesses} business${entry.businesses === 1 ? "" : "es"} from this device`, "ok", 4000);
  };
  if (db.businesses.length) {
    confirmModal(
      `This replaces every business, customer, product and document currently in the app with the copy saved on this device (${deviceEntrySummary(entry)}).`,
      apply, { title: "Load saved data?", confirmLabel: "Load it" });
  } else {
    apply();
  }
};

const openDeviceRestoreModal = () => {
  const found = scanDeviceData();
  const wrap = el("div");
  if (!found.length) {
    wrap.appendChild(el("div", { class: "picker-empty" }, "No saved data found in this browser."));
    wrap.appendChild(el("div", { style: { fontSize: "11.5px", color: "var(--muted)", padding: "0 4px" } },
      "Data is stored per browser and per device — a different browser, a private window, or cleared site data all start empty. Restore from a backup file or Google Drive instead."));
  } else {
    wrap.appendChild(el("div", { style: { fontSize: "12px", color: "var(--muted)", marginBottom: "10px" } },
      `${found.length} saved cop${found.length === 1 ? "y" : "ies"} found in this browser's storage.`));
    const list = el("div", { class: "picker-list" });
    found.forEach(entry => {
      const row = el("div", { class: "picker-row" });
      const body = el("div", { class: "picker-body" });
      const txt = el("div", { style: { flex: "1", minWidth: "0" } });
      const nameRow = el("div", { style: { fontWeight: 600, fontSize: "13px" } }, deviceEntryNames(entry));
      if (entry.isCurrent) nameRow.appendChild(el("span", { style: { marginLeft: "6px", fontSize: "10px", fontWeight: 700, color: "var(--primary)" } }, "IN USE"));
      txt.appendChild(nameRow);
      txt.appendChild(el("div", { style: { fontSize: "11px", color: "var(--muted)", marginTop: "1px" } }, deviceEntrySummary(entry)));
      body.appendChild(txt);
      row.appendChild(body);
      row.appendChild(el("button", { class: "btn btn-secondary picker-use", onclick: () => restoreDeviceEntry(entry) }, "Load"));
      list.appendChild(row);
    });
    wrap.appendChild(list);
  }
  const bar = el("div", { class: "action-bar" });
  bar.appendChild(el("button", { class: "btn btn-secondary", onclick: closeModal }, "Close"));
  wrap.appendChild(bar);
  openModal("Data saved on this device", wrap, { guard: false });
};

const importBackup = () => {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json";
  inp.onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const imported = JSON.parse(r.result);
        if (!imported.businesses) throw new Error("Invalid backup");
        confirmModal(
          "This replaces every business, customer, product, and document currently in the app with what's in this backup file. Your current data will be lost.",
          () => { replaceDB(imported); render(); toast("Backup restored"); },
          { title: "Replace all data?", confirmLabel: "Replace data" }
        );
      } catch (e) { toast("Invalid backup file: " + e.message, "err"); }
    };
    r.readAsText(f);
  };
  inp.click();
};

// ==================== UTILS ====================
// Empty-list placeholder. `action` is optional { label, onclick } — when given,
// the empty screen offers the obvious next step instead of being a dead end.
const emptyState = (icon, title, sub, action) => {
  const e = el("div", { class: "empty" });
  e.appendChild(el("div", { class: "empty-icon" }, icon));
  e.appendChild(el("div", { class: "empty-title" }, title));
  e.appendChild(el("div", { class: "empty-sub" }, sub));
  if (action) {
    e.appendChild(el("button", { class: "btn btn-primary", type: "button",
      style: { marginTop: "16px" }, onclick: action.onclick }, action.label));
  }
  return e;
};

// ==================== ROUTING & PAGE METADATA ====================
// Each tab is a real address (#/customers, #/products, #/documents) rather than
// a variable nobody outside the page can see. That buys three things: the back
// button moves between tabs instead of leaving the app, a tab can be linked to
// or bookmarked, and the browser tab, the heading and the breadcrumb can say
// which section you are actually in.
//
// The canonical link deliberately does NOT change per route. A fragment is not
// a separate URL — this is one document — so pointing the canonical at
// /bizdoc/customers/ (the written guide, a genuinely different page) would tell
// search engines the app and the guide are the same thing. The guides carry
// their own canonicals; this page keeps one.

const ROUTES = {
  dashboard: {
    hash: "#/",
    h1: "Dashboard",
    lede: "Proforma invoices, purchase orders and quotations — created here, stored on this device.",
    title: null, // home keeps the document's own title — see applyRouteMeta
    description: null,
    crumb: null, // home is the breadcrumb root, not a step inside it
  },
  customers: {
    hash: "#/customers",
    h1: "Customers",
    title: "Customers — PI & PO Maker",
    description: "Your customer list: companies, contacts, tax numbers and the discount rules applied to their documents.",
    crumb: "Customers",
    guide: "customers/",
  },
  products: {
    hash: "#/products",
    h1: "Products",
    title: "Products — PI & PO Maker",
    description: "Your product catalogue: part numbers, descriptions, units, rates, weights and HSN codes, grouped into categories.",
    crumb: "Products",
    guide: "products/",
  },
  documents: {
    hash: "#/documents",
    h1: "Documents",
    title: "Documents — PI & PO Maker",
    description: "Every proforma invoice, purchase order, quotation, tax invoice and delivery note you have raised.",
    crumb: "Documents",
    guide: "documents/",
  },
};

// The title and description the page was served with. Restored whenever the
// user is back on the home route, so the indexed metadata is what a crawler
// landing on the bare URL sees.
const BASE_TITLE = document.title;
const BASE_DESCRIPTION = (document.querySelector('meta[name="description"]') || {}).content || "";

const tabFromHash = () => {
  const h = (location.hash || "").replace(/^#\/?/, "").replace(/\/$/, "").toLowerCase();
  return ROUTES[h] ? h : "dashboard";
};

// Swap in the metadata for a route. Called on every render, so it stays correct
// no matter which way the tab changed — a click, the back button, or a link
// someone was sent.
const applyRouteMeta = (tab) => {
  const r = ROUTES[tab] || ROUTES.dashboard;
  document.title = r.title || BASE_TITLE;
  const meta = document.querySelector('meta[name="description"]');
  if (meta) meta.content = r.description || BASE_DESCRIPTION;
  applyBreadcrumbSchema(tab);
};

// ---- structured data ------------------------------------------------------

const setJSONLD = (id, data) => {
  let tag = document.getElementById(id);
  if (!data) { if (tag) tag.remove(); return; }
  if (!tag) {
    tag = document.createElement("script");
    tag.type = "application/ld+json";
    tag.id = id;
    document.head.appendChild(tag);
  }
  tag.textContent = JSON.stringify(data);
};

const siteOrigin = () => {
  // Resolve against the page itself so the same code is right on GitHub Pages,
  // on a custom domain, and on localhost. From file:// there is no meaningful
  // URL to publish, so structured data is skipped entirely.
  if (!location.protocol.startsWith("http")) return null;
  return location.origin + location.pathname.replace(/[^/]*$/, "");
};

const applyBreadcrumbSchema = (tab) => {
  const base = siteOrigin();
  const r = ROUTES[tab] || ROUTES.dashboard;
  if (!base || !r.crumb) { setJSONLD("ld-breadcrumb", null); return; }
  setJSONLD("ld-breadcrumb", {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    itemListElement: [
      { "@type": "ListItem", position: 1, name: "PI & PO Maker", item: base },
      { "@type": "ListItem", position: 2, name: r.crumb, item: base + r.hash },
    ],
  });
};

// The one piece of LocalBusiness data on this site that is real: the business
// the user has actually set up in Settings. Nothing is invented — a field that
// has not been filled in is left out rather than guessed at, and if there is no
// business configured the block is not emitted at all.
const applyBusinessSchema = () => {
  const base = siteOrigin();
  const biz = (typeof activeBiz === "function") ? activeBiz() : null;
  if (!base || !biz || !biz.name) { setJSONLD("ld-business", null); return; }

  // Only the fields the business form actually collects, and only the ones that
  // have been filled in. The address is one free-text block in this app, so it
  // goes out as streetAddress rather than being split into guesses about which
  // line is the city.
  const data = { "@context": "https://schema.org", "@type": "LocalBusiness", name: biz.name };
  const street = [biz.address1, biz.address2].map(v => (v || "").trim()).filter(Boolean).join(", ");
  if (street) data.address = { "@type": "PostalAddress", streetAddress: street };
  if (biz.phone) data.telephone = biz.phone;
  if (biz.email) data.email = biz.email;
  if (biz.website) data.url = biz.website;
  if (biz.pan) data.taxID = biz.pan;
  if (biz.currency) data.currenciesAccepted = biz.currency;

  setJSONLD("ld-business", data);
};

// ---- navigation -----------------------------------------------------------

// The single way the app changes section. currentTab is set before the address
// is, so the hashchange this triggers sees nothing left to do and the redraw
// happens exactly once.
const navigateTo = (tab) => {
  const r = ROUTES[tab];
  if (!r) return;
  currentTab = tab;
  bulkSel.kind = null;
  bulkSel.ids.clear();
  if (location.hash !== r.hash) location.hash = r.hash;
  render();
};

// Back, forward, or a pasted link. Only acts when the address disagrees with
// what is on screen, which is what makes navigateTo's own hash write a no-op.
window.addEventListener("hashchange", () => {
  const tab = tabFromHash();
  if (tab === currentTab) return;
  currentTab = tab;
  bulkSel.kind = null;
  bulkSel.ids.clear();
  render();
});

// A visible breadcrumb, matching the BreadcrumbList above it. Home is a real
// link back to the dashboard; the current section is marked, not linked.
const renderBreadcrumb = (tab) => {
  const r = ROUTES[tab] || ROUTES.dashboard;
  if (!r.crumb) return null;
  const nav = el("nav", { class: "crumbs", "aria-label": "Breadcrumb" });
  const ol = el("ol");
  const home = el("li");
  home.appendChild(el("a", { href: ROUTES.dashboard.hash,
    onclick: (e) => { e.preventDefault(); navigateTo("dashboard"); } }, "Home"));
  ol.appendChild(home);
  const here = el("li");
  here.appendChild(el("span", { "aria-current": "page" }, r.crumb));
  ol.appendChild(here);
  nav.appendChild(ol);
  return nav;
};

// Quiet links out to the written guides. They are the pages a search engine can
// actually read, and this is the only thing linking to them from inside the app.
const renderAppFooter = (tab) => {
  const r = ROUTES[tab] || ROUTES.dashboard;
  const foot = el("footer", { class: "app-foot" });
  const links = el("div", { class: "app-foot-links" });
  const seen = new Set();
  const add = (href, label) => {
    if (seen.has(href)) return; // the documents tab's own guide is also the general one
    seen.add(href);
    links.appendChild(el("a", { href }, label));
  };
  if (r.guide) add(r.guide, `How ${r.crumb.toLowerCase()} work`);
  add("documents/", "Document types");
  add("offline/", "Offline & install");
  add("privacy/", "Privacy");
  foot.appendChild(links);
  return foot;
};

// ==================== BOOT ====================
// Persist anything normalizeDB() had to repair on load, then draw.
saveDB();
// Open on whatever section the address asks for, so a bookmarked or shared
// #/products link lands on products instead of always on the dashboard.
currentTab = tabFromHash();
render();
</script>
<script>
// PWA wiring — lets the app be installed to the home screen and opened with no
// internet. Only runs over http(s); from a file:// path the browser refuses
// both a manifest and a service worker, and the single index.html already works
// offline on its own there.
//
// manifest.webmanifest, sw.js and icon.svg sit next to index.html. They used to
// be generated in-page as blob: URLs, which looked tidier but never actually
// worked: the browser rejects a service worker script served from blob:, so the
// app was silently never cached.
(function () {
  try {
    if (!location.protocol.startsWith("http")) return;

    // Only the manifest is added here. The icons are declared statically in the
    // page <head>, including a real PNG apple-touch-icon — iOS ignores an SVG
    // one, so pointing this at icon.svg only ever added a second, useless link.
    const link = document.createElement("link");
    link.rel = "manifest";
    link.href = "manifest.webmanifest";
    document.head.appendChild(link);

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch((e) => {
          console.warn("Offline mode unavailable:", e.message);
        });
      });
    }
  } catch (e) { /* best-effort — never block the app from starting */ }
})();
</script>
