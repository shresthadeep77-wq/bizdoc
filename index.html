// ==================== RENDER ROOT ====================
// Draws the whole screen. Called after every change — there is no virtual DOM,
// the view is simply rebuilt from `db`.
const renderApp = () => {
  const root = $("#app");
  root.innerHTML = "";
  document.body.classList.toggle("modal-open", modalStack.length > 0);

  if (db.businesses.length === 0) {
    // Onboarding, before there is anything to show. The metadata still needs
    // resetting — someone who deletes their last business should not be left
    // with a browser tab and a LocalBusiness block from the screen before.
    applyRouteMeta("dashboard");
    applyBusinessSchema();
    root.appendChild(renderOnboard());
    modalStack.forEach(bg => root.appendChild(bg));
    return;
  }
  if (!db.activeBusinessId) {
    db.activeBusinessId = db.businesses[0].id;
    saveDB();
  }

  // Keep the address bar, the browser tab and the structured data in step with
  // whatever is about to be drawn — every route change funnels through here.
  applyRouteMeta(currentTab);
  applyBusinessSchema();

  const route = ROUTES[currentTab] || ROUTES.dashboard;
  const app = el("div", { class: "app" });
  app.appendChild(renderTopbar());
  app.appendChild(renderTabs());
  const content = el("main", { class: "content", id: "main" });

  // Exactly one <h1> per view, naming the section you are in. The topbar carries
  // the product name as branding, not as a heading, so this is the only one.
  const header = el("div", { class: "page-head" });
  const crumbs = renderBreadcrumb(currentTab);
  if (crumbs) header.appendChild(crumbs);
  header.appendChild(el("h1", {}, route.h1));
  if (route.lede) header.appendChild(el("p", { class: "page-lede" }, route.lede));
  content.appendChild(header);

  if (currentTab === "customers") content.appendChild(renderCustomers());
  else if (currentTab === "products") content.appendChild(renderProducts());
  else if (currentTab === "documents") content.appendChild(renderDocuments());
  else content.appendChild(renderDashboard());
  content.appendChild(renderAppFooter(currentTab));
  app.appendChild(content);
  root.appendChild(app);

  // Re-append every modal still open, in order — later ones paint on top,
  // so closing the topmost one reveals the one underneath intact.
  modalStack.forEach(bg => root.appendChild(bg));
};

// Anything that throws while drawing used to leave a permanently blank white
// screen with no way out — and the bad data is already saved, so reloading
// doesn't help either. Show what went wrong plus the ways back instead.
const render = () => {
  try {
    renderApp();
  } catch (e) {
    console.error("Render failed:", e);
    renderRecovery(e);
  }
};

const renderRecovery = (err) => {
  const root = $("#app");
  root.innerHTML = "";
  modalStack = [];
  document.body.classList.remove("modal-open");
  const box = el("div", { class: "onboard" });
  box.appendChild(el("h1", {}, "Something went wrong"));
  box.appendChild(el("p", {}, "The app couldn't draw this screen — usually because some saved data is damaged. Your data is still stored on this device. Try one of these."));
  box.appendChild(el("button", { class: "btn btn-primary btn-full", style: { marginBottom: "8px" },
    onclick: () => location.reload() }, "Reload the app"));
  box.appendChild(el("button", { class: "btn btn-secondary btn-full", style: { marginBottom: "8px" },
    onclick: exportBackup }, "\u{1F4E5} Download a backup of my data"));
  box.appendChild(el("button", { class: "btn btn-secondary btn-full", style: { marginBottom: "8px" },
    onclick: importBackup }, "\u{1F4E4} Restore from a backup file"));
  box.appendChild(el("div", { style: { fontSize: "11px", color: "var(--muted)", marginTop: "12px", wordBreak: "break-word" } },
    "Technical detail: " + (err && err.message ? err.message : String(err))));
  root.appendChild(box);
};

const svgIcon = (name, cls = "ico") => {
  const wrap = document.createElement("span");
  const stroke = name === "whatsapp"; // whatsapp icon uses fill not stroke
  wrap.innerHTML = stroke
    ? `<svg class="${cls}" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON_PATHS[name]}"/></svg>`
    : `<svg class="${cls}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON_PATHS[name]}"/></svg>`;
  return wrap.firstChild;
};
// Helper: build a button with icon + label, applies action-bar friendly markup

// Read-only customer detail preview.
// Fits the fixed-width A4 preview into whatever width is available, and keeps
// it fitted on rotate/resize. The .preview element itself is never resized —
// html2canvas still captures a full-resolution 794px page for the PDF.
const attachPreviewScaler = (wrapEl, scalerEl, pageEl) => {
  const PAGE_W = 794;
  let userZoom = null; // set when the user taps zoom controls
  let bar = null;      // zoom control bar, built below
  const detach = () => { window.removeEventListener("resize", apply); if (ro) ro.disconnect(); };
  let ro = null;
  const apply = () => {
    // Every preview added a window resize listener that was never taken away,
    // so they piled up for the life of the tab. Once the preview is gone from
    // the page, unhook.
    if (!document.contains(wrapEl)) { detach(); return; }
    const avail = wrapEl.clientWidth - 24; // minus padding
    if (avail <= 0) return;
    const fit = Math.min(1, avail / PAGE_W);
    const scale = userZoom !== null ? userZoom : fit;
    scalerEl.style.transform = `scale(${scale})`;
    scalerEl.dataset.scale = String(scale);
    // A scaled element still reserves its unscaled box, leaving a large gap.
    // Collapse that by setting the wrapper height to the visual height.
    scalerEl.style.height = (pageEl.offsetHeight * scale) + "px";
    wrapEl.style.overflowX = scale < 1 ? "hidden" : "auto";
    const zi = bar ? bar.querySelector(".pv-zoom-val") : null;
    if (zi) zi.textContent = Math.round(scale * 100) + "%";
  };
  // Zoom controls, useful once the page is shrunk on a phone.
  bar = el("div", { class: "pv-zoom-bar no-print" });
  const mk = (label, fn) => el("button", { class: "pv-zoom-btn", type: "button", onclick: (e) => { e.stopPropagation(); fn(); apply(); } }, label);
  bar.appendChild(mk("\u2212", () => {
    const cur = userZoom !== null ? userZoom : Math.min(1, (wrapEl.clientWidth - 24) / PAGE_W);
    userZoom = Math.max(0.25, cur - 0.15);
  }));
  bar.appendChild(el("span", { class: "pv-zoom-val" }, "100%"));
  bar.appendChild(mk("+", () => {
    const cur = userZoom !== null ? userZoom : Math.min(1, (wrapEl.clientWidth - 24) / PAGE_W);
    userZoom = Math.min(2.5, cur + 0.15);
  }));
  bar.appendChild(mk("Fit", () => { userZoom = null; }));
  wrapEl.parentNode.insertBefore(bar, wrapEl);

  // Re-fit on viewport changes.
  ro = typeof ResizeObserver !== "undefined" ? new ResizeObserver(apply) : null;
  if (ro) ro.observe(wrapEl);
  window.addEventListener("resize", apply);
  setTimeout(apply, 0);
  setTimeout(apply, 120); // after images/fonts settle
};

// ==================== CUSTOMER REPORT ====================
const customerStats = (c) => {
  const docs = bizDocs().filter(d => d.customerId === c.id);
  const sales = docs.filter(d => d.status !== "Cancelled");
  const total = sales.reduce((s, d) => s + (d.totals?.total || 0), 0);
  const discount = sales.reduce((s, d) => s + (d.totals?.discountGiven || 0), 0);
  const dates = docs.map(d => d.date).filter(Boolean).sort();
  const byStatus = {};
  docs.forEach(d => { byStatus[d.status || "Draft"] = (byStatus[d.status || "Draft"] || 0) + 1; });
  // product mix by value
  const mix = {};
  sales.forEach(d => (d.lineItems || []).forEach(li => {
    const key = (li.catPath && li.catPath.length) ? li.catPath[0] : (li.description || "Other");
    mix[key] = (mix[key] || 0) + (li.qty || 0) * (li.rate || 0);
  }));
  const mixArr = Object.entries(mix).sort((a, b) => b[1] - a[1]);
  return { docs, sales, total, discount, dates, byStatus, mixArr,
    avg: sales.length ? total / sales.length : 0 };
};

      tr.appendChild(el("td", { style: { textAlign: "right" } }, fmt(d.totals?.total || 0)));
      ht.appendChild(tr);
    });

// Renders any report element to an A4 PDF.
const downloadReportPDF = async (elm, filename, btn) => {
  const original = btn ? btn.innerHTML : null;
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Generating…'; }
  try {
    // First export of the session fetches the PDF libraries (see 00-pdf-libs.js).
    if (!(await ensurePdfLibs())) return;
    const { jsPDF } = window.jspdf;
    const canvas = await html2canvas(elm, { scale: 2, backgroundColor: "#fff" });
    const img = canvas.toDataURL("image/jpeg", 0.92);
    const pdf = new jsPDF({ unit: "mm", format: "a4", orientation: "portrait" });
    const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
    const m = 8, iw = pw - m * 2, avail = ph - m * 2;
    const ih = (canvas.height * iw) / canvas.width;
    if (ih <= avail + 3) pdf.addImage(img, "JPEG", m, m, iw, Math.min(ih, avail));
    else {
      let left = ih, y = m;
      pdf.addImage(img, "JPEG", m, y, iw, ih); left -= avail;
      while (left > 3) { y -= avail; pdf.addPage(); pdf.addImage(img, "JPEG", m, y, iw, ih); left -= avail; }
    }
    const saved = await writeToFolder(pdf.output("blob"), filename);
    if (saved) toast(`Saved to folder "${saved.name}" — ${filename}`, "ok", 6000);
    else { pdf.save(filename); toast("PDF downloaded"); }
  } catch (e) { console.error(e); toast("Couldn't generate PDF", "err"); }
  finally { if (btn) { btn.disabled = false; btn.innerHTML = original; } }
};

// Token search: every word must appear somewhere in the row, in any order.
// Combined search + category-prefix filter for the flat product list.
const filterProductList = (q, catPathKey) => {
  const terms = (q || "").toLowerCase().trim().split(/\s+/).filter(Boolean);
  const root = document.getElementById("prod-list");
  if (!root) return;
  const catFilter = (catPathKey || "").trim();
  root.querySelectorAll(".list-item").forEach(i => {
    const hay = i.dataset.search || "";
    const searchOK = terms.every(t => hay.includes(t));
    const path = i.dataset.catpath || "";
    // Category filter is a "starts-with" match on the ` > `-joined path
    const catOK = !catFilter || path === catFilter || path.startsWith(catFilter + " \u203A ");
    i.style.display = (searchOK && catOK) ? "" : "none";
  });
};

// So "pvc elbow" matches "Elbow PVC 110mm", and "110 elbow" works too.
const filterList = (kind, q) => {
  const terms = q.toLowerCase().trim().split(/\s+/).filter(Boolean);
  const root = document.getElementById(`${kind}-list`);
  if (!root) return;
  const items = root.querySelectorAll(".list-item");
  let shown = 0;
  items.forEach(i => {
    const hay = i.dataset.search || "";
    const hit = terms.every(t => hay.includes(t));
    i.style.display = hit ? "" : "none";
    if (hit) shown++;
  });
  // Hide category sections that have no visible rows left.
  root.querySelectorAll("[data-cat-group]").forEach(g => {
    const anyVisible = [...g.querySelectorAll(".list-item")].some(i => i.style.display !== "none");
    g.style.display = anyVisible ? "" : "none";
  });
  // "No results" message
  let msg = root.querySelector(".search-empty");
  if (shown === 0 && items.length) {
    if (!msg) {
      msg = el("div", { class: "search-empty picker-empty" }, "");
      root.appendChild(msg);
    }
    msg.textContent = `No matches for "${q.trim()}"`;
    msg.style.display = "";
  } else if (msg) msg.style.display = "none";
};

// ==================== KEYBOARD SHORTCUTS ====================
// Escape closes the top modal, "/" jumps to the visible search box, and Enter
// submits a form's primary action when you're not in a textarea.
document.addEventListener("keydown", (e) => {
  const tag = (e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea" || tag === "select" || e.target.isContentEditable;

  if (e.key === "Escape") {
    if (modalStack.length) { e.preventDefault(); attemptClose(); }
    else if (typing && tag === "input") e.target.blur();
    return;
  }

  // "/" focuses the search field of whatever list is on screen.
  if (e.key === "/" && !typing) {
    const box = document.querySelector(".modal .picker-list ~ input, .modal input[placeholder*='earch'], .search input, input[placeholder*='earch']");
    if (box) { e.preventDefault(); box.focus(); box.select && box.select(); }
    return;
  }

  // Enter fires the primary button of the open modal (not from a textarea,
  // where Enter means newline, and not when a button already has focus).
  if (e.key === "Enter" && !e.shiftKey && tag !== "textarea" && tag !== "button") {
    const scope = modalStack.length ? modalStack[modalStack.length - 1] : null;
    if (!scope) return;
    // Don't hijack Enter inside the stepped builder — too easy to save early.
    if (scope.querySelector(".builder-shell")) return;
    const primary = scope.querySelector(".action-bar .btn-primary, .btn-primary.btn-full");
    if (primary && !primary.disabled) { e.preventDefault(); primary.click(); }
  }
});

// ==================== CSV EXPORT / IMPORT ====================
const csvEscape = (v) => {
  const s = v === null || v === undefined ? "" : String(v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};
const toCSV = (rows, cols) =>
  [cols.join(",")].concat(rows.map(r => cols.map(c => csvEscape(r[c])).join(","))).join("\r\n");

// Minimal RFC-4180 parser: handles quoted fields, embedded commas/newlines.
const parseCSV = (text) => {
  const rows = []; let row = []; let cur = ""; let inQ = false;
  text = text.replace(/^\uFEFF/, ""); // strip BOM
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ",") { row.push(cur); cur = ""; }
    else if (ch === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (ch !== "\r") cur += ch;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ""));
};

const downloadTextFile = (text, filename, mime = "text/csv;charset=utf-8") => {
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};

// Generic CSV import with a preview step, so nothing is written blindly.
const importCSV = (kind) => {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".csv,text/csv";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const rdr = new FileReader();
    rdr.onload = () => {
      try {
        const rows = parseCSV(rdr.result);
        if (rows.length < 2) { toast("That file has no data rows", "err"); return; }
        const header = rows[0].map(h => h.trim());
        const body = rows.slice(1);
        showImportPreview(kind, header, body);
      } catch (e) { console.error(e); toast("Couldn't read that CSV", "err"); }
    };
    rdr.readAsText(f);
  };
  inp.click();
};

const showImportPreview = (kind, header, body) => {
  const isProd = kind === "products";
  const known = isProd ? PRODUCT_COLS : CUSTOMER_COLS;
  const idx = {}; known.forEach(k => { idx[k] = header.findIndex(h => h.toLowerCase() === k.toLowerCase()); });
  const required = isProd ? ["description"] : ["companyName"];
  const missing = required.filter(r => idx[r] < 0);

  const wrap = el("div");
  if (missing.length) {
    wrap.appendChild(el("div", { style: { color: "var(--danger)", fontSize: "13px", marginBottom: "8px" } },
      `Missing required column${missing.length > 1 ? "s" : ""}: ${missing.join(", ")}`));
    wrap.appendChild(el("div", { style: { fontSize: "11.5px", color: "var(--muted)" } },
      `Expected headers: ${known.join(", ")}`));
    const bar0 = el("div", { class: "action-bar" });
    bar0.appendChild(el("button", { class: "btn btn-secondary", onclick: closeModal }, "Close"));
    wrap.appendChild(bar0);
    openModal("Import — problem", wrap);
    return;
  }
  const unknown = header.filter(h => !known.some(k => k.toLowerCase() === h.toLowerCase()));
  wrap.appendChild(el("div", { style: { fontSize: "12.5px", marginBottom: "6px" } },
    `${body.length} row${body.length === 1 ? "" : "s"} found.`));
  if (unknown.length) wrap.appendChild(el("div", { style: { fontSize: "11px", color: "var(--muted)", marginBottom: "8px" } },
    `Ignored columns: ${unknown.join(", ")}`));

  // preview first 5
  const prev = el("div", { class: "picker-list", style: { maxHeight: "220px" } });
  body.slice(0, 5).forEach(r => {
    const line = el("div", { style: { padding: "7px 10px", borderBottom: "1px solid #f0f2f5", fontSize: "12px" } });
    line.appendChild(el("div", { style: { fontWeight: 600 } }, r[idx[isProd ? "description" : "companyName"]] || "(blank)"));
    const sub = isProd
      ? [r[idx.category], r[idx.rate] ? `rate ${r[idx.rate]}` : "", r[idx.packQty] ? `${r[idx.packQty]}/${r[idx.packUnit] || "box"}` : ""].filter(Boolean).join(" • ")
      : [r[idx.contactName], r[idx.phone]].filter(Boolean).join(" • ");
    line.appendChild(el("div", { style: { fontSize: "10.5px", color: "var(--muted)" } }, sub));
    prev.appendChild(line);
  });
  wrap.appendChild(prev);
  if (body.length > 5) wrap.appendChild(el("div", { style: { fontSize: "11px", color: "var(--muted)", marginTop: "6px" } }, `…and ${body.length - 5} more`));

  const mode = { replace: false };
  wrap.appendChild(checkboxField(
    isProd ? "Update existing products with the same description" : "Update existing customers with the same company name",
    "replace", mode));

  const bar = el("div", { class: "action-bar" });
  bar.appendChild(el("button", { class: "btn btn-secondary", onclick: closeModal }, "Cancel"));
  bar.appendChild(el("button", { class: "btn btn-primary", onclick: async (e) => {
    const g = (r, k) => idx[k] >= 0 ? String(r[idx[k]] ?? "").trim() : "";
    let added = 0, updated = 0, skipped = 0;
    await runBulk(e.currentTarget, "Importing", body, (r) => {
      if (isProd) {
        const desc = g(r, "description");
        if (!desc) { skipped++; return; }
        const existing = mode.replace ? bizProducts().find(p => (p.description || "").toLowerCase() === desc.toLowerCase()) : null;
        const rec = {
          partNumber: g(r, "partNumber"), description: desc, unit: g(r, "unit") || "pcs",
          rate: parseFloat(g(r, "rate")) || 0, weight: parseFloat(g(r, "weight")) || 0,
          hsn: g(r, "hsn"), taxable: !/^(no|false|0)$/i.test(g(r, "taxable") || "yes"),
          category: g(r, "category"), subCategory1: g(r, "subCategory1"),
          subCategory2: g(r, "subCategory2"), subCategory3: g(r, "subCategory3"),
          packQty: parseFloat(g(r, "packQty")) || 0, packUnit: g(r, "packUnit") || "box",
          notes: g(r, "notes"), businessId: db.activeBusinessId
        };
        if (existing) { Object.assign(existing, rec); updated++; }
        else { rec.id = uid("prod"); db.products.push(rec); added++; }
      } else {
        const co = g(r, "companyName");
        if (!co) { skipped++; return; }
        const existing = mode.replace ? bizCustomers().find(c => (c.companyName || "").toLowerCase() === co.toLowerCase()) : null;
        const rulesRaw = g(r, "discountRules");
        const discountRules = rulesRaw ? rulesRaw.split("|").map(s => {
          const [pathPart, pctPart] = s.split(":");
          const path = (pathPart || "").trim().split(">").map(x => x.trim()).filter(Boolean);
          const pct = parseFloat(pctPart) || 0;
          return path.length ? { path, pct } : null;
        }).filter(Boolean) : [];
        const rec = {
          companyName: co, contactName: g(r, "contactName"), phone: g(r, "phone"),
          vatNo: g(r, "vatNo"), email: g(r, "email"), addr1: g(r, "addr1"), addr2: g(r, "addr2"),
          country: g(r, "country") || "NEPAL", regNo: g(r, "regNo"),
          shipAddr1: g(r, "shipAddr1"), shipAddr2: g(r, "shipAddr2"), eximCode: g(r, "eximCode"),
          sameAsBill: !g(r, "shipAddr1"), discountRules, businessId: db.activeBusinessId
        };
        if (existing) { Object.assign(existing, rec); updated++; }
        else { rec.id = uid("cust"); db.customers.push(rec); added++; }
      }
    });
    saveDB(); closeModal(); render();
    toast(`Imported — ${added} added, ${updated} updated${skipped ? `, ${skipped} skipped` : ""}`, "ok", 5000);
  }}, "Import"));
  wrap.appendChild(bar);
  openModal(`Import ${kind}`, wrap);
};

const prodView = { mode: "categories", path: [] };

// ---- Units view: master unit list + drill-down level-wise config ----
const unitsViewState = { path: [] };
const renderUnitsManager = () => {
  const biz = activeBiz();
  const wrap = el("div");
  if (!biz) return wrap;
  if (!Array.isArray(biz.units) || !biz.units.length) {
    biz.units = ["pcs", "kg", "set", "box", "m", "ft", "litre", "bundle"];
  }
  if (!biz.categoryUnits || typeof biz.categoryUnits !== "object") biz.categoryUnits = {};

  wrap.appendChild(el("div", { style: { fontSize: "12.5px", color: "var(--muted)", marginBottom: "10px" } },
    "Add your units once below. Then drill into a category to set a default unit or restrict which units apply there — sub-categories inherit unless you set their own."));

  // ---- Master unit list ----
  const listBox = el("div", { class: "field" });
  const labelRow = el("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center" } });
  labelRow.appendChild(el("label", { style: { marginBottom: 0 } }, "Your units"));
  let reorderMode = false;
  const reorderToggle = el("button", { class: "btn-icon", type: "button", title: "Reorder units", onclick: () => { reorderMode = !reorderMode; drawList(); } }, "\u2195 Reorder");
  labelRow.appendChild(reorderToggle);
  listBox.appendChild(labelRow);
  const list = el("div", { class: "units-chips" });
  const drawList = () => {
    list.innerHTML = "";
    reorderToggle.classList.toggle("active", reorderMode);
    if (biz.units.length === 0) {
      list.appendChild(el("div", { style: { fontSize: "12px", color: "var(--muted)", padding: "8px 4px" } },
        "No units yet. Add one below."));
    }
    biz.units.forEach((u, i) => {
      const chip = el("span", { class: "unit-chip" });
      if (reorderMode) {
        chip.appendChild(el("button", { class: "unit-chip-arrow", type: "button", title: "Move up", onclick: () => {
          if (i === 0) return;
          [biz.units[i-1], biz.units[i]] = [biz.units[i], biz.units[i-1]];
          saveDB(); drawList();
        }}, "\u2039"));
      }
      // Tap the label to rename inline.
      const label = el("span", { class: "unit-chip-label", title: "Tap to rename", onclick: () => {
        const inp = el("input", { value: u, class: "unit-chip-edit" });
        const commit = () => {
          const v = inp.value.trim();
          if (v && v !== u && biz.units.includes(v)) { toast("Already in the list", "err"); drawList(); return; }
          biz.units[i] = v || u; saveDB(); drawList();
        };
        inp.addEventListener("blur", commit);
        inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); inp.blur(); } });
        chip.replaceChild(inp, label);
        inp.focus(); inp.select();
      }}, u);
      chip.appendChild(label);
      if (reorderMode) {
        chip.appendChild(el("button", { class: "unit-chip-arrow", type: "button", title: "Move down", onclick: () => {
          if (i === biz.units.length - 1) return;
          [biz.units[i+1], biz.units[i]] = [biz.units[i], biz.units[i+1]];
          saveDB(); drawList();
        }}, "\u203A"));
      }
      chip.appendChild(el("button", { class: "unit-chip-x", type: "button", title: "Delete unit", onclick: () => {
        const used = bizProducts().some(p => p.unit === u || p.packUnit === u);
        const confirmDelete = () => {
          biz.units.splice(i, 1);
          Object.keys(biz.categoryUnits).forEach(k => {
            const entry = normCatUnitEntry(biz.categoryUnits[k]);
            biz.categoryUnits[k] = { allowed: entry.allowed.filter(x => x !== u), default: entry.default === u ? "" : entry.default };
          });
          saveDB(); drawList();
        };
        if (used) {
          confirmModal(`"${u}" is used by one or more products. Delete anyway?`,
            confirmDelete, { title: "Delete unit?", confirmLabel: "Delete", danger: true });
        } else {
          confirmDelete();
        }
      }}, "\u00D7"));
      list.appendChild(chip);
    });
  };
  drawList();
  listBox.appendChild(list);
  const addBox = el("div", { style: { display: "flex", gap: "6px", marginTop: "10px" } });
  const newInp = el("input", { placeholder: "e.g. carton, bag, pallet", style: { flex: "1" } });
  const addBtn = el("button", { class: "btn btn-secondary", onclick: () => {
    const v = newInp.value.trim();
    if (!v) { toast("Type a unit name first", "err"); return; }
    if (biz.units.includes(v)) { toast("Already in the list", "err"); return; }
    biz.units.push(v);
    newInp.value = "";
    saveDB(); drawList();
  }}, "+ Add");
  newInp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); addBtn.click(); } });
  addBox.appendChild(newInp);
  addBox.appendChild(addBtn);
  listBox.appendChild(addBox);
  wrap.appendChild(listBox);

  // ---- Drill-down: units per category level ----
  const levelBox = el("div", { style: { marginTop: "18px" } });
  levelBox.appendChild(el("label", {}, "Units by category level"));
  const tree = buildCategoryTree(bizProducts());
  let node = tree;
  const valid = [];
  for (const seg of unitsViewState.path) {
    const nxt = node.children.find(c => c.name === seg);
    if (!nxt) break;
    node = nxt; valid.push(seg);
  }
  unitsViewState.path = valid;

  if (!tree.children.length) {
    levelBox.appendChild(el("div", { style: { fontSize: "12px", color: "var(--muted)", padding: "6px 4px" } },
      "No categories yet — add products with categories to set units per level."));
    wrap.appendChild(levelBox);
    return wrap;
  }

  // breadcrumb
  const crumb = el("div", { class: "crumb-bar", style: { margin: "8px 0 10px" } });
  crumb.appendChild(el("button", { type: "button", class: "crumb", onclick: () => { unitsViewState.path = []; render(); } }, "All categories"));
  node.path.forEach((seg, i) => {
    crumb.appendChild(el("span", { class: "crumb-sep" }, "\u203A"));
    crumb.appendChild(el("button", { type: "button", class: "crumb", onclick: () => { unitsViewState.path = node.path.slice(0, i + 1); render(); } }, seg));
  });
  levelBox.appendChild(crumb);

  // Effective (inherited) state — what applies here right now, before any override at this level
  const parentPath = node.path.slice(0, -1);
  const inheritedAllowed = node.path.length ? unitsForCategoryPath(parentPath) : bizUnits();
  const inheritedDefault = node.path.length ? defaultUnitForCategoryPath(parentPath) : "";
  const key = pathKey(node.path);
  const entry = normCatUnitEntry(biz.categoryUnits[key]);
  const hasOverride = entry.allowed.length > 0;
  const setEntry = (patch) => {
    biz.categoryUnits[key] = { ...entry, ...patch };
    saveDB(); render();
  };

  if (node.path.length) {
    const panel = el("div", { class: "card", style: { marginBottom: "12px" } });
    panel.appendChild(el("div", { class: "card-title" }, `Units for "${node.name}"`));

    // Default unit
    const defWrap = el("div", { class: "field" });
    defWrap.appendChild(el("label", {}, "Default unit here"));
    const pool = hasOverride ? entry.allowed : inheritedAllowed;
    const defSel = el("select", { onchange: (e) => setEntry({ default: e.target.value }) });
    defSel.appendChild(el("option", { value: "" }, inheritedDefault ? `Inherit (${inheritedDefault})` : "None"));
    pool.forEach(u => {
      const opt = el("option", { value: u }, u);
      if (entry.default === u) opt.selected = true;
      defSel.appendChild(opt);
    });
    defWrap.appendChild(defSel);
    panel.appendChild(defWrap);

    // Allowed units — chips. Untouched = inherits parent's full set.
    panel.appendChild(el("div", { style: { fontSize: "12.5px", fontWeight: 600, margin: "10px 0 6px" } }, "Allowed units here"));
    const chips = el("div", { style: { display: "flex", flexWrap: "wrap", gap: "6px" } });
    biz.units.forEach(u => {
      const active = hasOverride ? entry.allowed.includes(u) : inheritedAllowed.includes(u);
      const chip = el("button", { type: "button", class: "chip" + (active ? " active" : ""), onclick: () => {
        const base = hasOverride ? entry.allowed : [...inheritedAllowed]; // first click on an inherited set "forks" it
        const next = base.includes(u) ? base.filter(x => x !== u) : [...base, u];
        setEntry({ allowed: next });
      }}, u);
      chips.appendChild(chip);
    });
    panel.appendChild(chips);

    const status = hasOverride
      ? el("div", { style: { fontSize: "10.5px", color: "var(--primary)", marginTop: "6px", fontWeight: 600 } }, "\u2713 Set at this level")
      : el("div", { style: { fontSize: "10.5px", color: "var(--muted)", marginTop: "6px" } },
          node.path.length > 1 ? `Inherited from "${node.path[node.path.length - 2]}"` : "Inherited from all units");
    panel.appendChild(status);

    if (hasOverride) {
      panel.appendChild(el("button", { class: "btn btn-secondary", style: { marginTop: "8px", fontSize: "11.5px", padding: "6px 10px" }, onclick: () => {
        delete biz.categoryUnits[key];
        saveDB(); render();
      }}, "Clear override — go back to inheriting"));
    }
    levelBox.appendChild(panel);
  }

  // sub-category cards, each showing its effective default unit
  if (node.children.length) {
    const grid = el("div", { class: "cat-grid" });
    node.children.forEach(ch => {
      const chDef = defaultUnitForCategoryPath(ch.path);
      const chOverridden = normCatUnitEntry(biz.categoryUnits[pathKey(ch.path)]).allowed.length > 0;
      const card = el("div", { class: "cat-card", onclick: () => { unitsViewState.path = ch.path; render(); } });
      card.appendChild(el("div", { class: "cat-card-name" }, ch.name));
      card.appendChild(el("div", { class: "cat-card-meta" },
        (chDef ? `Default: ${chDef}` : "No default") + (chOverridden ? " \u2022 own units" : "")));
      grid.appendChild(card);
    });
    levelBox.appendChild(grid);
  } else if (!node.path.length) {
    levelBox.appendChild(el("div", { style: { fontSize: "12px", color: "var(--muted)", padding: "6px 4px" } }, "Pick a category above to set its units."));
  }

  wrap.appendChild(levelBox);
  return wrap;
};

      grid.appendChild(card);
    });
    wrap.appendChild(grid);
  }

  // products sitting exactly at this level
  const here = all.filter(p => {
    const pp = productPath(p);
    return pp.length === node.path.length && node.path.every((s, i) => pp[i] === s);
  });
  if (here.length) {
    wrap.appendChild(el("div", { class: "cat-section-hdr", style: { marginTop: "14px" } }, [
      el("div", { class: "cat-name" }, node.path.length ? `In ${node.name}` : "Uncategorized"),
      el("div", { class: "cat-count" }, String(here.length))
    ]));
    // Multi-select: tick several of these products and move them somewhere else
    // in one go, instead of editing them one at a time.
    if (bulkActive("prod")) {
      wrap.appendChild(bulkBar("prod", () => here.map(p => p.id), productBulkDelete, productBulkActions()));
    } else {
      wrap.appendChild(el("div", { style: { marginBottom: "10px" } },
        el("button", { class: "btn btn-secondary bulk-mini", onclick: () => bulkToggleMode("prod") },
          "☑️ Select products to move")));
    }
    const box = el("div", { id: "prod-list" });
    here.forEach(p => box.appendChild(renderProductItem(p)));
    wrap.appendChild(box);
  } else if (!node.children.length) {
    wrap.appendChild(el("div", { class: "picker-empty" }, "Nothing here."));
  }
  return wrap;
};

// Append product rows in batches across frames instead of all at once —
// 400+ rows built synchronously (each with its own inputs/listeners) is what
// was freezing the All Products tab. Same idea as runBulk's chunking above.
const renderProductChunks = async (list, container, chunk = 60) => {
  for (let i = 0; i < list.length; i += chunk) {
    const frag = document.createDocumentFragment();
    list.slice(i, i + chunk).forEach(p => frag.appendChild(renderProductItem(p)));
    container.appendChild(frag);
    if (i + chunk < list.length) await nextFrame();
  }
};

const renderProductItem = (p) => {
  const searchIdx = [p.description, p.partNumber, p.category, p.subCategory1, p.subCategory2,
    p.subCategory3, p.hsn, p.notes, p.unit, p.packUnit, p.rate, p.packQty].filter(Boolean).join(" ").toLowerCase();

  const cbP = bulkCheckbox("prod", p.id);

  const info = el("div", { class: "info", style: { cursor: "pointer" }, onclick: () => openProductPreview(p) });

  ));

  item.appendChild(info);
  // Inline rate edit — tweak the price without opening the full product form.
  const rateInp = el("input", { type: "number", value: p.rate, step: "0.01", title: "Rate",
    style: { width: "64px", flex: "none", textAlign: "right", fontSize: "12px", padding: "6px 7px" },
    onclick: (e) => e.stopPropagation() });
  rateInp.addEventListener("change", (e) => {

  }));
  actions.appendChild(iconBtn("Delete", "🗑️", () => {
    const used = bizDocs().filter(d => (d.lineItems || []).some(li => li.productId === p.id)).length;
    confirmModal(
      used
        ? `Delete "${p.description}"? It stays on the ${used} document${used === 1 ? "" : "s"} that already use${used === 1 ? "s" : ""} it. You will have a few seconds to undo.`
        : `Delete "${p.description}"? You will have a few seconds to undo.`,
      () => deleteWithUndo(`"${p.description}"`,

        () => { db.products.push(p); }),

  }, true));
  item.appendChild(actions);
  return item;
};

// Every field gets a unique id so its <label> can point at it. Without the
// link, tapping the label doesn't focus the box and screen readers announce
// the input as unlabelled.
let fieldIdCounter = 0;
const nextFieldId = (key) => `f-${String(key).replace(/[^a-z0-9]/gi, "")}-${fieldIdCounter++}`;

const inputField = (label, key, obj, opts = {}) => {
  const f = el("div", { class: "field" });
  const id = nextFieldId(key);
  const hintId = opts.hint ? id + "-hint" : undefined;
  f.appendChild(el("label", { for: id }, label));
  const inp = el(opts.textarea ? "textarea" : "input", {
    id,
    type: opts.textarea ? undefined : (opts.type || "text"),
    inputmode: opts.type === "number" ? "decimal" : undefined,
    "aria-describedby": hintId,
    value: obj[key] ?? "",
    placeholder: opts.placeholder || "",
    oninput: (e) => { obj[key] = opts.type === "number" ? parseFloat(e.target.value) || 0 : e.target.value; if (opts.onInput) opts.onInput(obj[key]); },
  });
  if (opts.rows) inp.rows = opts.rows;
  f.appendChild(inp);
  if (opts.hint) f.appendChild(el("div", { id: hintId, style: { fontSize: "11px", color: "#6b7280", marginTop: "4px" } }, opts.hint));
  return f;
};

const selectField = (label, key, obj, options, opts = {}) => {
  const f = el("div", { class: "field" });
  const id = nextFieldId(key);
  f.appendChild(el("label", { for: id }, label));
  const s = el("select", { id, onchange: (e) => { obj[key] = e.target.value; if (opts.onChange) opts.onChange(obj[key]); } });
  options.forEach(o => {
    const opt = el("option", { value: o }, o);
    if (obj[key] === o) opt.selected = true;
    s.appendChild(opt);
  });
  if (!obj[key]) obj[key] = options[0];
  f.appendChild(s);
  return f;
};

let comboIdCounter = 0;
const comboField = (label, key, obj, suggestions = [], opts = {}) => {
  const f = el("div", { class: "field" });
  const id = nextFieldId(key);
  f.appendChild(el("label", { for: id }, label));
  const listId = `dl-${key}-${comboIdCounter++}`;
  const inp = el("input", {
    id,
    value: obj[key] ?? "",
    list: listId,
    placeholder: opts.placeholder || "",
    oninput: (e) => { obj[key] = e.target.value; if (opts.onChange) opts.onChange(obj[key]); },
  });
  f.appendChild(inp);
  const dl = el("datalist", { id: listId });
  Array.from(new Set(suggestions.filter(Boolean))).forEach(s => dl.appendChild(el("option", { value: s })));
  f.appendChild(dl);
  return f;
};

const checkboxField = (label, key, obj, onChange) => {
  const f = el("label", { class: "toggle-row", style: { cursor: "pointer" } });
  const cb = el("input", { type: "checkbox", onchange: (e) => { obj[key] = e.target.checked; if (onChange) onChange(); } });
  if (obj[key]) cb.checked = true;
  f.appendChild(cb);
  f.appendChild(el("span", { style: { marginBottom: 0 } }, label));
  return f;
};

// ==================== MODALS ====================
const openModal = (title, contentEl, opts = {}) => {
  const bg = el("div", { class: "modal-bg", onclick: (e) => { if (e.target === bg) attemptClose(); } });
  const m = el("div", {
    class: "modal" + (opts.wide ? " modal-wide" : "") + (opts.settings ? " modal-settings" : "") + (opts.flush ? " modal-flush" : ""),
    role: "dialog", "aria-modal": "true", "aria-label": title,
  });
  const h = el("div", { class: "modal-header" });
  h.appendChild(el("h2", {}, title));
  h.appendChild(el("button", { class: "modal-close", type: "button", "aria-label": "Close", onclick: () => attemptClose() }, "×"));
  const body = el("div", { class: "modal-body" });
  body.appendChild(contentEl);
  m.appendChild(h);
  m.appendChild(body);
  if (opts.footer) m.appendChild(opts.footer);
  bg.appendChild(m);
  // Track edits so closing doesn't silently throw away typed work.
  bg._guard = opts.guard !== false;
  bg._dirty = false;
  m.addEventListener("input", (e) => {
    const t = (e.target.tagName || "").toLowerCase();
    if (t === "input" || t === "textarea" || t === "select") bg._dirty = true;
  });
  // Reserve exactly one history entry for the whole chain of modals (not one
  // per modal) — nested modals (e.g. "add customer" opened from inside the
  // doc builder) share it. The phone's back button then closes the chain
  // instead of leaving the app.
  if (modalStack.length === 0 && !modalHistoryPushed) {
    history.pushState({ ppmModal: true }, "");
    modalHistoryPushed = true;
  }
  modalStack.push(bg);
  document.getElementById("app").appendChild(bg);
  document.body.classList.add("modal-open");
  // Move focus into the dialog so Escape and Tab act on it, and so a screen
  // reader announces it. Deliberately the panel and not the first field —
  // auto-focusing an input pops the on-screen keyboard open on every phone.
  m.setAttribute("tabindex", "-1");
  m.focus({ preventScroll: true });
};

// Keep Tab inside the topmost modal — without this, tabbing walks off into the
// page behind it, which is invisible and impossible to get back from.
const trapModalTab = (e) => {
  if (e.key !== "Tab" || !modalStack.length) return;
  const m = modalStack[modalStack.length - 1].querySelector(".modal");
  if (!m) return;
  const items = [...m.querySelectorAll('a[href], button, input, textarea, select, [tabindex]:not([tabindex="-1"])')]
    .filter(x => !x.disabled && x.offsetParent !== null);
  if (!items.length) return;
  const firstEl = items[0], lastEl = items[items.length - 1];
  if (e.shiftKey && (document.activeElement === firstEl || !m.contains(document.activeElement))) {
    e.preventDefault(); lastEl.focus();
  } else if (!e.shiftKey && document.activeElement === lastEl) {
    e.preventDefault(); firstEl.focus();
  }
};
document.addEventListener("keydown", trapModalTab);

// Close the top modal, asking first if the user typed something they'd lose.
const attemptClose = () => {
  const top = modalStack[modalStack.length - 1];
  if (top && top._guard && top._dirty) {
    confirmModal("Discard your changes?", () => { closeModal(); },
      { confirmLabel: "Discard", cancelLabel: "Keep editing" });
    return;
  }
  closeModal();
};
// Set while we rewind our own reserved history entry, so the popstate handler
// knows the back button wasn't actually pressed.
let unwindingModalHistory = false;

// Closes only the topmost modal — any modal underneath (e.g. a document you were
// mid-way through building) reappears exactly as you left it.
const closeModal = () => {
  const bg = modalStack.pop();
  if (bg && bg.parentNode) bg.parentNode.removeChild(bg);
  if (!modalStack.length) {
    document.body.classList.remove("modal-open");
    // Give back the history entry we reserved when the chain opened. Without
    // this it stays on the stack, and the next back press does nothing at all
    // before a second press finally leaves the app.
    if (modalHistoryPushed) {
      modalHistoryPushed = false;
      unwindingModalHistory = true;
      history.back();
    }
    // Nothing left open — refresh the underlying view so edits made in the
    // modal show immediately (no page reload needed).
    render();
    // render() rebuilds the page, so whatever had focus before the modal is
    // gone. Park focus on the content area instead of letting it fall back to
    // the top of the document, so Tab carries on roughly where it left off.
    const main = document.getElementById("main");
    if (main) { main.setAttribute("tabindex", "-1"); main.focus({ preventScroll: true }); }
  }
};

// Physical/gesture back button: close whatever modal chain is open instead of
// navigating the browser away from the app. If nothing is open, this is just
// the reserved entry being consumed by a real "leave the app" navigation.
window.addEventListener("popstate", () => {
  if (unwindingModalHistory) { unwindingModalHistory = false; return; }
  modalHistoryPushed = false;
  if (modalStack.length) {
    modalStack = [];
    render();
  }
});

// Styled confirmation modal — replaces native confirm() so destructive actions
// match the app's look instead of a browser popup. Cancel just closes; Confirm
// closes then runs onConfirm.
const confirmModal = (message, onConfirm, opts = {}) => {
  const wrap = el("div");
  wrap.appendChild(el("div", { style: { fontSize: "14px", lineHeight: "1.5", color: "var(--text)", marginBottom: "18px" } }, message));
  const actions = el("div", { class: "action-bar" });
  actions.appendChild(el("button", { class: "btn btn-secondary", onclick: closeModal }, opts.cancelLabel || "Cancel"));
  const confirmBtn = el("button", { class: opts.danger === false ? "btn btn-primary" : "btn btn-danger", onclick: () => {
    closeModal();
    onConfirm();
  }}, opts.confirmLabel || "Confirm");
  if (opts.typeToConfirm) {
    confirmBtn.disabled = true;
    const tf = el("div", { class: "field" });
    tf.appendChild(el("label", {}, `Type "${opts.typeToConfirm}" to confirm`));
    tf.appendChild(el("input", { oninput: (e) => { confirmBtn.disabled = e.target.value !== opts.typeToConfirm; } }));
    wrap.appendChild(tf);
  }
  actions.appendChild(confirmBtn);
  wrap.appendChild(actions);
  openModal(opts.title || "Are you sure?", wrap, { guard: false });
};

// Recompute totals for an already-saved document (used when bulk-updating a
// product's rate across past documents). Mirrors recomputeTotals(), which
// only works on the in-progress docBuilder.
const recomputeDocTotalsFor = (d) => {
  const t = d.totals || (d.totals = {});
  const lis = d.lineItems || [];
  t.subtotal = lis.reduce((s, li) => s + (li.qty * li.rate), 0);
  t.discountGiven = lis.reduce((s, li) => {
    const list = Number(li.listRate);
    if (!list && list !== 0) return s;
    return s + (li.qty * Math.max(0, list - li.rate));
  }, 0);
  t.taxable = lis.filter(li => li.taxable).reduce((s, li) => s + (li.qty * li.rate), 0);
  t.tax = t.taxable * ((t.taxRate || 0) / 100);
  t.total = t.subtotal + t.tax + Number(t.delivery || 0) + Number(t.freight || 0) + Number(t.insurance || 0)
    + Number(t.legal || 0) + Number(t.inspection || 0) + Number(t.other1 || 0) + Number(t.other2 || 0);
};

// After a product's rate is edited, offer to push the new rate into every
// past document that still uses this product — instead of leaving old PI/PO
// documents quoting the stale rate.
const offerRateUpdate = (product, oldRate, newRate) => {
  const affected = bizDocs().filter(d => (d.lineItems || []).some(li => li.productId === product.id));
  if (!affected.length) return;
  const cur = activeBiz()?.currency || "NPR";
  const wrap = el("div");
  wrap.appendChild(el("div", { style: { marginBottom: "12px", fontSize: "13px" } },
    `Rate for "${product.description}" changed from ${cur} ${fmt(oldRate)} to ${cur} ${fmt(newRate)}. Update it in these existing documents too?`));
  const list = el("div", { style: { maxHeight: "280px", overflowY: "auto", marginBottom: "12px", border: "1px solid var(--border)", borderRadius: "8px" } });
  const rows = [];
  affected.forEach(d => {
    const lineCount = d.lineItems.filter(li => li.productId === product.id).length;
    const row = el("label", { style: { display: "flex", alignItems: "center", gap: "10px", padding: "8px 10px", borderBottom: "1px solid var(--border)", cursor: "pointer" } });
    const cb = el("input", { type: "checkbox", checked: d.status !== "Cancelled" });
    rows.push({ cb, doc: d });
    row.appendChild(cb);
    row.appendChild(el("div", { style: { flex: "1" } }, [
      el("div", { style: { fontWeight: 600 } }, `${d.type} #${d.number} — ${d.status || "Draft"}`),
      el("div", { style: { fontSize: "11px", color: "var(--muted)" } }, `${lineCount} line item(s) using this product`),
    ]));
    list.appendChild(row);
  });
  wrap.appendChild(list);
  wrap.appendChild(el("button", { class: "btn btn-primary btn-full", onclick: async (e) => {
    const picked = rows.filter(({ cb }) => cb.checked);
    await runBulk(e.currentTarget, "Updating", picked, ({ doc }) => {
      doc.lineItems.forEach(li => { if (li.productId === product.id) { li.rate = newRate; li.listRate = newRate; } });
      recomputeDocTotalsFor(doc);
    });
    const updated = picked.length;
    if (updated) saveDB();
    closeModal();
    toast(updated ? `Rate updated in ${updated} document${updated === 1 ? "" : "s"}` : "No documents updated");
    render();
  }}, "Update selected documents"));
  wrap.appendChild(el("button", { class: "btn btn-secondary btn-full", style: { marginTop: "8px" }, onclick: closeModal }, "Skip — leave documents as they are"));
  openModal("Update rate in existing documents?", wrap);
};

  unitFieldWrap.appendChild(el("label", {}, "Unit"));
  const unitSelect = el("select", { onchange: (e) => { data.unit = e.target.value; } });
  const refreshUnitOptions = (forceDefault) => {
    const path = productPath(data);
    const opts = unitsForCategoryPath(path);
    if (forceDefault) {
      const def = defaultUnitForCategoryPath(path);
      if (def && opts.includes(def)) data.unit = def;
    }
    const cur = data.unit;
    unitSelect.innerHTML = "";
    opts.forEach(o => {
      const opt = el("option", { value: o }, o);
      if (cur === o) opt.selected = true;
      unitSelect.appendChild(opt);
    });
    if (!opts.includes(cur)) { data.unit = opts[0] || ""; if (unitSelect.firstChild) unitSelect.firstChild.selected = true; }
  };
  refreshUnitOptions(!data.unit);
  unitFieldWrap.appendChild(unitSelect);

  wrap.appendChild(el("div", { class: "row" }, [
    inputField("Part Number", "partNumber", data),
    unitFieldWrap,
  ]));
  wrap.appendChild(inputField("Description *", "description", data));

  // Category / Sub-categories
  const catPresets = ["PVC", "CPVC", "HDPE", "Borewell"];
  const usedCats = bizProducts().map(p => p.category);
  const usedSub1 = bizProducts().map(p => p.subCategory1);
  const usedSub2 = bizProducts().map(p => p.subCategory2);
  const usedSub3 = bizProducts().map(p => p.subCategory3);
  const catField = el("div", { class: "row" }, [
    comboField("Category", "category", data, [...catPresets, ...usedCats], { placeholder: "PVC / CPVC / HDPE / Borewell…", onChange: () => refreshUnitOptions(true) }),
    comboField("Sub Category 1", "subCategory1", data, usedSub1, { onChange: () => refreshUnitOptions(true) }),
  ]);
  wrap.appendChild(catField);
  wrap.appendChild(el("div", { class: "row" }, [
    comboField("Sub Category 2", "subCategory2", data, usedSub2, { onChange: () => refreshUnitOptions(true) }),
    comboField("Sub Category 3", "subCategory3", data, usedSub3, { onChange: () => refreshUnitOptions(true) }),
  ]));

  // ---- Pricing basis: per piece (e.g. fittings) vs per kg (e.g. HDPE pipe) ----
  const getCatDefault = (cat) => (activeBiz()?.categoryDefaults || {})[cat];
  const pricingBox = el("div", { class: "card", style: { marginTop: "10px" } });
  pricingBox.appendChild(el("div", { class: "card-title" }, "Pricing"));
  let basisTouched = !!existing; // only auto-apply category default for brand-new products
  const basisRow = el("div", { class: "row" });
  const basisSel = selectField("Rate Basis", "rateBasis", data, ["pcs", "kg"], {
    onChange: () => { basisTouched = true; drawPricingFields(); }
  });
  basisRow.appendChild(basisSel);
  pricingBox.appendChild(basisRow);
  const pricingFields = el("div");
  pricingBox.appendChild(pricingFields);
  const rememberRow = el("div", { class: "toggle-row" });
  const rememberCb = el("input", { type: "checkbox" });
  rememberRow.appendChild(rememberCb);
  rememberRow.appendChild(el("label", { style: { marginBottom: 0 } }, "Set as default pricing basis for this category"));
  pricingBox.appendChild(rememberRow);
  const drawPricingFields = () => {
    pricingFields.innerHTML = "";
    if (data.rateBasis === "kg") {
      const computedLine = el("div", { style: { fontSize: "12px", color: "var(--muted)", marginTop: "-6px", marginBottom: "8px" } });
      const refreshComputed = () => {
        data.rate = +((Number(data.kgRate) || 0) * (Number(data.weight) || 0)).toFixed(2);
        const c = (Number(data.kgRate) || 0) * (Number(data.weight) || 0);
        computedLine.textContent = c > 0 ? `= ${activeBiz()?.currency || ""} ${fmt(c)} per pcs (used on documents)` : "Enter both kg rate and weight per pcs.";
      };
      const kgRow = el("div", { class: "row" });
      kgRow.appendChild(inputField("Rate (per kg) *", "kgRate", data, { type: "number", onInput: refreshComputed }));
      kgRow.appendChild(inputField("Weight (kg per pcs) *", "weight", data, { type: "number", hint: "Also used for gross weight on docs", onInput: refreshComputed }));
      pricingFields.appendChild(kgRow);
      refreshComputed();
      pricingFields.appendChild(computedLine);
      pricingFields.appendChild(inputField("HSN Code", "hsn", data));
    } else {
      const row = el("div", { class: "row" });
      row.appendChild(inputField("Rate (per pcs) *", "rate", data, { type: "number" }));
      row.appendChild(inputField("Weight (kg per unit)", "weight", data, { type: "number", hint: "Used to auto-calc gross weight on docs" }));
      row.appendChild(inputField("HSN Code", "hsn", data));
      pricingFields.appendChild(row);
    }
  };
  drawPricingFields();
  wrap.appendChild(pricingBox);
  const vatIncF = checkboxField("Rate includes VAT", "rateIncludesVat", data);
  const syncVatInc = () => {
    const cb = vatIncF.querySelector("input");
    cb.disabled = !data.taxable;
    vatIncF.style.opacity = data.taxable ? "1" : ".45";
    if (!data.taxable) { data.rateIncludesVat = false; cb.checked = false; }
  };
  wrap.appendChild(checkboxField("Taxable", "taxable", data, syncVatInc));
  wrap.appendChild(vatIncF);
  syncVatInc();

  // Auto-apply the category's saved default rate basis for brand-new products
  // once a category is chosen (never overrides a value the user already touched).
  const catInput = catField.querySelector("input");
  if (catInput) {
    catInput.addEventListener("change", () => {
      if (basisTouched) return;
      const def = getCatDefault(data.category);
      if (def && def.rateBasis) {
        data.rateBasis = def.rateBasis;
        basisSel.querySelector("select").value = def.rateBasis;
        drawPricingFields();
      }
    });
  }

  // ---- Packing ----
  const packBox = el("div", { class: "card", style: { marginTop: "10px" } });
  packBox.appendChild(el("div", { class: "card-title" }, "Packing"));
  packBox.appendChild(el("div", { style: { fontSize: "11px", color: "var(--muted)", marginBottom: "8px" } },
    `How many ${data.unit || "pcs"} come in one box/bag/bundle. Leave 0 if sold loose.`));
  const packNote = el("div", { class: "pack-note" });
  const drawPackNote = () => {
    const q = Number(data.packQty) || 0;
    packNote.innerHTML = "";
    if (q > 0) {
      packNote.appendChild(el("span", { class: "pack-chip" },
        `1 ${data.packUnit || "box"} = ${q} ${data.unit || "pcs"}`));
      const perPack = (Number(data.rate) || 0) * q;
      if (perPack > 0) packNote.appendChild(el("span", { style: { fontSize: "11px", color: "var(--muted)", marginLeft: "8px" } },
        `${activeBiz().currency} ${fmt(perPack)} per ${data.packUnit || "box"}`));
    } else {
      packNote.appendChild(el("span", { style: { fontSize: "11px", color: "var(--muted)" } }, "Sold loose — no packing set."));
    }
  };
  packBox.appendChild(el("div", { class: "row" }, [
    inputField("Qty per pack", "packQty", data, { type: "number", hint: "e.g. 32", onInput: drawPackNote }),
    selectField("Pack unit", "packUnit", data, ["box", "bag", "bundle", "carton", "roll", "coil", "set", "pallet"], { onChange: drawPackNote }),
  ]));
  drawPackNote();
  packBox.appendChild(packNote);
  wrap.appendChild(packBox);

  wrap.appendChild(inputField("Notes (internal)", "notes", data, { textarea: true, rows: 2 }));
  wrap.appendChild(el("button", { class: "btn btn-primary btn-full", style: { marginTop: "12px" }, onclick: () => {
    if (!data.description.trim()) { toast("Description required", "err"); return; }
    if (rememberCb.checked && data.category) {
      const biz = activeBiz();
      biz.categoryDefaults = biz.categoryDefaults || {};
      biz.categoryDefaults[data.category] = { rateBasis: data.rateBasis };
    }
    const isNew = !existing;
    const oldRate = existing ? Number(existing.rate) || 0 : null;
    const newRate = Number(data.rate) || 0;
    if (existing) { Object.assign(existing, data); }
    else { data.id = uid("prod"); db.products.push(data); }
    saveDB(); closeModal();
    toast(isNew ? "Product added" : "Product saved");
    if (existing && oldRate !== newRate) offerRateUpdate(existing, oldRate, newRate);
  }}, existing ? "Save" : "Add product"));
  openModal(existing ? "Edit product" : "New product", wrap);
};

// ==================== DOCUMENT BUILDER ====================
// A business's starting terms text: the preset marked as default in Settings,
// falling back to the free-text "Default Terms of Sale".
const defaultTermsFor = (biz) => {
  const preset = (biz.termsPresets || []).find(p => p.id === biz.defaultTermsPresetId);
  return (preset ? preset.text : biz.terms) || "";
};

// Does this business have at least one usable bank account?
const hasUsableBank = (biz) => (biz.banks || []).some(b => b.bankName || b.accountName || b.accountNumber);

const startNewDoc = (type) => {
  const biz = activeBiz();
  const cfg = DOC_TYPES[type];
  const seq = biz[cfg.seqKey] || 1;
  const numberFormat = biz[cfg.fmtKey] || cfg.defaultFmt;
  docBuilder = {
    type,
    number: formatDocNumber(numberFormat, seq, today()),
    _seq: seq,
    date: today(),
    expiryDate: cfg.hasExpiry ? addDays(today(), Number(biz[cfg.validityKey] ?? cfg.defaultValidity) || cfg.defaultValidity) : "",
    customerId: null,
    // Defaults from Settings; both are changeable in the builder's Details step.
    bankId: biz.defaultBankId || null,
    showBanks: hasUsableBank(biz),
    showTerms: true,
    status: "Draft",
    currency: biz.currency,
    lineItems: [],
    totals: { subtotal: 0, taxable: 0, taxRate: biz.taxRate || 0, tax: 0, delivery: 0, freight: 0, insurance: 0, legal: 0, inspection: 0, other1: 0, other1Label: "", other2: 0, other2Label: "", total: 0 },
    terms: defaultTermsFor(biz),
    shipping: { deliveryLocation: "", freightType: "land", shipDate: biz.defaultShipNote || "to be discussed", grossWeight: "", cubicWeight: "", totalPackages: "" },
    showExport: false,
    additional: { origin: "NEPAL", embarkation: "", discharge: "", reason: "" },
    businessId: db.activeBusinessId
  };
  openDocBuilder();
};

const editDoc = (d) => {
  docBuilder = JSON.parse(JSON.stringify(d));
  docBuilder._editing = true;
  openDocBuilder();
};

// Convert a source document (e.g. a Quotation) into a NEW linked document of
// another type (PI / Invoice / Delivery Note). The source stays untouched; the
// new doc copies items, customer and totals, gets its own number in the target
// series, and remembers where it came from so the two can link both ways.
const convertDoc = (src, targetType) => {
  const biz = activeBiz();
  const cfg = DOC_TYPES[targetType];
  const seq = biz[cfg.seqKey] || 1;
  const numberFormat = biz[cfg.fmtKey] || cfg.defaultFmt;
  const copy = JSON.parse(JSON.stringify(src));
  copy.type = targetType;
  copy.number = formatDocNumber(numberFormat, seq, today());
  copy._seq = seq;
  copy.id = undefined;              // a brand-new record
  copy._editing = false;
  copy.status = "Draft";
  copy.date = today();
  copy.expiryDate = cfg.hasExpiry ? addDays(today(), Number(biz[cfg.validityKey] ?? cfg.defaultValidity) || cfg.defaultValidity) : "";
  copy.fromDoc = { id: src.id, type: src.type, number: src.number };  // chain link
  if (cfg.hasDelivery && !copy.delivery) {
    copy.delivery = { mode: "own", driverName: "", driverPhone: "", transportCompany: "", vehicleNo: "" };
  }
  docBuilder = copy;
  openDocBuilder();
  toast(`Converting ${DOC_TYPES[src.type].shortLabel} #${src.number} → ${cfg.shortLabel}`);
};

// Re-apply the selected customer's rate card to every line that came from the
// catalogue. Called automatically when the customer changes, so prices never
// reflect the previous party's discounts.
//
// `includeManual` is the difference between the two callers. Switching customer
// must not silently wipe a rate you typed by hand, so that path leaves those
// lines alone. The "Update rates" button is a deliberate press, so it re-prices
// everything and hands those lines back to the rate card.
const repriceLineItems = (includeManual = false) => {
  const rules = customerRules(docBuilder.customerId);
  let changed = 0;
  docBuilder.lineItems.forEach(li => {
    if (li.manualRate && !includeManual) return;
    const list = Number(li.listRate);
    if (!list && list !== 0) return; // ad-hoc line with no list price
    const { pct } = resolveDiscount({ category: li.catPath?.[0], subCategory1: li.catPath?.[1], subCategory2: li.catPath?.[2], subCategory3: li.catPath?.[3] }, rules);
    const net = pct ? +(list * (1 - pct / 100)).toFixed(2) : list;
    if (net !== li.rate || pct !== li.discountPct || li.manualRate) changed++;
    li.rate = net; li.discountPct = pct;
    if (includeManual) li.manualRate = false; // rule-priced again from here on
  });
  return changed;
};

const clampPct = (v) => Math.min(100, Math.max(0, Number(v) || 0));

// Re-price one line from its own list rate at the given discount %. Clears the
// "typed by hand" flag, since the rate is derived again from here on.
const applyLineDiscount = (li, pct, rateInp) => {
  const list = Number(li.listRate);
  if (!isFinite(list)) return;
  const p = clampPct(pct);
  li.discountPct = p;
  li.rate = p ? +(list * (1 - p / 100)).toFixed(2) : list;
  li.manualRate = false;
  if (rateInp) rateInp.value = li.rate;
};

const recomputeTotals = () => {
  const t = docBuilder.totals;
  const r = (t.taxRate || 0) / 100;
  const sep = !!docBuilder.separateVat;
  let base = 0, taxableBase = 0, tax = 0;
  docBuilder.lineItems.forEach(li => {
    const line = li.qty * li.rate;
    if (sep && li.taxable && li.rateIncludesVat && r > 0) {
      const b = line / (1 + r); base += b; taxableBase += b; tax += line - b;
    } else if (sep && li.taxable) {
      base += line; taxableBase += line; tax += line * r;
    } else {
      base += line; if (li.taxable) taxableBase += line;
    }
  });
  if (!sep) tax = taxableBase * r;
  t.subtotal = base;
  t.discountGiven = docBuilder.lineItems.reduce((s, li) => {
    const list = Number(li.listRate);
    if (!list && list !== 0) return s;
    return s + (li.qty * Math.max(0, list - li.rate));
  }, 0);
  t.taxable = taxableBase;
  t.tax = tax;
  t.total = t.subtotal + t.tax + Number(t.delivery || 0) + Number(t.freight || 0) + Number(t.insurance || 0) + Number(t.legal || 0) + Number(t.inspection || 0) + Number(t.other1 || 0) + Number(t.other2 || 0);
  const gw = docBuilder.lineItems.reduce((s, li) => s + (li.qty * (li.weight || 0)), 0);
  if (gw > 0 && !docBuilder.shipping._userSetWeight) docBuilder.shipping.grossWeight = gw.toFixed(2) + " kg";
};

const openDocBuilder = () => {
  recomputeTotals();

  // ---- Stepped layout ----
  // Sections below append to `wrap`; we swap what `wrap` points at as we go,
  // so each block lands in its own step without rewriting the section code.
  const isDelivery = !!DOC_TYPES[docBuilder.type].hasDelivery;
  const steps = {
    party:    el("div", { class: "step-pane" }),
    items:    el("div", { class: "step-pane" }),
    charges:  el("div", { class: "step-pane" }),
    delivery: el("div", { class: "step-pane" }),
    details:  el("div", { class: "step-pane" }),
  };
  const STEP_ORDER = isDelivery
    ? ["party", "items", "delivery", "details"]
    : ["party", "items", "charges", "details"];
  const STEP_LABELS = { party: "Party", items: "Items", charges: "Charges", delivery: "Delivery", details: "Details" };
  let wrap = steps.party;

  // Header info
  wrap.appendChild(el("div", { class: "row" }, [
    inputField("Document #", "number", docBuilder),
    inputField("Date", "date", docBuilder, { type: "date" }),
  ]));
  if (DOC_TYPES[docBuilder.type].hasExpiry) wrap.appendChild(inputField(DOC_TYPES[docBuilder.type].expiryLabel, "expiryDate", docBuilder, { type: "date" }));

  // Customer
  const custField = el("div", { class: "field" });
  custField.appendChild(el("label", {}, `${DOC_TYPES[docBuilder.type].partyLabel} *`));
  const custSel = el("select", { onchange: (e) => {
    if (e.target.value === "__new__") {
      openCustomerModal(null, (newCust) => {
        docBuilder.customerId = newCust.id;
        refreshCustSel();
        toast(`${newCust.companyName} added and selected`);
      });
      return;
    }
    docBuilder.customerId = parseInt(e.target.value);
    const n = repriceLineItems();
    renderResults();
    drawNpDisc();
    drawDiscLink();
    if (n) { recomputeTotals(); rerenderLI(); updateTotals(); toast(`${n} line${n === 1 ? "" : "s"} re-priced for this customer`); }
  }});
  const custSearch = el("input", { placeholder: "🔍 Search " + DOC_TYPES[docBuilder.type].partyLabel.toLowerCase() + "...", style: { marginBottom: "8px" } });
  const refreshCustSel = (q = "") => {
    custSel.innerHTML = "";
    custSel.appendChild(el("option", { value: "" }, "-- select --"));
    const cTerms = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const matches = bizCustomers().filter(c => {
      if (!cTerms.length) return true;
      const hay = ("c" + String(c.id).padStart(4, "0") + " " + c.id + " " + c.companyName + " " +
        c.contactName + " " + c.phone + " " + (c.vatNo || "")).toLowerCase();
      return cTerms.every(t => hay.includes(t));
    });
    matches.forEach(c => {
      const o = el("option", { value: c.id }, `C${String(c.id).padStart(4, "0")} — ${c.companyName} (${c.contactName})`);
      if (docBuilder.customerId === c.id) o.selected = true;
      custSel.appendChild(o);
    });
    if (cTerms.length && matches.length === 1) { custSel.value = matches[0].id; docBuilder.customerId = matches[0].id; }
    custSel.appendChild(el("option", { value: "__new__" }, "+ Add new..."));
    drawDiscLink();
  };

  // Shortcut to this customer's rate card, so changing a category's % doesn't
  // mean abandoning the document you're in the middle of. Their editor opens on
  // top; back here, "Update rates" pulls the new figures into the line items.
  const discLinkRow = el("div", { style: { marginTop: "6px" } });
  const drawDiscLink = () => {
    discLinkRow.innerHTML = "";
    const cust = db.customers.find(c => c.id === docBuilder.customerId);
    if (!cust) return;
    const rules = Array.isArray(cust.discountRules) ? cust.discountRules : [];
    discLinkRow.appendChild(el("button", { type: "button", class: "li-note-reset",
      onclick: () => openCustomerModal(cust, null, drawDiscLink) }, "✏️ Edit discounts"));
    discLinkRow.appendChild(el("span", { style: { fontSize: "11px", color: "var(--muted)", marginLeft: "8px" } },
      rules.length
        ? `${rules.length} categor${rules.length === 1 ? "y" : "ies"} discounted`
        : "No discounts set — pays list price"));
  };
  refreshCustSel();
  custSearch.addEventListener("input", (e) => refreshCustSel(e.target.value));
  custField.appendChild(custSearch);
  custField.appendChild(custSel);
  custField.appendChild(discLinkRow);
  wrap.appendChild(custField);

  // Bank account is chosen in the Details step, pre-filled from the business
  // default — it used to be duplicated here, where it had no effect unless
  // "Show banking details" was also ticked further along.

  // Shipping details — available for every document type.
  let grossInp = null;
  {
    const shipCard = el("div", { class: "card", style: { padding: "12px", marginBottom: "12px", background: "#f9fafb" } });
    shipCard.appendChild(el("div", { style: { fontWeight: 600, marginBottom: 8 } }, "Shipping details"));
    shipCard.appendChild(inputField("Delivery location / site (optional)", "deliveryLocation", docBuilder.shipping, { placeholder: "e.g. Construction site, Sudal-9, Bhaktapur" }));
    shipCard.appendChild(el("div", { class: "row" }, [
      selectField("Freight", "freightType", docBuilder.shipping, ["land", "sea", "air"]),
      inputField("Ship Date", "shipDate", docBuilder.shipping),
    ]));
    const grossField = el("div", { class: "field" });
    grossField.appendChild(el("label", {}, "Est. Gross Weight (auto)"));
    grossInp = el("input", { value: docBuilder.shipping.grossWeight || "", oninput: (e) => { docBuilder.shipping.grossWeight = e.target.value; docBuilder.shipping._userSetWeight = true; }});
    grossField.appendChild(grossInp);
    shipCard.appendChild(grossField);
    shipCard.appendChild(inputField("Total Packages", "totalPackages", docBuilder.shipping));
    wrap.appendChild(shipCard);
  }

  wrap = steps.items;
  // Line items
  const liCard = el("div", { class: "card", style: { padding: "12px" } });
  liCard.appendChild(el("div", { style: { fontWeight: 600, marginBottom: 8 } }, "Line items"));
  const liList = el("div", { id: "li-list" });
  const rateInputs = []; // per-line rate <input>, so the discount control can update it in place
  const rerenderLI = () => {
    if (docBuilder._onTotals) docBuilder._onTotals();
    liList.innerHTML = "";
    rateInputs.length = 0;
    const hdr = el("div", { class: "li-header" });
    ["#", "Description", "Unit", "Qty", "Rate", ""].forEach(t => hdr.appendChild(el("div", {}, t)));
    liList.appendChild(hdr);
    docBuilder.lineItems.forEach((li, idx) => {
      const row = el("div", { class: "li-row" });
      row.appendChild(el("div", { class: "li-num" }, String(idx + 1)));
      row.appendChild(el("input", { class: "li-desc", placeholder: "Description", "aria-label": "Description", value: li.description, oninput: (e) => { li.description = e.target.value; }}));
      row.appendChild(el("input", { class: "li-unit", placeholder: "Unit", "aria-label": "Unit", value: li.unit, oninput: (e) => { li.unit = e.target.value; }}));
      row.appendChild(el("input", { class: "li-qty", type: "number", inputmode: "decimal", placeholder: "Qty", "aria-label": "Quantity", value: li.qty, oninput: (e) => { li.qty = parseFloat(e.target.value) || 0; recomputeTotals(); refreshTotals(); if (docBuilder.shipping._userSetWeight === false || !docBuilder.shipping._userSetWeight) updateGross(); }}));
      const rateInp = el("input", { class: "li-rate", type: "number", inputmode: "decimal", placeholder: "Rate", "aria-label": "Rate", value: li.rate, oninput: (e) => {
        li.rate = parseFloat(e.target.value) || 0;
        li.manualRate = true; // don't overwrite a hand-typed rate on reprice
        recomputeTotals(); refreshTotals(); rerenderNote(idx);
      }});
      rateInputs[idx] = rateInp;
      row.appendChild(rateInp);
      row.appendChild(el("button", { class: "remove-btn", title: "Remove line", onclick: () => { docBuilder.lineItems.splice(idx, 1); recomputeTotals(); rerenderLI(); updateTotals(); updateGross(); }}, "×"));
      liList.appendChild(row);
      // Builder-only discount note. Never printed — the document stays silent.
      const note = el("div", { class: "li-note", id: `li-note-${idx}` });
      liList.appendChild(note);
      drawNote(note, li, rateInp);
    });
  };
  // The under-row hint: pack conversion and what discount produced this rate.
  // Read-only — discounts are changed on the customer's rate card and pulled in
  // with the "Update rates" button, never typed per line.
  function drawNote(note, li, rateInp) {
    note.innerHTML = "";
    if (Number(li.packQty) > 0) {
      const packs = li.qty / li.packQty;
      note.appendChild(el("span", { class: "pack-chip" },
        `${Number.isInteger(packs) ? packs : packs.toFixed(2)} ${li.packUnit || "box"} × ${li.packQty} ${li.unit}`));
    }
    const list = Number(li.listRate);
    const hasList = isFinite(list);
    if (li.manualRate) {
      note.appendChild(el("span", { class: "li-note-manual" }, "rate set manually"));
      if (hasList) {
        note.appendChild(el("button", { type: "button", class: "li-note-reset", title: "Go back to the list price and its discount",
          onclick: () => {
            applyLineDiscount(li, li.discountPct || 0, rateInp);
            recomputeTotals(); refreshTotals();
            drawNote(note, li, rateInp);
          } }, "back to list price"));
      }
      return;
    }
    if (!hasList) { note.appendChild(el("span", { class: "li-note-none" }, "ad-hoc line — no list price")); return; }
    note.appendChild(el("span", { class: li.discountPct ? "li-note-disc" : "li-note-none" },
      li.discountPct
        ? `list ${fmt(list)} → ${fmt(li.rate)} (−${li.discountPct}%)`
        : `list ${fmt(list)} — no discount`));
  }
  function rerenderNote(idx) {
    const note = document.getElementById(`li-note-${idx}`);
    if (note) drawNote(note, docBuilder.lineItems[idx], rateInputs[idx]);
  }
  const updateGross = () => {
    if (!docBuilder.shipping._userSetWeight) {
      const gw = docBuilder.lineItems.reduce((s, li) => s + (li.qty * (li.weight || 0)), 0);
      if (gw > 0) { docBuilder.shipping.grossWeight = gw.toFixed(2) + " kg"; if (grossInp) grossInp.value = docBuilder.shipping.grossWeight; }
    }
  };
  rerenderLI();
  liCard.appendChild(liList);

  // One button, no typing. Change the % on the customer's rate card, come back
  // here, press this — every line is re-cut from its product's list price at
  // whatever the discount now says.
  const liTools = el("div", { style: { display: "flex", gap: "6px", flexWrap: "wrap", marginTop: "10px" } });
  liTools.appendChild(el("button", { class: "btn btn-secondary", type: "button", style: { flex: "none", fontSize: "12px", padding: "7px 12px" },
    onclick: () => {
      const cust = db.customers.find(c => c.id === docBuilder.customerId);
      if (!cust) { toast("Select a customer first", "err"); return; }
      const priced = docBuilder.lineItems.filter(li => isFinite(Number(li.listRate)));
      if (!priced.length) { toast("No catalogue-priced items to update yet", "err"); return; }
      const typed = priced.filter(li => li.manualRate).length;
      const n = priced.length;
      confirmModal(
        `Re-price all ${n} item${n === 1 ? "" : "s"} using ${cust.companyName}'s current discounts?` +
          (typed ? ` ${typed} rate${typed === 1 ? "" : "s"} you typed by hand will be recalculated too — you can type ${typed === 1 ? "it" : "them"} again after.` : ""),
        () => {
          const changed = repriceLineItems(true);
          recomputeTotals(); rerenderLI(); updateTotals();
          toast(changed ? `${changed} line${changed === 1 ? "" : "s"} updated` : "Already matching the current discounts");
        },
        { title: "Update rates?", confirmLabel: "Update rates", danger: false });
    } }, "\u{1F504} Update rates to current discount"));
  liCard.appendChild(liTools);

  // Add line item — segmented: Existing product / New product
  const addWrap = el("div", { style: { marginTop: 10 } });
  const segTabs = el("div", { class: "seg-tabs" });
  const tabExisting = el("button", { type: "button", class: "seg-tab active" }, "📦 Existing product");
  const tabNew = el("button", { type: "button", class: "seg-tab" }, "✨ New product");
  const tabBulk = el("button", { type: "button", class: "seg-tab" }, "📋 Bulk paste");
  segTabs.appendChild(tabExisting); segTabs.appendChild(tabNew); segTabs.appendChild(tabBulk);
  addWrap.appendChild(segTabs);

  // --- Pane: existing product ---
  const existingPane = el("div", { class: "seg-pane" });
  const prodSearch = el("input", { placeholder: "🔍 Search products by name, part no, category...", style: { marginBottom: "8px" } });
  existingPane.appendChild(prodSearch);

  // Category quick-filter chips. Redrawn whenever the catalogue changes, so a
  // category invented in the "New product" pane shows up immediately.
  let activePickCat = "";
  const catChipRow = el("div", { style: { display: "flex", flexWrap: "wrap", gap: "5px", marginBottom: "8px" } });
  const results = el("div", { class: "prod-results" });
  const existQty = el("input", { type: "number", class: "qty-inline", value: 1, min: "0", title: "Default qty" });

  const addProductLine = (p, qty, packs) => {
    const rules = customerRules(docBuilder.customerId);
    const { pct } = resolveDiscount(p, rules);
    const listRate = Number(p.rate) || 0;
    const netRate = pct ? +(listRate * (1 - pct / 100)).toFixed(2) : listRate;
    docBuilder.lineItems.push({
      partNumber: p.partNumber || String(docBuilder.lineItems.length + 1),
      description: p.description, unit: p.unit, qty: parseFloat(qty) || 1,
      rate: netRate, listRate: listRate, discountPct: pct,
      catPath: productPath(p),
      packQty: Number(p.packQty) || 0, packUnit: p.packUnit || "", packs: Number(packs) || 0,
      taxable: p.taxable, rateIncludesVat: !!p.rateIncludesVat, weight: p.weight || 0
    });
    recomputeTotals(); rerenderLI(); updateTotals(); updateGross();
    const packNote = packs ? ` (${packs} ${p.packUnit || "box"})` : "";
    toast(pct ? `Added ${p.description}${packNote} — ${pct}% off` : `Added ${p.description}${packNote}`);
  };

  const renderResults = () => {
    const terms = prodSearch.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    results.innerHTML = "";
    let matches = bizProducts().filter(p => {
      if (activePickCat && p.category !== activePickCat) return false;
      if (!terms.length) return true;
      const hay = [p.description, p.partNumber, p.category, p.subCategory1, p.subCategory2,
        p.subCategory3, p.hsn, p.unit, p.packUnit].filter(Boolean).join(" ").toLowerCase();
      return terms.every(t => hay.includes(t));
    });
    if (bizProducts().length === 0) {
      results.appendChild(el("div", { style: { fontSize: "12px", color: "var(--muted)", padding: "8px" } }, "No saved products yet — use \"New product\" to add one on the fly."));
      return;
    }
    if (matches.length === 0) {
      results.appendChild(el("div", { style: { fontSize: "12px", color: "var(--muted)", padding: "8px" } }, "No products match your search."));
      return;
    }
    matches.slice(0, 50).forEach(p => {
      const rules = customerRules(docBuilder.customerId);
      const { pct } = resolveDiscount(p, rules);
      const listRate = Number(p.rate) || 0;
      const netRate = pct ? +(listRate * (1 - pct / 100)).toFixed(2) : listRate;
      const row = el("div", { class: "prod-result-row" });
      const info = el("div", { style: { flex: "1", minWidth: "0" } });
      info.appendChild(el("div", { style: { fontWeight: 600, fontSize: "13px", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" } }, p.description));
      const metaRow = el("div", { style: { fontSize: "11px", color: "var(--muted)", display: "flex", gap: "6px", alignItems: "center", flexWrap: "wrap" } });
      if (p.category) metaRow.appendChild(el("span", {}, p.category));
      if (pct) {
        metaRow.appendChild(el("span", { style: { textDecoration: "line-through", opacity: ".7" } }, `${activeBiz().currency} ${fmt(listRate)}`));
        metaRow.appendChild(el("span", { style: { color: "var(--accent)", fontWeight: 700 } }, `${activeBiz().currency} ${fmt(netRate)}/${p.unit}`));
        metaRow.appendChild(el("span", { class: "disc-badge" }, `-${pct}%`));
      } else {
        metaRow.appendChild(el("span", {}, `${activeBiz().currency} ${fmt(listRate)}/${p.unit}`));
      }
      info.appendChild(metaRow);
      row.appendChild(info);
      const packN = Number(p.packQty) || 0;
      const qtyInp = el("input", { type: "number", value: existQty.value || 1, min: "0", style: { width: "56px", flex: "none", textAlign: "right" }, title: "Qty" });
      row.appendChild(qtyInp);
      if (packN > 0) {
        // Toggle between entering loose units and whole packs.
        const modeSel = el("select", { style: { width: "70px", flex: "none", fontSize: "11px", padding: "5px" } });
        modeSel.appendChild(el("option", { value: "unit" }, p.unit));
        modeSel.appendChild(el("option", { value: "pack" }, p.packUnit || "box"));
        row.appendChild(modeSel);
        const conv = el("div", { style: { fontSize: "10px", color: "var(--muted)", flex: "none", minWidth: "58px" } });
        const drawConv = () => {
          const q = parseFloat(qtyInp.value) || 0;
          conv.textContent = modeSel.value === "pack" ? `= ${q * packN} ${p.unit}` : (q >= packN && packN ? `≈ ${(q / packN).toFixed(2)} ${p.packUnit || "box"}` : "");
        };
        qtyInp.addEventListener("input", drawConv);
        modeSel.addEventListener("change", drawConv);
        drawConv();
        row.appendChild(conv);
        row.appendChild(el("button", { class: "btn btn-primary", style: { flex: "none", padding: "7px 12px" },
          onclick: () => {
            const q = parseFloat(qtyInp.value) || 0;
            addProductLine(p, modeSel.value === "pack" ? q * packN : q, modeSel.value === "pack" ? q : 0);
          } }, "+ Add"));
      } else {
        row.appendChild(el("button", { class: "btn btn-primary", style: { flex: "none", padding: "7px 12px" }, onclick: () => addProductLine(p, qtyInp.value) }, "+ Add"));
      }
      results.appendChild(row);
    });
  };

  const drawCatChips = () => {
    catChipRow.innerHTML = "";
    const cats = Array.from(new Set(bizProducts().map(p => p.category).filter(Boolean))).sort();
    if (!cats.length) return;
    const mkChip = (label, val) => el("button", {
