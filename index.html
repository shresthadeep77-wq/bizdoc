<style>
:root {
  --primary: #1F4E79;
  --primary-dark: #163a5c;
  --primary-light: #2f6aa0;
  --primary-tint: #eef4fa;
  --accent: #0d3355;
  --danger: #dc2626;
  --nm-light: #ffffff;
  --nm-dark: #c7d0db;
  --surface: #e9edf3;
  --bg: #e9edf3;
  --border: transparent;
  --divider: rgba(17,24,39,.09);
  --text: #111827;
  --muted: #6b7280;
  --radius: 16px;
  --radius-sm: 12px;
  --shadow-sm: 4px 4px 8px var(--nm-dark), -4px -4px 8px var(--nm-light);
  --shadow-md: 7px 7px 15px var(--nm-dark), -7px -7px 15px var(--nm-light);
  --shadow-lg: 11px 11px 24px var(--nm-dark), -9px -9px 20px var(--nm-light);
  --shadow-inset: inset 3px 3px 6px var(--nm-dark), inset -3px -3px 6px var(--nm-light);
  --shadow-float: 0 16px 32px rgba(15,23,42,.28), 0 4px 10px rgba(15,23,42,.16);
  --ease: cubic-bezier(.4,0,.2,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
  --topbar-h: 49px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: "Trebuchet MS", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; -webkit-font-smoothing: antialiased; }
body.modal-open { overflow: hidden; }
button { font-family: inherit; cursor: pointer; border: none; background: none; font-size: 14px; }
input, select, textarea { font-family: inherit; font-size: 14px; padding: 9px 11px; border: 1px solid var(--border); border-radius: var(--radius-sm); width: 100%; background: var(--surface); box-shadow: var(--shadow-inset); transition: border-color .18s var(--ease), box-shadow .18s var(--ease); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: var(--shadow-inset), 0 0 0 3px rgba(31,78,121,.14); }
/* Keyboard users need to see where they are. :focus-visible keeps the ring off
   mouse/touch presses, so this costs nothing visually for everyone else. */
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 4px; }
/* These only take focus programmatically (to move a keyboard user into a
   dialog or back to the page); they should not draw a ring around everything. */
.modal[tabindex="-1"]:focus, .content[tabindex="-1"]:focus { outline: none; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline-offset: 0; }
.topbar :focus-visible, .pv-zoom-btn:focus-visible { outline-color: #fff; }
/* Skip link — first tab stop, lets keyboard users jump past the nav. */
.skip-link { position: absolute; left: -9999px; top: 0; z-index: 300; background: var(--primary); color: #fff; padding: 10px 16px; border-radius: 0 0 var(--radius-sm) 0; font-weight: 600; font-size: 13px; }
.skip-link:focus { left: 0; }
/* Native number spinners (the up/down "slider" arrows browsers add to
   type=number) look inconsistent and dated crammed into narrow popup rows —
   drop them app-wide. Mobile keyboards still switch to numeric via inputmode. */
input[type="number"] { -moz-appearance: textfield; }
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
label { display: block; font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 4px; letter-spacing: .01em; }
.field { margin-bottom: 12px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 140px; }

/* Animations */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
@keyframes scaleIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }
@keyframes popIn { 0% { opacity: 0; transform: scale(.9) translateY(8px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px) scale(.96); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
@keyframes rowIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulseOnce { 0% { box-shadow: 0 0 0 0 rgba(31,78,121,.35); } 100% { box-shadow: 0 0 0 12px rgba(31,78,121,0); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}

/* Layout */
.app { display: flex; flex-direction: column; min-height: 100vh; }
/* Fixed height so the sticky tab strip below can sit flush against it — see
   --topbar-h, which both rules share instead of repeating a magic number. */
.topbar { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color: white; padding: 12px 18px; height: var(--topbar-h); display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: 0; z-index: 40; box-shadow: var(--shadow-md); }
.topbar h1 { font-size: 16px; font-weight: 700; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.biz-switcher { background: var(--primary-tint); color: var(--primary-dark); border: none; box-shadow: var(--shadow-sm); padding: 7px 10px; border-radius: var(--radius-sm); font-size: 13px; max-width: 200px; min-width: 0; text-overflow: ellipsis; flex: 0 1 auto; transition: box-shadow .18s var(--ease), transform .18s var(--ease); }
.biz-switcher:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.biz-switcher option { color: black; }
.tabs { background: var(--surface); display: flex; justify-content: center; overflow-x: auto; border-bottom: 1px solid var(--divider); position: sticky; top: var(--topbar-h); z-index: 30; }
.tab { padding: 12px 16px; font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap; border-bottom: 2px solid transparent; transition: color .18s var(--ease), border-color .18s var(--ease), transform .18s var(--ease); position: relative; display: inline-flex; align-items: center; gap: 6px; }
.tab.active { transform: translateY(-1px); }
.tab .tab-icon { display: inline-flex; align-items: center; }
.tab .tab-icon svg { width: 16px; height: 16px; }
.tab:hover { color: var(--primary-light); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
.content { flex: 1; padding: 16px; max-width: 900px; width: 100%; margin: 0 auto; animation: fadeIn .25s var(--ease); }
@media (min-width: 768px) { .content { padding: 24px; } }

/* Cards */
.card { background: var(--surface); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); transition: box-shadow .2s var(--ease), transform .2s var(--ease); animation: fadeUp .3s var(--ease) both; }
.card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.card-title { font-size: 13px; font-weight: 700; margin-bottom: 14px; color: var(--primary); text-transform: uppercase; letter-spacing: .06em; }
/* Type scale — one source of truth for hierarchy across the app. */
.eyebrow { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.stat-num { font-size: 30px; font-weight: 800; color: var(--primary); line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat-label { font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 6px; text-transform: uppercase; letter-spacing: .05em; }
.display-name { font-size: 20px; font-weight: 700; color: var(--primary); letter-spacing: -.01em; line-height: 1.2; }
/* Counts stay three-across at every width — they are short numbers, and
   stacking them ate most of a phone screen for no gain. Each is a shortcut
   into the matching tab. */
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat-tile { text-align: center; padding: 16px 8px; background: var(--surface); border-radius: var(--radius-sm); box-shadow: var(--shadow-inset); width: 100%; transition: box-shadow .18s var(--ease); }
button.stat-tile { cursor: pointer; }
button.stat-tile:hover { box-shadow: var(--shadow-sm); }
.doc-chain-link { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 0 20px 10px; padding: 9px 12px; background: var(--primary-tint); border-radius: var(--radius-sm); font-size: 12.5px; font-weight: 600; color: var(--primary); cursor: pointer; box-shadow: var(--shadow-sm); }
.doc-chain-link.kids { cursor: default; color: var(--muted); background: var(--surface); }
.doc-chain-go { font-weight: 700; }
.doc-convert-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 20px 0; }
.doc-convert-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px; box-shadow: var(--shadow-sm); transition: border-color .18s var(--ease), transform .18s var(--ease), box-shadow .18s var(--ease); animation: rowIn .3s var(--ease) both; }
/* Staggered cascade for the first several rows — later rows just appear so a
   long list doesn't feel slow. */
.list-item:nth-child(1) { animation-delay: .02s; }
.list-item:nth-child(2) { animation-delay: .06s; }
.list-item:nth-child(3) { animation-delay: .10s; }
.list-item:nth-child(4) { animation-delay: .14s; }
.list-item:nth-child(5) { animation-delay: .18s; }
.list-item:nth-child(6) { animation-delay: .22s; }
.list-item:nth-child(7) { animation-delay: .26s; }
.list-item:nth-child(8) { animation-delay: .30s; }
.list-item:hover { border-color: var(--primary-light); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.list-item .info { flex: 1; min-width: 0; }
.list-item .info .name { font-weight: 600; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-item .info .sub { font-size: 12px; color: var(--muted); }
.list-item .actions { display: flex; gap: 6px; }

/* Buttons */
.btn { padding: 9px 16px; border-radius: var(--radius-sm); font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; transition: transform .18s var(--spring), box-shadow .18s var(--ease), background .18s var(--ease); }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: scale(.95); box-shadow: var(--shadow-inset); }
.btn-primary { background: var(--primary); color: white; box-shadow: var(--shadow-sm); }
.btn-primary:hover { background: var(--primary-dark); box-shadow: var(--shadow-md); transform: translateY(-1px); }
.btn-secondary { background: var(--surface); color: #374151; box-shadow: var(--shadow-sm); }
.btn-secondary:hover { background: #e2e5ea; transform: translateY(-1px); }
.btn-danger { background: var(--danger); color: white; }
.btn-danger:hover { background: #b91c1c; transform: translateY(-1px); }
.btn-icon { padding: 7px 10px; background: var(--surface); color: #374151; border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); transition: background .15s var(--ease), transform .15s var(--ease), box-shadow .15s var(--ease); }
.btn-icon:hover { background: #e5e7eb; transform: translateY(-1px); }
.btn-icon.danger:hover { background: #fee2e2; color: var(--danger); }
.btn-icon.active { background: var(--primary); color: white; box-shadow: var(--shadow-inset); }
.btn-full { width: 100%; justify-content: center; }
.btn-green { background: var(--accent); color: white; }
.btn-green:hover { background: #081f33; transform: translateY(-1px); }
.btn[disabled] { opacity: .6; pointer-events: none; }
.btn .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,.4); border-top-color: white; border-radius: 50%; animation: spin .7s linear infinite; flex: none; }
/* Light-backed buttons need a dark spinner or it's invisible against them. */
.btn-secondary .spin, .btn-icon .spin { border-color: rgba(31,78,121,.25); border-top-color: var(--primary); }
/* A busy button keeps its spinner readable — the global disabled fade hides it. */
.btn[disabled]:has(.spin) { opacity: .85; }
.fab { position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color: white; font-size: 24px; box-shadow: var(--shadow-float); z-index: 20; display: flex; align-items: center; justify-content: center; transition: transform .18s var(--ease); }
.fab:hover { transform: scale(1.08) rotate(90deg); }

/* Search */
.search { position: relative; margin-bottom: 12px; }
.search input { padding-left: 34px; }
.search::before { content: "🔍"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 14px; }

/* Modal */
.modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,.55); backdrop-filter: blur(2px); display: flex; align-items: flex-end; justify-content: center; z-index: 100; padding: 0; animation: fadeIn .2s var(--ease); }
@media (min-width: 768px) { .modal-bg { align-items: center; padding: 20px; } }
.modal { background: var(--surface); width: 100%; max-width: 600px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; border-radius: 16px 16px 0 0; padding: 0; box-shadow: var(--shadow-float); animation: slideUp .28s var(--ease); }
.modal-body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 20px; }
@media (min-width: 768px) { .modal { border-radius: 16px; animation: popIn .32s var(--spring); } }
.modal-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: var(--primary-tint); box-shadow: 0 4px 10px -6px var(--nm-dark); flex: none; border-radius: 16px 16px 0 0; }
@media (min-width: 768px) { .modal-header { padding: 16px 22px; border-radius: 16px 16px 0 0; } }
.modal-header h2 { font-size: 17px; color: var(--primary); font-weight: 700; }
.modal-close { font-size: 22px; color: var(--muted); padding: 0 8px; border-radius: 6px; transition: background .15s var(--ease), color .15s var(--ease); }
.modal-close:hover { background: #f3f4f6; color: var(--text); }

/* Toast */
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--text); color: white; padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow-float); z-index: 200; animation: toastIn .32s var(--spring); display: flex; align-items: center; gap: 8px; }
.toast.ok::before { content: "✓"; color: #7db8ec; font-weight: 700; }
.toast.err::before { content: "!"; color: #f87171; font-weight: 700; }

/* Toggle */
.toggle-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; }
.toggle-row input { width: auto; }

/* Empty state */
.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty-icon { font-size: 40px; margin-bottom: 12px; animation: fadeUp .4s var(--ease) both; }
.empty-title { font-size: 15px; font-weight: 600; color: var(--text); }
.empty-sub { font-size: 13px; margin: 6px auto 0; max-width: 34ch; line-height: 1.5; }

/* Line items */
.li-header, .li-row { display: grid; grid-template-columns: 40px 1fr 60px 80px 80px 28px; gap: 6px; align-items: center; padding: 6px 0; font-size: 12px; }
.li-header { font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--divider); padding-bottom: 8px; }
.li-row { border-radius: 6px; transition: background .15s var(--ease); }
.li-row:hover { background: #f9fafb; }
.li-row input { padding: 4px 6px; font-size: 12px; }
.remove-btn { background: #fee2e2; color: var(--danger); border-radius: 4px; padding: 4px; font-weight: bold; transition: background .15s var(--ease), transform .15s var(--ease); }
.remove-btn:hover { background: #fecaca; transform: scale(1.08); }

/* Totals */
.totals { background: var(--primary-tint); padding: 12px; border-radius: var(--radius-sm); }
.totals-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
.totals-row.grand { font-weight: 700; font-size: 15px; border-top: 2px solid var(--primary); padding-top: 8px; margin-top: 8px; color: var(--primary); }

/* Preview — A4 (210mm x 297mm) @ 96dpi = 794x1123px */
.preview-wrap { background: #55606e; padding: 20px 12px; overflow-x: auto; }
.pv-scaler { transform-origin: top center; transition: transform .2s var(--ease); }
/* Book: stack of A4 pages. Each .pv-page is captured as its own PDF page. */
.pv-book { display: flex; flex-direction: column; gap: 20px; align-items: center; }
.pv-page { background: white; width: 794px; height: 1123px; padding: 28px 30px 46px 30px; font-family: "Trebuchet MS", Arial, sans-serif; font-size: 11px; color: #000; box-shadow: 0 8px 28px rgba(0,0,0,.35); position: relative; box-sizing: border-box; overflow: hidden; }
/* Backwards-compat alias so any leftover single-preview code still styles */
.preview { background: white; width: 794px; min-height: 1123px; margin: 0 auto; padding: 28px 30px; font-family: "Trebuchet MS", Arial, sans-serif; font-size: 11px; color: #000; box-shadow: 0 8px 28px rgba(0,0,0,.35); }
.pv-head { display: table; width: 100%; table-layout: fixed; margin-bottom: 8px; }
.pv-head > * { display: table-cell; vertical-align: top; }
.pv-head > .pv-title { text-align: right; }
.pv-logo-area { display: table; }
.pv-logo-area > * { display: table-cell; vertical-align: middle; }
.pv-logo-area > *:first-child { padding-right: 10px; }
.pv-logo { width: 50px; height: 50px; object-fit: contain; }
.pv-bizname { font-size: 18px; font-weight: bold; color: #1F4E79; }
.pv-title { font-size: 22px; font-weight: bold; color: #1F4E79; }
/* Compact header for continuation pages (page 2+) */
.pv-cont-hdr { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-bottom: 2px solid #1F4E79; margin-bottom: 8px; font-size: 11px; }
.pv-cont-hdr .biz { font-weight: bold; color: #1F4E79; font-size: 13px; }
.pv-cont-hdr .doc { color: #4b5563; font-size: 11px; }
.pv-cont-hdr .cont-badge { background: #eef4fa; color: #1F4E79; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; }
/* Page footer — pinned to bottom of every page */
.pv-page-footer { position: absolute; left: 30px; right: 30px; bottom: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 9px; color: #6b7280; border-top: 1px solid #e5e7eb; padding-top: 6px; }
.pv-page-footer .page-num { font-weight: 600; color: #1F4E79; }
.pv-meta { display: table; width: 100%; table-layout: fixed; margin-bottom: 10px; font-size: 10px; }
.pv-meta > * { display: table-cell; vertical-align: top; }
.pv-meta-r { text-align: right; }
.pv-meta table { border-collapse: collapse; }
.pv-meta-r table { margin-left: auto; }
.pv-meta td { padding: 2px 8px; }
.pv-meta td:first-child { font-weight: bold; }
.pv-meta td:last-child { background: var(--primary-tint); min-width: 80px; }
.pv-section-hdr { background: #1F4E79; color: white; padding: 3px 6px; font-weight: bold; font-size: 10px; margin: 8px 0 0 0; }
.pv-3col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; margin-bottom: 8px; border-left: 1px solid #ccc; }
.pv-3col > div { padding: 6px; border-right: 1px solid #ccc; border-bottom: 1px solid #ccc; font-size: 10px; }
.pv-3col > div > div { margin-bottom: 2px; }
/* Items table — full width now (totals go below, not beside) */
.pv-items { border: 1px solid #1F4E79; margin-bottom: 0; }
.pv-items table { width: 100%; border-collapse: collapse; font-size: 10.5px; }
.pv-items th { background: #1F4E79; color: white; padding: 5px 4px; text-align: left; border: 1px solid #1F4E79; font-size: 10px; font-weight: 600; }
.pv-items td { padding: 5px 6px; border: 1px solid #d0d0d0; line-height: 1.35; }
.pv-items .num { text-align: right; font-variant-numeric: tabular-nums; }
.pv-items .pv-cat-chip { display: inline-block; background: #e8eef5; color: #1F4E79; font-size: 8.5px; font-weight: 700; padding: 1px 6px; border-radius: 8px; margin-right: 5px; letter-spacing: 0.3px; text-transform: uppercase; line-height: 1.2; vertical-align: 1px; }
.pv-items .pv-desc-text { }
/* "Continued" marker on the last row of a non-final page */
.pv-items-cont-note { padding: 4px 8px; text-align: right; font-size: 9.5px; font-style: italic; color: #6b7280; border: 1px solid #1F4E79; border-top: none; background: #f9fafb; }
/* Totals block — full width, below items */
.pv-totals-wide { border: 1px solid #1F4E79; border-top: none; display: flex; margin-bottom: 6px; }
.pv-totals-wide .side-note { flex: 1; padding: 8px 10px; font-size: 10px; color: #4b5563; border-right: 1px solid #d0d0d0; }
.pv-totals-wide table { border-collapse: collapse; width: 280px; }
.pv-totals-wide td { padding: 5px 8px; border-bottom: 1px solid #d0d0d0; font-size: 10.5px; }
.pv-totals-wide td:first-child { font-weight: 600; background: #f7f5f0; }
.pv-totals-wide td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.pv-totals-wide tr.grand td { background: var(--primary-tint); font-weight: bold; font-size: 12.5px; color: #1F4E79; }
.pv-words { border: 1px solid #1F4E79; border-top: none; padding: 6px 8px; font-size: 10.5px; background: #f7f9fc; }
.pv-words-label { font-weight: bold; color: #1F4E79; }
.pv-terms { border: 1px solid #1F4E79; padding: 0; margin-top: 4px; }
.pv-terms-hdr { background: #1F4E79; color: white; padding: 3px 6px; font-weight: bold; font-size: 10px; }
.pv-terms-body { padding: 6px 8px; font-size: 10.5px; line-height: 1.4; }
.pv-terms-body div { margin-bottom: 3px; }
.pv-addl { margin-top: 8px; border: 1px solid #999; }
.pv-addl-hdr { background: #d1d5db; padding: 3px 6px; font-weight: bold; font-size: 10px; }
.pv-addl-body { padding: 6px 8px; font-size: 10.5px; }
.pv-addl-body table { border-collapse: collapse; }
.pv-addl-body td { padding: 2px 8px 2px 0; }
.pv-addl-body td:first-child { font-weight: 600; min-width: 140px; }
.pv-footer { margin-top: 14px; font-size: 10.5px; }
.pv-sig { margin-top: 26px; }
.pv-sigline { border-top: 1px solid #000; width: 200px; padding-top: 3px; }
.pv-sig-img { max-height: 40px; margin-bottom: 4px; }
.pv-stamp-img { position: absolute; left: 20px; bottom: 6px; opacity: .8; transform: rotate(-9deg); pointer-events: none; }

.action-bar { display: flex; gap: 8px; padding: 14px 0 4px; background: transparent; flex-wrap: wrap; }
.action-bar button { flex: 1 1 auto; min-width: 88px; justify-content: center; }
.action-bar button.icon-only { flex: 0 0 auto; min-width: 44px; padding: 9px 12px; }
@media (max-width: 480px) {
  /* auto-fit rather than a fixed 4 columns: the document preview's five icon
     buttons still tile 4-across, but a two-button confirm dialog fills the
     row instead of huddling in the left quarter. */
  .action-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 6px; }
  .action-bar button { min-width: 0; padding: 10px 6px; flex: none; }
  .action-bar button .lbl { display: none; }
  .action-bar button.keep-label { grid-column: 1 / -1; }
  .action-bar button.keep-label .lbl { display: inline; }
}
.btn svg.ico { width: 15px; height: 15px; flex: none; }

/* Segmented tabs (line item add panel) */
.seg-tabs { display: flex; gap: 4px; background: #eef0f3; padding: 4px; border-radius: 10px; margin-bottom: 10px; }
.seg-tab { flex: 1; padding: 8px 10px; border-radius: 7px; font-size: 12.5px; font-weight: 600; color: var(--muted); transition: background .18s var(--ease), color .18s var(--ease), box-shadow .18s var(--ease); }
.seg-tab:hover { color: var(--primary-light); }
.seg-tab.active { background: var(--surface); color: var(--primary); box-shadow: var(--shadow-sm); }
.seg-pane { animation: fadeUp .22s var(--ease); }
.qty-inline { width: 70px; flex: none !important; }
.prod-results { max-height: 280px; overflow-y: auto; overflow-x: hidden; border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-inset); }
.prod-result-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid #f0f2f5; }
.prod-result-row:last-child { border-bottom: none; }
.prod-result-row:hover { background: var(--primary-tint); }
.pick-chip { padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #eef0f3; color: var(--muted); border: 1px solid transparent; }
.pick-chip:hover { background: #e2edf7; color: var(--primary); }
.pick-chip.active { background: var(--primary); color: white; }
/* Numeric alignment — figures line up vertically in totals and line items */
input[type="number"], .pv-tot-tbl td, .li-row input[type="number"], .amt, .prod-result-row { font-variant-numeric: tabular-nums; }
/* Discount UI */
.disc-badge { background: var(--accent); color: #fff; font-size: 9.5px; font-weight: 700; padding: 1px 6px; border-radius: 999px; }
.li-note { font-size: 10.5px; padding: 0 2px 6px 26px; margin-top: -4px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.li-note-disc { color: var(--accent); font-weight: 600; }
.li-note-none { color: var(--muted); }
.li-note-manual { color: #b45309; font-weight: 600; }
.li-note-reset { font-size: 11px; font-weight: 700; color: var(--primary); text-decoration: underline; padding: 2px 0; }
.rule-row { padding: 8px 0; border-bottom: 1px solid var(--divider); }
.rule-row:last-child { border-bottom: none; }
.rule-subrow { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
/* Percentage input + "%" shown as one field instead of two loose controls
   floating next to the row text. */
.pct-group { display: flex; align-items: center; flex: none; gap: 2px; padding: 6px 9px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); box-shadow: var(--shadow-inset); transition: border-color .18s var(--ease), box-shadow .18s var(--ease); }
.pct-group:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(31,78,121,.14); }
.pct-group input { width: 44px !important; }
.pct-group span { font-size: 12px; color: var(--muted); font-weight: 600; }
/* Category picker */
.crumb-bar { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; padding-bottom: 8px; border-bottom: 1px solid var(--divider); }
.crumb { background: none; border: none; color: var(--primary); font-size: 12px; font-weight: 600; padding: 2px 4px; cursor: pointer; }
.crumb:hover { text-decoration: underline; }
.crumb-sep { color: var(--muted); font-size: 11px; }
.picker-list { max-height: 320px; overflow-y: auto; overflow-x: hidden; border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-inset); }
.picker-row { display: flex; align-items: stretch; gap: 0; border-bottom: 1px solid #f0f2f5; }
.picker-row:last-child { border-bottom: none; }
.picker-body { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; padding: 11px 10px; }
.picker-row.has-kids .picker-body { cursor: pointer; }
.picker-body:hover { background: var(--primary-tint); }
.picker-row.picker-disabled { opacity: 0.5; }
.picker-row.picker-disabled .picker-body { cursor: not-allowed; }
.picker-row.picker-disabled .picker-body:hover { background: transparent; }
.picker-chev { font-size: 20px; color: var(--primary); font-weight: 700; line-height: 1; flex: none; }
.picker-use { flex: none !important; padding: 6px 14px !important; font-size: 12px !important; margin: 8px 8px 8px 0; align-self: center; }
.picker-empty { padding: 14px; font-size: 12px; color: var(--muted); text-align: center; }
/* Products: sub-tabs + category grid */
.subtabs { display: flex; gap: 4px; background: #eef0f3; padding: 4px; border-radius: var(--radius-sm); margin-bottom: 12px; }
.subtab { flex: 1; padding: 9px 10px; border: none; background: transparent; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .18s var(--ease); }
.subtab.active { background: var(--surface); color: var(--primary); box-shadow: var(--shadow-sm); }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.cat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 13px 12px; cursor: pointer; transition: all .18s var(--ease); }
.cat-card:hover { border-color: var(--primary-light); background: var(--primary-tint); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.cat-card-name { font-weight: 700; font-size: 13.5px; color: var(--primary); }
.cat-card-meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
.pack-chip { display: inline-block; background: #eef2ff; color: #4338ca; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.pack-note { margin-top: 6px; }
/* Bulk selection */
.bulk-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; background: var(--primary-tint); border: 1px solid var(--primary-light); border-radius: var(--radius-sm); padding: 8px 10px; margin-bottom: 12px; position: sticky; top: 0; z-index: 5; }
.bulk-mini { padding: 6px 12px !important; font-size: 12px !important; flex: none !important; }
.bulk-cb { width: auto !important; flex: none !important; margin: 0 10px 0 0; align-self: center; transform: scale(1.25); }
.list-item.row-selected { background: var(--primary-tint); border-color: var(--primary-light); }
/* Settings section cards */
.settings-sections { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; box-shadow: var(--shadow-inset); }
.settings-row { display: flex; align-items: center; gap: 11px; padding: 13px 12px; border-bottom: 1px solid var(--divider); cursor: pointer; transition: background .15s var(--ease); min-height: 44px; }
.settings-row:last-child { border-bottom: none; }
.settings-row:hover { background: var(--primary-tint); }
.settings-icon { font-size: 19px; flex: none; width: 26px; text-align: center; }
.settings-title { font-size: 13.5px; font-weight: 600; color: var(--text); }
.settings-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.settings-chev { font-size: 19px; color: var(--muted); flex: none; }
/* Customer report */
.report-doc { background: #fff; padding: 20px; font-size: 12px; color: #111; }
.rpt-head { border-bottom: 2px solid var(--primary); padding-bottom: 8px; margin-bottom: 14px; }
.rpt-biz { font-size: 16px; font-weight: 800; color: var(--primary); }
.rpt-title { font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; margin-top: 2px; }
.rpt-date { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
.rpt-section { margin-bottom: 16px; }
.rpt-h { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--primary); border-bottom: 1px solid var(--divider); padding-bottom: 3px; margin-bottom: 7px; }
.rpt-tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.rpt-tbl th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); border-bottom: 1px solid var(--divider); padding: 4px 6px; }
.rpt-tbl td { padding: 4px 6px; border-bottom: 1px solid #f0f2f5; font-size: 11.5px; }
.rpt-k { color: var(--muted); width: 34%; }
.rpt-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.rpt-stat { background: var(--primary-tint); border-radius: var(--radius-sm); padding: 9px 10px; }
.rpt-stat-v { font-size: 15px; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; }
.rpt-stat-l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }
.rpt-note { font-size: 11px; color: var(--muted); margin-top: 6px; }
/* ---- Stepped document builder ---- */
.modal-wide { max-width: 860px; width: 100%; }
.modal-settings { max-width: 980px; width: 100%; }

/* Settings modal — sidebar + content shell */
.settings-wrap { display: flex; flex-direction: column; min-height: 0; }
.settings-shell { display: grid; grid-template-columns: 220px 1fr; gap: 14px; min-height: 460px; max-height: calc(90vh - 130px); }
.settings-sidebar { background: var(--surface); border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); padding: 12px 8px; overflow-y: auto; overflow-x: hidden; min-height: 0; }
.settings-side-hdr { padding: 6px 10px 12px; font-size: 11px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--divider); margin-bottom: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.settings-side-group { padding: 10px 10px 4px; font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
.settings-side-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 10px; border-radius: 8px; background: transparent; color: var(--text); transition: background .15s var(--ease); }
.settings-side-item:hover { background: rgba(31, 78, 121, 0.06); }
.settings-side-item.active { background: var(--primary); color: white; }
.settings-side-item.active .settings-side-sub { color: rgba(255, 255, 255, 0.75); }
.settings-side-icon { font-size: 15px; flex: none; width: 20px; text-align: center; }
.settings-side-chev { display: none; font-size: 18px; color: var(--muted); flex: none; }
.settings-side-title { font-size: 13px; font-weight: 600; }
.settings-side-sub { font-size: 10.5px; color: var(--muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.settings-content { padding: 16px 18px; overflow-y: auto; overflow-x: hidden; background: var(--surface); border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); min-height: 0; }
.settings-content-hdr { font-size: 15px; font-weight: 700; color: var(--primary); margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--divider); }
/* Compact, right-aligned Close/Save — a full sticky bar was crowding the
   settings shell right below it; this stays out of the way of content. */
.settings-action-bar { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 0 4px; background: transparent; }
.settings-action-bar .btn { flex: none; padding: 8px 16px; font-size: 12.5px; }
.modal-footer-bar { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; flex: none; background: var(--surface); box-shadow: 0 -4px 10px -6px var(--nm-dark); }
.modal-footer-bar .btn { flex: none; padding: 9px 18px; }

@media (max-width: 720px) {
  .modal-settings { max-width: none; width: 100vw; height: 100dvh; max-height: 100dvh !important; border-radius: 0; margin: 0; }
  .modal-settings .modal-header { border-radius: 0; }
  .settings-shell { grid-template-columns: 1fr; min-height: 0; max-height: none; border: none; border-radius: 0; overflow: visible; }
  .settings-sidebar { border-right: none; box-shadow: none; background: transparent; max-height: none; overflow: visible; }
  .settings-content { display: none; }
  .settings-side-chev { display: inline-block; }
  .settings-side-item { background: var(--surface); box-shadow: var(--shadow-sm); margin-bottom: 8px; padding: 12px 10px; }
}
.builder-shell { display: flex; flex-direction: column; max-height: calc(100vh - 160px); }
.step-tabs { display: flex; gap: 4px; background: #eef0f3; padding: 4px; border-radius: var(--radius-sm); margin-bottom: 10px; flex: none; }
.step-tab { flex: 1; padding: 9px 6px; border: none; background: transparent; border-radius: 6px; font-size: 12.5px; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .18s var(--ease); min-height: 40px; }
.step-tab.active { background: var(--surface); color: var(--primary); box-shadow: var(--shadow-sm); }
.step-body { overflow-y: auto; overflow-x: hidden; flex: 1; min-height: 0; padding-right: 2px; }
.step-footer { flex: none; display: flex; align-items: center; gap: 10px; padding-top: 10px; margin-top: 10px; border-top: 1px solid var(--divider); background: var(--surface); position: sticky; bottom: 0; }
.step-total { flex: 1; min-width: 0; }
.step-total-amt { font-size: 17px; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; line-height: 1.1; }
.step-total-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
.step-foot-btns { display: flex; gap: 6px; flex: none; }
.step-foot-btns .btn { padding: 10px 16px; min-height: 44px; }
.step-save-alt { padding: 10px 12px !important; }
/* ---- Touch targets ---- */
.btn-icon { min-width: 40px; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; }
.remove-btn { min-width: 36px; min-height: 36px; }
/* ---- Status: colour + shape, not colour alone, so it still reads when the
   colours are hard to tell apart or the page is printed in black and white. --- */
.status-badge::before { content: "●"; margin-right: 4px; font-size: 9px; }
.status-badge.st-Draft::before { content: "○"; }
.status-badge.st-Sent::before { content: "◐"; }
.status-badge.st-Confirmed::before { content: "●"; }
.status-badge.st-Cancelled::before { content: "✕"; }
/* Units-of-measure editor list */
.units-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.unit-chip { display: inline-flex; align-items: center; gap: 2px; padding: 4px 4px 4px 10px; background: var(--surface); border-radius: 999px; box-shadow: var(--shadow-sm); font-size: 12.5px; font-weight: 600; color: #374151; animation: rowIn .2s var(--ease) both; }
.unit-chip-label { cursor: pointer; padding: 2px 0; }
.unit-chip-edit { width: 72px !important; padding: 2px 6px !important; font-size: 12.5px !important; box-shadow: none !important; }
.unit-chip-x { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: transparent; color: var(--muted); font-size: 15px; line-height: 1; transition: background .15s var(--ease), color .15s var(--ease); }
.unit-chip-x:hover { background: #fee2e2; color: var(--danger); }
.unit-chip-arrow { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 20px; color: var(--muted); font-size: 16px; font-weight: 700; }
.unit-chip-arrow:hover { color: var(--primary); }

/* Preview zoom controls */
.pv-zoom-bar { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px; background: #3f4854; border-bottom: 1px solid #2c343d; }
.pv-zoom-btn { background: rgba(255,255,255,.14); color: #fff; border: none; border-radius: 6px; min-width: 38px; height: 32px; font-size: 15px; font-weight: 700; cursor: pointer; }
.pv-zoom-btn:hover { background: rgba(255,255,255,.26); }
.pv-zoom-val { color: #dfe4ea; font-size: 12px; font-weight: 600; min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; }

@media (max-width: 640px) {
  .builder-shell { max-height: calc(100vh - 190px); }
  .step-tab { font-size: 11.5px; padding: 9px 3px; }
  .step-total-amt { font-size: 15px; }
  .step-foot-btns .btn { padding: 10px 12px; font-size: 13px; }
  /* Line items: card-like stacked layout on mobile with a labelled field grid */
  .li-row { display: grid !important; grid-template-columns: 1fr 1fr 1fr 1fr; grid-template-areas: "num num num del" "desc desc desc desc" "unit qty rate rate"; gap: 8px !important; padding: 12px; margin-bottom: 10px; background: var(--surface); border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); align-items: end; }

  .li-row .li-unit, .li-row .li-qty, .li-row .li-rate { position: relative; margin-top: 16px; }
  .li-row .li-unit::before, .li-row .li-qty::before, .li-row .li-rate::before { position: absolute; top: -15px; left: 2px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }

}

/* ============ MOBILE LAYOUT (bottom tab bar + stacking) ============ */
@media (max-width: 767px) {
  /* Bottom tab bar — thumb-reachable, replaces the scrolling top strip */
  .tabs {
    position: fixed; bottom: 0; left: 0; right: 0; top: auto;
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    overflow: visible; border-top: 1px solid var(--divider); border-bottom: none;
    box-shadow: 0 -2px 10px rgba(16,24,40,.08);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    z-index: 40;
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; padding: 7px 2px 6px; min-height: 54px;
    border-bottom: none; border-top: 2px solid transparent; font-size: 10px;
  }
  .tab.active { border-bottom-color: transparent; border-top-color: var(--primary); background: var(--primary-tint); }
  .tab-icon { display: inline-flex; align-items: center; justify-content: center; }
  .tab-icon svg { width: 20px; height: 20px; }
  .tab-label { font-size: 10px; letter-spacing: -.01em; }

  /* Leave room for the bar so nothing hides behind it */
  .content { padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  .fab { bottom: calc(72px + env(safe-area-inset-bottom, 0px)); right: 16px; }
  .modal-bg { padding-bottom: 0; }
  .modal { max-height: 100vh; }

  /* Multi-column form rows stack — the biggest readability win */
  .row { flex-direction: column; gap: 0 !important; }
  .row > * { width: 100%; }

  /* Inputs at 16px stop iOS Safari zooming the page on focus */
  input, select, textarea { font-size: 16px !important; }
  .qty-inline, .prod-result-row input[type="number"] { font-size: 15px !important; }

  /* List rows: let the name breathe, wrap the action buttons under it */
  .list-item { flex-wrap: wrap; gap: 6px; padding: 11px 10px; }
  .list-item .info { flex: 1 1 100%; min-width: 0; }
  .list-item .actions { flex: 1 1 100%; justify-content: flex-end; }
  .list-item .name { font-size: 13.5px; }

  /* Bulk bar sits above the tab bar when it's sticky */
  .bulk-bar { position: sticky; top: 0; }

  /* Category cards: two clean columns */
  .cat-grid { grid-template-columns: 1fr 1fr; gap: 7px; }
  .cat-card { padding: 11px 10px; }

  /* Product picker rows stack so qty/pack controls aren't crushed */
  .prod-result-row { flex-wrap: wrap; }
  .prod-result-row > div:first-child { flex: 1 1 100%; }

  /* Report tables scroll horizontally instead of overflowing the screen */
  .report-doc { padding: 14px; }
  .rpt-section { overflow-x: auto; }
  .rpt-tbl { min-width: 420px; }
  .rpt-grid { grid-template-columns: 1fr 1fr; }

  /* Settings rows a touch taller for thumbs */
  .settings-row { padding: 14px 12px; }

  /* Toasts and undo bar clear the tab bar */
  .toast { bottom: calc(72px + env(safe-area-inset-bottom, 0px)); max-width: calc(100vw - 24px); }

  /* Steps footer */
  .step-foot { padding-bottom: 10px; }

  .action-bar { flex-wrap: wrap; }
  .action-bar .btn { flex: 1 1 auto; min-width: 44%; }
}

@media (max-width: 360px) {
  .tab-label { display: none; }          /* icons only on very narrow phones */
  .tab { min-height: 48px; }
  .content { padding-bottom: calc(66px + env(safe-area-inset-bottom, 0px)); }
  .fab { bottom: calc(62px + env(safe-area-inset-bottom, 0px)); }
  .toast { bottom: calc(62px + env(safe-area-inset-bottom, 0px)); }
  .cat-grid { grid-template-columns: 1fr; }
}
.chip { padding: 6px 11px; border-radius: 999px; background: #eef0f3; color: #374151; font-size: 12px; font-weight: 500; border: 1px solid transparent; cursor: pointer; transition: background .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease), transform .15s var(--ease); }
.chip:hover { transform: translateY(-1px); }
.chip:hover { background: #e2e5ea; }
.chip.active { background: var(--primary-tint); color: var(--primary); border-color: var(--primary-light); font-weight: 600; }
.chip-check { display: flex; align-items: center; gap: 7px; padding: 9px 12px; background: var(--primary-tint); border-radius: var(--radius-sm); font-size: 12.5px; font-weight: 500; color: #1f2937; margin-top: 4px; cursor: pointer; transition: background .15s var(--ease); }
.chip-check:hover { background: #e2edf7; }
.chip-check input { width: auto; margin: 0; }

.cat-section-hdr { display: flex; align-items: center; justify-content: space-between; padding: 10px 2px 6px; margin-top: 4px; border-bottom: 2px solid var(--primary); }
.cat-section-hdr .cat-name { font-size: 12.5px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: .03em; }
.cat-section-hdr .cat-count { font-size: 11px; color: var(--muted); background: var(--primary-tint); padding: 1px 8px; border-radius: 999px; }

.subcat-section-hdr .subcat-count { font-size: 10px; color: var(--muted); background: #eef0f3; padding: 1px 7px; border-radius: 999px; }

/* Onboarding */
.onboard { max-width: 480px; margin: 40px auto; padding: 28px; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-md); animation: fadeUp .35s var(--ease); }
.onboard h1 { color: var(--primary); margin-bottom: 8px; }
.onboard p { color: var(--muted); margin-bottom: 20px; }

.status-badge { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 600; margin-left: 6px; animation: fadeIn .3s var(--ease); }
.st-Draft { background: #eef0f3; color: #4b5563; }
.st-Sent { background: var(--primary-tint); color: var(--primary); }
.st-Confirmed { background: #d7e6f2; color: var(--primary-dark); }
.st-Cancelled { background: #e5e7eb; color: #6b7280; text-decoration: line-through; }

/* Print (fallback if user uses Ctrl+P instead of the PDF button) */
@media print {
  .topbar, .tabs, .action-bar, .fab, .no-print, .pv-zoom-bar { display: none !important; }
  /* The doc list / whatever's underneath the preview modal is still normal-flow
     DOM content — without this it prints too (or instead of the preview). */
  .content { display: none !important; }
  /* .app has min-height:100vh for on-screen layout. Hiding its children above
     doesn't remove that reserved height, so the browser was printing a full
     blank page (the empty .app shell) before ever reaching the modal that
     holds the actual preview. Hide the whole shell, not just its contents. */
  .app { display: none !important; }
  .modal-header { display: none !important; }
  /* modal-bg/.modal are fixed-position + scroll-clipped for on-screen use;
     printing needs static, unclipped flow so the full multi-page doc prints. */
  .modal-bg { position: static !important; background: none !important; backdrop-filter: none !important; padding: 0 !important; display: block !important; }
  .modal { max-width: none !important; max-height: none !important; overflow: visible !important; padding: 0 !important; border-radius: 0 !important; box-shadow: none !important; }
  body { background: white; }
  .preview-wrap { background: white; padding: 0; overflow: visible; }
  /* The on-screen preview shrinks the A4 page with a CSS transform so it
     fits the modal/viewport. Printing must undo that: otherwise the browser
     prints the shrunk box at full (unscaled) font size and every line of
     text overlaps the next — the same issue the html2canvas capture path
     already guards against via withScalerReset(). */
  .pv-scaler { transform: none !important; height: auto !important; }
  .pv-book { gap: 0; }
  .pv-page { box-shadow: none; page-break-after: always; break-after: page; }
  .pv-page:last-child { page-break-after: auto; break-after: auto; }
  @page { size: A4; margin: 0; }
}

<script>
// ==================== PDF LIBRARIES, LOADED ON DEMAND ====================
// html2canvas and jsPDF together are about 550 KB — more than the entire rest
// of the app. They are only ever touched when someone exports a PDF or a PNG,
// which most visits never do, so the build leaves them out of index.html and
// writes them to lib/ instead. This fetches them the first time they are
// actually needed.
//
// The service worker caches them alongside the page, so the second export works
// with no connection. `node build.js --single` inlines them instead, in which
// case both globals already exist and this resolves immediately.

let _pdfLibsPromise = null;

const pdfLibsReady = () => !!(window.html2canvas && window.jspdf && window.jspdf.jsPDF);

const loadScriptOnce = (src) => new Promise((resolve, reject) => {
  const s = document.createElement("script");
  s.src = src;
  s.async = false; // keep execution order predictable if two are queued
  s.onload = () => resolve();
  s.onerror = () => reject(new Error("Could not load " + src));
  document.head.appendChild(s);
});

// Resolve to true when both libraries are usable, false when they could not be
// fetched. Callers show their own message on false — a failed export should say
// so in place rather than throwing into the console.
const ensurePdfLibs = async () => {
  if (pdfLibsReady()) return true;
  if (!_pdfLibsPromise) {
    _pdfLibsPromise = (async () => {
      // html2canvas first: jsPDF is the larger file, and starting it second
      // still overlaps both downloads because async=false only orders execution.
      await Promise.all([
        loadScriptOnce("lib/html2canvas.js"),
        loadScriptOnce("lib/jspdf.js"),
      ]);
      if (!pdfLibsReady()) throw new Error("PDF libraries loaded but did not register");
    })();
    // A failed attempt must not poison every later one — clear the cached
    // promise so the next export retries (the user may just have been offline).
    _pdfLibsPromise.catch(() => { _pdfLibsPromise = null; });
  }
  try {
    await _pdfLibsPromise;
    return true;
  } catch (e) {
    toast(
      navigator.onLine
        ? "Couldn't load the PDF export tools. Try again."
        : "PDF export needs to download once while online. Connect and try again.",
      "err", 6000
    );
    return false;
  }
};

// ==================== STORAGE ====================
const DB_KEY = "pipomaker_v1";
const DEFAULT_UNITS = ["pcs", "kg", "set", "box", "m", "ft", "litre", "bundle"];

const defaultDB = () => ({
  businesses: [],
  activeBusinessId: null,
  customers: [],
  products: [],
  documents: [],
  nextIds: { biz: 1, cust: 1001, prod: 1, doc: 1 }
});

// Bring any database up to the shape the current code expects.
//
// Every way data gets in — normal load, a backup file, Google Drive, a copy
// found in this browser's storage — goes through here. A backup made by an
// older build (or hand-edited, or half-written) is missing fields that newer
// features read, and one missing field used to blank the whole screen with no
// way back. Filling the gaps up front means a partial backup loads and works
// instead of bricking the app.
const normalizeDB = (raw) => {
  const db = (raw && typeof raw === "object") ? raw : {};
  const base = defaultDB();

  // Top-level lists must exist and be arrays before anything iterates them.
  ["businesses", "customers", "products", "documents"].forEach(k => {
    if (!Array.isArray(db[k])) db[k] = [];
  });
  db.businesses = db.businesses.filter(b => b && typeof b === "object");
  db.nextIds = Object.assign({}, base.nextIds, (db.nextIds && typeof db.nextIds === "object") ? db.nextIds : {});

  db.businesses.forEach(b => {
    if (!Array.isArray(b.units) || !b.units.length) b.units = DEFAULT_UNITS.slice();
    if (!Array.isArray(b.banks)) b.banks = [];
    // Every document type needs a next-number counter (see DOC_TYPES seqKeys).
    ["nextPi", "nextPo", "nextQt", "nextInv", "nextDn"].forEach(k => {
      if (!(Number(b[k]) > 0)) b[k] = 1;
    });
    if (!b.qtFormat) b.qtFormat = "QT-{YYYY}-{####}";
    // Per-type validity: older records only had piValidityDays.
    if (b.piValidityDays === undefined) b.piValidityDays = 5;
    if (b.qtValidityDays === undefined) b.qtValidityDays = 15;
    if (b.poValidityDays === undefined) b.poValidityDays = 30;
  });

  // Ids must be usable: ours are numbers, but CSV/JSON round-trips can turn
  // them into strings, which then never match a === lookup and the record
  // silently disappears from every list.
  const numId = (v) => (typeof v === "string" && v.trim() !== "" && !isNaN(v)) ? Number(v) : v;
  const bizIds = new Set(db.businesses.map(b => (b.id = numId(b.id))));
  ["customers", "products", "documents"].forEach(k => {
    db[k] = db[k].filter(r => r && typeof r === "object");
    db[k].forEach(r => { r.id = numId(r.id); r.businessId = numId(r.businessId); });
  });
  db.customers.forEach(c => { if (!Array.isArray(c.discountRules)) c.discountRules = []; });

  // Documents carry the most optional structure, so they need the most filling in.
  db.documents.forEach(d => {
    d.customerId = numId(d.customerId);
    if (!d.shipping) d.shipping = { deliveryLocation: "", freightType: "", shipDate: "", grossWeight: "", cubicWeight: "", totalPackages: "" };
    if (!d.currency) d.currency = (db.businesses.find(b => b.id === d.businessId) || {}).currency || "NPR";
    if (!d.additional) d.additional = { origin: "", embarkation: "", discharge: "", reason: "" };
    if (!Array.isArray(d.lineItems)) d.lineItems = [];
    if (!d.status) d.status = "Draft";
    const t = d.totals || (d.totals = {});
    ["subtotal", "taxable", "tax", "delivery", "freight", "insurance", "legal", "inspection", "other1", "other2", "total", "discountGiven"].forEach(k => {
      if (typeof t[k] !== "number" || isNaN(t[k])) t[k] = 0;
    });
    if (typeof t.taxRate !== "number" || isNaN(t.taxRate)) t.taxRate = 0;
  });

  // A pointer at a business that no longer exists renders an empty app.
  db.activeBusinessId = numId(db.activeBusinessId);
  if (!bizIds.has(db.activeBusinessId)) {
    db.activeBusinessId = db.businesses.length ? db.businesses[0].id : null;
  }

  // Next ids must clear everything already stored, or the next record created
  // reuses a live id and quietly overwrites/merges with an existing one.
  const maxOf = (list) => list.reduce((m, r) => Math.max(m, Number(r.id) || 0), 0);
  db.nextIds.biz = Math.max(Number(db.nextIds.biz) || 1, maxOf(db.businesses) + 1);
  db.nextIds.cust = Math.max(Number(db.nextIds.cust) || 1001, maxOf(db.customers) + 1);
  db.nextIds.prod = Math.max(Number(db.nextIds.prod) || 1, maxOf(db.products) + 1);
  db.nextIds.doc = Math.max(Number(db.nextIds.doc) || 1, maxOf(db.documents) + 1);
  return db;
};

const loadDB = () => {
  try { return normalizeDB(JSON.parse(localStorage.getItem(DB_KEY))); }
  catch (e) { return defaultDB(); }
};

const saveDB = () => {
  try {
    localStorage.setItem(DB_KEY, JSON.stringify(db));
  } catch (e) {
    console.error("Save failed:", e);
    toast("Save failed — storage may be full (try a smaller logo/signature image)", "err");
  }
};

// Swap in a whole database from a backup/restore. Always normalised first, so a
// backup from an older build can't leave the app in a state it can't render.
const replaceDB = (raw) => { db = normalizeDB(raw); saveDB(); };

let db = loadDB();

// Units for the active business (falls back to a sensible default outside biz context)
const bizUnits = () => (activeBiz()?.units && activeBiz().units.length) ? activeBiz().units : DEFAULT_UNITS;

const uid = (kind) => { if (!db.nextIds) db.nextIds = {}; if (db.nextIds[kind] === undefined) db.nextIds[kind] = 1; const id = db.nextIds[kind]++; saveDB(); return id; };

// ==================== SAVE FOLDER (File System Access API) ====================
// Directory handles can't go in localStorage (not JSON-serializable), so they live in IndexedDB.
const IDB_NAME = "pipomaker_fsa";
const idbOpen = () => new Promise((res, rej) => {
  const req = indexedDB.open(IDB_NAME, 1);
  req.onupgradeneeded = () => req.result.createObjectStore("handles");
  req.onsuccess = () => res(req.result);
  req.onerror = () => rej(req.error);
});
const idbSet = async (key, val) => {
  const d = await idbOpen();
  return new Promise((res, rej) => {
    const tx = d.transaction("handles", "readwrite");
    tx.objectStore("handles").put(val, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
};
const idbGet = async (key) => {
  const d = await idbOpen();
  return new Promise((res, rej) => {
    const tx = d.transaction("handles", "readonly");
    const req = tx.objectStore("handles").get(key);
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
};
const idbDelete = async (key) => {
  const d = await idbOpen();
  return new Promise((res, rej) => {
    const tx = d.transaction("handles", "readwrite");
    tx.objectStore("handles").delete(key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
};

const supportsFSA = () => "showDirectoryPicker" in window;

const verifyDirPermission = async (handle, write = true) => {
  const opts = { mode: write ? "readwrite" : "read" };
  if ((await handle.queryPermission(opts)) === "granted") return true;
  if ((await handle.requestPermission(opts)) === "granted") return true;
  return false;
};

const chooseSaveFolder = async () => {
  if (!supportsFSA()) { toast("Folder picking needs Chrome or Edge on desktop", "err"); return; }
  try {
    const handle = await window.showDirectoryPicker();
    const ok = await verifyDirPermission(handle);
    if (!ok) { toast("Permission to that folder was denied", "err"); return; }
    await idbSet(`dir_${db.activeBusinessId}`, handle);
    const biz = activeBiz();
    if (biz) { biz.saveFolderDisplayName = handle.name; saveDB(); }
    toast(`Save folder set to "${handle.name}"`);
    render();
  } catch (e) {
    if (e.name !== "AbortError") { console.error(e); toast("Couldn't set that folder", "err"); }
  }
};

const clearSaveFolder = async () => {
  await idbDelete(`dir_${db.activeBusinessId}`);
  const biz = activeBiz();
  if (biz) { delete biz.saveFolderDisplayName; saveDB(); }
  toast("Save folder cleared");
  render();
};

const getSaveFolderHandle = async () => {
  if (!supportsFSA()) return null;
  try { return (await idbGet(`dir_${db.activeBusinessId}`)) || null; }
  catch (e) { return null; }
};

// Writes a Blob straight into the chosen folder. Returns true on success, false to fall back to a normal download.
const writeToFolder = async (blob, filename, subfolder) => {
  const dirHandle = await getSaveFolderHandle();
  if (!dirHandle) return false;
  try {
    const ok = await verifyDirPermission(dirHandle);
    if (!ok) return false;
    let target = dirHandle;
    if (subfolder) target = await target.getDirectoryHandle(subfolder, { create: true });
    const fileHandle = await target.getFileHandle(filename, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(blob);
    await writable.close();
    // Report where it actually landed so the file is findable.
    return { name: dirHandle.name || "chosen folder", sub: subfolder || "" };
  } catch (e) {
    console.error("writeToFolder failed:", e);
    return false;
  }
};

// ==================== HELPERS ====================
const $ = (sel) => document.querySelector(sel);
// Attributes whose presence alone means "on", so `checked: false` has to
// remove them rather than set the string "false" (which reads as on).
const BOOL_ATTRS = new Set(["checked", "disabled", "selected", "readonly", "required", "multiple", "open", "hidden"]);
const el = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") e.className = v;
    else if (k === "style") Object.assign(e.style, v);
    else if (k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), v);
    // A textarea's text lives in its content, not a value attribute — setting
    // the attribute silently leaves the box empty. Assign the property instead.
    else if (k === "value" && tag === "textarea") e.value = v ?? "";
    else if (BOOL_ATTRS.has(k)) e[k] = !!v;
    else if (v !== null && v !== undefined) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) {
    if (k == null || k === false) continue;
    e.appendChild(typeof k === "string" ? document.createTextNode(k) : k);
  }
  return e;
};
// ---- Busy / progress helpers ----
// Let the browser paint before we carry on. Bulk loops are synchronous, so
// without this the spinner never actually appears on screen.
const nextFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));

// Turn a button into a spinner + live label for the duration of an operation.
// Returns { set, done } — call done() to put the original button back.
const btnBusy = (btn, label) => {
  if (!btn) return { set: () => {}, done: () => {} };
  const orig = btn.innerHTML;
  const wasDisabled = btn.disabled;
  btn.disabled = true;
  btn.innerHTML = "";
  btn.appendChild(el("span", { class: "spin" }));
  const txt = el("span", {}, label || "Working…");
  btn.appendChild(txt);
  return {
    set: (s) => { txt.textContent = s; },
    done: () => { btn.innerHTML = orig; btn.disabled = wasDisabled; },
  };
};

// Run `fn(item, i)` over a list in chunks so the button's spinner and its
// "12/340" counter stay live instead of the whole tab freezing. Small lists
// finish in one pass — the yield only costs a frame when it's worth it.
const runBulk = async (btn, label, items, fn, chunk = 40) => {
  const total = items.length;
  const busy = btnBusy(btn, total > chunk ? `${label} 0/${total}` : label);
  await nextFrame();
  try {
    for (let i = 0; i < total; i++) {
      fn(items[i], i);
      if (total > chunk && (i + 1) % chunk === 0) {
        busy.set(`${label} ${i + 1}/${total}`);
        await nextFrame();
      }
    }
  } finally { busy.done(); }
};

// Soft delete with an undo window. Removes the record immediately (so the UI
// updates) but keeps it in memory; the toast can put it straight back.
let undoTimer = null;
const deleteWithUndo = (label, removeFn, restoreFn, ms = 8000) => {
  removeFn();
  saveDB(); render();
  if (undoTimer) clearTimeout(undoTimer);
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = el("div", { class: "toast undo-toast" });
  t.appendChild(el("span", {}, `${label} deleted`));
  t.appendChild(el("button", { class: "undo-btn", onclick: () => {
    restoreFn(); saveDB(); render();
    t.remove(); if (undoTimer) clearTimeout(undoTimer);
    toast("Restored");
  } }, "Undo"));
  document.body.appendChild(t);
  undoTimer = setTimeout(() => {
    t.style.transition = "opacity .25s ease, transform .25s ease";
    t.style.opacity = "0"; t.style.transform = "translate(-50%, 8px)";
    setTimeout(() => t.remove(), 250);
  }, ms);
};

// ==================== BULK SELECTION ====================
// One selection set per list kind. Entering select mode adds checkboxes to rows
// and shows an action bar; deletes route through deleteWithUndo so they're
// recoverable.
const bulkSel = { kind: null, ids: new Set() };

const bulkActive = (kind) => bulkSel.kind === kind;
const bulkToggleMode = (kind) => {
  if (bulkSel.kind === kind) { bulkSel.kind = null; bulkSel.ids.clear(); }
  else { bulkSel.kind = kind; bulkSel.ids.clear(); }
  render();
};
const bulkToggleId = (id) => {
  bulkSel.ids.has(id) ? bulkSel.ids.delete(id) : bulkSel.ids.add(id);
  updateBulkBar();
};
// Checkbox prepended to a row when its list is in select mode.
const bulkCheckbox = (kind, id) => {
  if (!bulkActive(kind)) return null;
  const cb = el("input", { type: "checkbox", class: "bulk-cb",
    onclick: (e) => { e.stopPropagation(); bulkToggleId(id); } });
  cb.checked = bulkSel.ids.has(id);
  return cb;
};

// Recomputes the count/label in the bar without a full re-render.
const updateBulkBar = () => {
  const lbl = document.getElementById("bulk-count");
  if (lbl) lbl.textContent = `${bulkSel.ids.size} selected`;
  const del = document.getElementById("bulk-delete");
  if (del) del.disabled = bulkSel.ids.size === 0;
  document.querySelectorAll(".bulk-cb").forEach(cb => {
    const row = cb.closest(".list-item");
    if (row) row.classList.toggle("row-selected", cb.checked);
  });
};

// The bar shown above a list while selecting. `onDelete` receives the ids.
const bulkBar = (kind, allIds, onDelete, extraActions) => {
  const bar = el("div", { class: "bulk-bar" });
  const left = el("div", { style: { display: "flex", alignItems: "center", gap: "8px", flexWrap: "wrap" } });
  left.appendChild(el("span", { id: "bulk-count", style: { fontSize: "12.5px", fontWeight: 700, color: "var(--primary)" } },
    `${bulkSel.ids.size} selected`));
  left.appendChild(el("button", { class: "btn btn-secondary bulk-mini", onclick: () => {
    const visible = allIds();
    const allOn = visible.every(id => bulkSel.ids.has(id));
    visible.forEach(id => allOn ? bulkSel.ids.delete(id) : bulkSel.ids.add(id));
    render();
  }}, "Select all"));
  bar.appendChild(left);
  const right = el("div", { style: { display: "flex", gap: "6px", flexWrap: "wrap" } });
  (extraActions || []).forEach(b => right.appendChild(b));
  const del = el("button", { class: "btn btn-danger bulk-mini", id: "bulk-delete",
    onclick: () => onDelete([...bulkSel.ids]) }, "🗑 Delete");
  del.disabled = bulkSel.ids.size === 0;
  right.appendChild(del);
  right.appendChild(el("button", { class: "btn btn-secondary bulk-mini", onclick: () => bulkToggleMode(kind) }, "Done"));
  bar.appendChild(right);
  return bar;
};

// Copy text to clipboard (so it can be pasted anywhere), then also open the
// device share sheet if available.
const shareText = async (text, title) => {
  let copied = false;
  try { await navigator.clipboard.writeText(text); copied = true; }
  catch (e) {
    // Fallback copy for browsers without clipboard API / non-secure contexts.
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove(); copied = true;
    } catch (_) {}
  }
  if (copied) toast("Copied — paste anywhere");
  try { if (navigator.share) await navigator.share({ text, title: title || "" }); }
  catch (e) { /* user dismissed share sheet — copy already done */ }
};
// Bulk-paste-compatible line formats (match the Bulk add parsers exactly).
const productToLine = (p) => [p.description, p.unit || "pcs", p.rate || 0, (Array.isArray(p.path) && p.path[0]) || p.category || "", p.partNumber || "", p.hsn || "", p.weight || "", p.taxable === false ? "no" : "yes", p.notes || ""].join(", ");
const customerToLine = (c) => [c.companyName, c.contactName || "", c.phone || "", c.addr1 || c.address1 || "", c.addr2 || c.address2 || "", c.vatNo || "", c.email || "", c.regNo || "", c.eximCode || "", c.country || ""].join(", ");

const toast = (msg, kind = "ok", ms = 1800) => {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = el("div", { class: `toast ${kind}` }, msg);
  document.body.appendChild(t);
  setTimeout(() => {
    t.style.transition = "opacity .25s ease, transform .25s ease";
    t.style.opacity = "0";
    t.style.transform = "translate(-50%, 8px)";
    setTimeout(() => t.remove(), 250);
  }, ms);
};

const fmt = (n) => Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

// Convert a number to words using the Indian numbering system (Lakh / Crore).
// Used for the "In words" line on documents.
const numToWordsIN = (num) => {
  const ones = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
  const tens = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];
  const two = (n) => n < 20 ? ones[n] : (tens[Math.floor(n / 10)] + (n % 10 ? " " + ones[n % 10] : ""));
  const three = (n) => {
    const h = Math.floor(n / 100), r = n % 100;
    return (h ? ones[h] + " Hundred" + (r ? " " : "") : "") + (r ? two(r) : "");
  };
  if (num === 0) return "Zero";
  let words = "";
  const crore = Math.floor(num / 10000000); num %= 10000000;
  const lakh = Math.floor(num / 100000); num %= 100000;
  const thousand = Math.floor(num / 1000); num %= 1000;
  const hundred = num;
  if (crore) words += three(crore) + " Crore ";
  if (lakh) words += two(lakh) + " Lakh ";
  if (thousand) words += two(thousand) + " Thousand ";
  if (hundred) words += three(hundred);
  return words.trim();
};
// Full currency amount in words, incl. paisa/cents. e.g. "Nepalese Rupees One Thousand Only"
const amountToWords = (amount, currency) => {
  const names = { NPR: ["Nepalese Rupees", "Paisa"], INR: ["Indian Rupees", "Paisa"], USD: ["US Dollars", "Cents"], EUR: ["Euros", "Cents"] };
  const [main, sub] = names[currency] || [currency, "Cents"];
  const n = Math.round((Number(amount) || 0) * 100) / 100;
  const whole = Math.floor(n);
  const frac = Math.round((n - whole) * 100);
  let out = `${main} ${numToWordsIN(whole)}`;
  if (frac > 0) out += ` and ${numToWordsIN(frac)} ${sub}`;
  return out + " Only";
};

// Nepali bank codes (SWIFT/BIC) used by the payment-QR format. Matches the
// bank-QR generator these QRs are scanned by, so wallets recognise the account.
const NEPAL_BANK_CODES = [
  ["ADBLNPKA", "AGRICULTURAL DEVELOPMENT BANK LTD"],

// Build a QR-code <img> (data URL) for the given text. Uses the bundled
// qrcode-generator, so it works fully offline and renders into the PDF canvas.
// ecLevel matches the source generator ("L" for the bank payment format).
// `alt` describes what scanning the code actually does — a screen reader user
// gets no information at all from the image itself.
const makeQRImg = (text, px = 96, ecLevel = "L", alt = "QR code") => {
  try {
    const qr = window.__qrcode(0, ecLevel);
    qr.addData(text);
    qr.make();
    const count = qr.getModuleCount();
    const cell = Math.max(2, Math.floor(px / (count + 2)));
    const url = qr.createDataURL(cell, cell); // second arg = margin cells
    return el("img", { src: url, alt, style: { width: px + "px", height: px + "px", display: "block" } });
  } catch (e) { return null; }
};

// ==================== CATEGORY TREE & DISCOUNTS ====================
// A product's category path, deepest-last, e.g. ["Water Tank","Plastic","1000L"].
const productPath = (p) => [p.category, p.subCategory1, p.subCategory2, p.subCategory3]
  .map(x => (x || "").trim()).filter(Boolean);

// Build the real category tree from the catalogue, so pickers only ever offer
// paths that actually exist. Returns nested { name, path, children:[], count }.
const buildCategoryTree = (products) => {
  const root = { name: "", path: [], children: [], count: 0 };
  (products || []).forEach(p => {
    const path = productPath(p);
    let node = root;
    node.count++;
    path.forEach((seg, i) => {
      let child = node.children.find(c => c.name === seg);
      if (!child) {
        child = { name: seg, path: path.slice(0, i + 1), children: [], count: 0 };
        node.children.push(child);
      }
      child.count++;
      node = child;
    });
  });
  const sortRec = (n) => { n.children.sort((a, b) => a.name.localeCompare(b.name)); n.children.forEach(sortRec); };
  sortRec(root);
  return root;
};

const pathKey = (path) => (path || []).join(" › ");

// A category's unit entry can be a legacy plain array (old format) or the
// current { allowed: [...], default: "" } shape. Always read through this.
const normCatUnitEntry = (raw) => {
  if (Array.isArray(raw)) return { allowed: raw, default: "" };
  if (raw && typeof raw === "object") return { allowed: Array.isArray(raw.allowed) ? raw.allowed : [], default: raw.default || "" };
  return { allowed: [], default: "" };
};

// Units allowed at a given category path. Set at a level, inherits DOWNWARD
// to sub-categories unless a deeper level overrides it. Falls back to the
// business's full master unit list when no level in the chain has one set.
const unitsForCategoryPath = (path) => {
  const biz = activeBiz();
  const map = (biz && biz.categoryUnits) || {};
  for (let i = (path || []).length; i >= 0; i--) {
    const key = pathKey((path || []).slice(0, i));
    const entry = normCatUnitEntry(map[key]);
    if (entry.allowed.length) return entry.allowed;
  }
  return bizUnits();
};

// Default unit at a given category path — the one a new product's Unit
// field auto-fills to. Inherits downward the same way as allowed units.
const defaultUnitForCategoryPath = (path) => {
  const biz = activeBiz();
  const map = (biz && biz.categoryUnits) || {};
  for (let i = (path || []).length; i >= 0; i--) {
    const key = pathKey((path || []).slice(0, i));
    const entry = normCatUnitEntry(map[key]);
    if (entry.default) return entry.default;
  }
  return "";
};

// Flatten a category tree into a depth-ordered list, root excluded.
const flattenCategoryTree = (node, out = []) => {
  (node.children || []).forEach(ch => { out.push(ch); flattenCategoryTree(ch, out); });
  return out;
};

// Resolve the discount % for a product against a customer's rate card.
// Rules INHERIT DOWNWARD from the level they're set at: a rule on
// ["Water Tank","Plastic"] covers every product beneath it. When several rules
// match, the DEEPEST (most specific) one wins. No match => 0%.
const resolveDiscount = (product, rules) => {
  if (!Array.isArray(rules) || !rules.length) return { pct: 0, rule: null };
  const path = productPath(product);
  let best = null;
  rules.forEach(r => {
    const rp = (r.path || []).map(x => (x || "").trim()).filter(Boolean);
    if (!rp.length) return;
    if (rp.length > path.length) return;
    // rule matches when it is a prefix of the product's path
    const isPrefix = rp.every((seg, i) => seg === path[i]);
    if (!isPrefix) return;
    if (!best || rp.length > (best.path || []).length) best = r;
  });
  return { pct: best ? (Number(best.pct) || 0) : 0, rule: best };
};

const customerRules = (custId) => {
  const c = db.customers.find(x => x.id === custId);
  return (c && Array.isArray(c.discountRules)) ? c.discountRules : [];

// Drill-down category picker. Walks the real catalogue tree to any depth; you
// can confirm at whichever level you stop, and that level is what the rule covers.
const openCategoryPicker = (onPick, opts = {}) => {
  const multi = !!opts.multi;
  const excludeKeys = new Set((opts.excludePaths || []).map(p => pathKey(p)));
  const tree = buildCategoryTree(bizProducts());
  let node = tree;
  const selectedByKey = new Map(); // key -> path (multi mode only)
  const wrap = el("div");
  const crumb = el("div", { class: "crumb-bar" });
  const list = el("div", { class: "picker-list" });
  const footer = el("div", { class: "action-bar" });

  const draw = () => {
    crumb.innerHTML = ""; list.innerHTML = ""; footer.innerHTML = "";
    // breadcrumb
    const mk = (label, target) => el("button", { type: "button", class: "crumb", onclick: () => { node = target; draw(); } }, label);
    crumb.appendChild(mk("All categories", tree));
    node.path.forEach((seg, i) => {
      crumb.appendChild(el("span", { class: "crumb-sep" }, "›"));
      let t = tree;
      for (let k = 0; k <= i; k++) t = t.children.find(c => c.name === node.path[k]);
      crumb.appendChild(mk(seg, t));
    });

    if (node.children.length === 0) {
      list.appendChild(el("div", { class: "picker-empty" }, "No further sub-categories — this is the deepest level."));
    } else {
      node.children.forEach(ch => {
        const hasKids = ch.children.length > 0;
        const key = pathKey(ch.path);
        const alreadyPicked = excludeKeys.has(key);
        const row = el("div", { class: "picker-row" + (hasKids ? " has-kids" : "") + (alreadyPicked ? " picker-disabled" : "") });
        if (multi) {
          const cb = el("input", { type: "checkbox", class: "picker-cb", style: { flex: "none", width: "18px", height: "18px", accentColor: "#1F4E79", cursor: alreadyPicked ? "not-allowed" : "pointer" } });
          if (alreadyPicked) cb.disabled = true;
          if (selectedByKey.has(key)) cb.checked = true;
          cb.addEventListener("change", () => {
            if (cb.checked) selectedByKey.set(key, ch.path);
            else selectedByKey.delete(key);
            updateFooter();
          });
          row.appendChild(cb);
        }
        const body = el("div", { class: "picker-body",
          onclick: () => {
            if (multi) {
              if (alreadyPicked) return;
              const cb = row.querySelector(".picker-cb");
              cb.checked = !cb.checked;
              cb.dispatchEvent(new Event("change"));
            } else {
              if (hasKids) { node = ch; draw(); } else { closeModal(); onPick(ch.path); }
            }
          } });
        const txt = el("div", { style: { flex: "1", minWidth: "0" } });
        txt.appendChild(el("div", { style: { fontWeight: 600, fontSize: "13.5px" } }, ch.name));
        const subBits = [`${ch.count} product${ch.count === 1 ? "" : "s"}`];
        if (hasKids) subBits.push(`${ch.children.length} sub-categor${ch.children.length === 1 ? "y" : "ies"}`);
        if (alreadyPicked) subBits.push("already added");
        txt.appendChild(el("div", { style: { fontSize: "11px", color: "var(--muted)", marginTop: "1px" } }, subBits.join(" • ")));
        body.appendChild(txt);
        if (hasKids && !multi) body.appendChild(el("span", { class: "picker-chev" }, "›"));
        row.appendChild(body);
        if (multi && hasKids) {
          // Give a way to drill in during multi-select without toggling the checkbox
          row.appendChild(el("button", { class: "btn btn-secondary picker-use",
            onclick: (e) => { e.stopPropagation(); node = ch; draw(); } }, "Open"));
        } else if (!multi) {
          row.appendChild(el("button", { class: "btn btn-secondary picker-use",
            onclick: (e) => { e.stopPropagation(); closeModal(); onPick(ch.path); } }, "Use"));
        }
        list.appendChild(row);
      });
    }

    updateFooter();
  };

  const updateFooter = () => {
    footer.innerHTML = "";
    footer.appendChild(el("button", { class: "btn btn-secondary", onclick: closeModal }, "Cancel"));
    if (multi) {
      const n = selectedByKey.size;
      const btn = el("button", { class: "btn btn-primary", onclick: () => {
        if (n === 0) { toast("Tick at least one category", "err"); return; }
        closeModal();
        onPick(Array.from(selectedByKey.values()));
      }}, n ? `Add ${n} categor${n === 1 ? "y" : "ies"}` : "Add categories");
      if (n === 0) btn.style.opacity = "0.55";
      footer.appendChild(btn);
    } else if (node.path.length) {
      footer.appendChild(el("button", { class: "btn btn-primary", onclick: () => { closeModal(); onPick(node.path); } },
        `Use all of "${node.name}"`));
    }
  };

  wrap.appendChild(crumb);
  wrap.appendChild(el("div", { style: { fontSize: "11px", color: "var(--muted)", margin: "4px 0 8px" } },
    multi ? "Tick one or more categories. Each becomes its own rule." : "Pick any level. The discount applies to everything inside it."));
  wrap.appendChild(list);
  wrap.appendChild(footer);
  draw();
  openModal(multi ? "Choose categories" : "Choose category", wrap);
};

    .replace('{YYYY}', d.getFullYear())
    .replace('{YY}', String(d.getFullYear()).slice(-2))
    .replace('{MM}', String(d.getMonth() + 1).padStart(2, '0'))

// True while a history entry is "reserved" for the current chain of open modals.
